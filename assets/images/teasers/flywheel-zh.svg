  <path d="M558 400h84m-9-9 9 9-9 9" fill="none" stroke="#7954b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#7954b8">若仍出错</text>
