<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 385" role="img" aria-labelledby="title desc"><title id="title">可执行的独立审查</title><desc id="desc">每题先做 CPU 检查，再付费盲解；实际执行盲解程序后才做对抗审查，审查者的不同程序也须执行。每次模型调用独立预留、结算；任一关卡未决则隔离。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="30" y="45" width="300" height="85" rx="10"/><text class="label" text-anchor="middle" x="180.0" y="74.5"><tspan x="180.0" dy="0">来源＋独立答案</tspan><tspan x="180.0" dy="26">规范任务身份</tspan></text><rect class="box" x="395" y="45" width="300" height="85" rx="10"/><text class="label" text-anchor="middle" x="545.0" y="74.5"><tspan x="545.0" dy="0">预留 → 原生代理</tspan><tspan x="545.0" dy="26">盲解 · Medium</tspan></text><rect class="box" x="760" y="45" width="300" height="85" rx="10"/><text class="label" text-anchor="middle" x="910.0" y="74.5"><tspan x="910.0" dy="0">实际沙箱</tspan><tspan x="910.0" dy="26">执行盲解程序</tspan></text><path class="edge" d="M330,87 H390"/><path class="edge" d="M695,87 H755"/><path class="edge" d="M910,130 V210"/><rect class="box" x="760" y="215" width="300" height="85" rx="10"/><text class="label" text-anchor="middle" x="910.0" y="244.5"><tspan x="910.0" dy="0">预留 → 原生代理</tspan><tspan x="910.0" dy="26">对抗审查 · Medium</tspan></text><rect class="box" x="395" y="215" width="300" height="85" rx="10"/><text class="label" text-anchor="middle" x="545.0" y="244.5"><tspan x="545.0" dy="0">实际沙箱</tspan><tspan x="545.0" dy="26">执行不同反查程序</tspan></text><rect class="green" x="30" y="215" width="300" height="85" rx="10"/><text class="label" text-anchor="middle" x="180.0" y="244.5"><tspan x="180.0" dy="0">题目质量关卡</tspan><tspan x="180.0" dy="26">未决题保持隔离</tspan></text><path class="edge" d="M760,257 H700"/><path class="edge" d="M395,257 H335"/><text class="small" text-anchor="middle" x="550" y="350"><tspan x="550" dy="0">每次付费调用后保存原始响应并结算；来源或题面实质改变须重新审查。</tspan></text></svg>
