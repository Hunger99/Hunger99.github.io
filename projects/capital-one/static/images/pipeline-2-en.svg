<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Two authors share one compiler and review path</title><desc id="desc">The upper CPU lane and lower Claude-author lane are parallel alternatives. The lower lane binds the prompt and reserves cost from a conservative configured input bound before the proxy call, then settles actual usage. Both lanes merge into one compiler and semantic inventory before common review.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="45" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="110.0" y="74.5"><tspan x="110.0" dy="0">Reviewed sources</tspan><tspan x="110.0" dy="26">Fixed stage role</tspan></text><rect class="box" x="260" y="40" width="205" height="80" rx="10"/><text class="label" text-anchor="middle" x="362.5" y="67.0"><tspan x="362.5" dy="0">Program author</tspan><tspan x="362.5" dy="26">CPU only</tspan></text><path class="edge" d="M200,87 H255"/><path class="edge" d="M220,87 V225 H255"/><rect class="lane" x="245" y="155" width="825" height="150" rx="12"/><text class="small" text-anchor="start" x="270" y="181"><tspan x="270" dy="0">Claude-author branch — one fresh native conversation</tspan></text><rect class="box" x="260" y="200" width="150" height="70" rx="10"/><text class="label" text-anchor="middle" x="335.0" y="222.0"><tspan x="335.0" dy="0">Bind prompt</tspan><tspan x="335.0" dy="26">Input bound</tspan></text><rect class="box" x="430" y="200" width="155" height="70" rx="10"/><text class="label" text-anchor="middle" x="507.5" y="222.0"><tspan x="507.5" dy="0">Reserve cost</tspan><tspan x="507.5" dy="26">Shared lock</tspan></text><rect class="box" x="605" y="200" width="250" height="70" rx="10"/><text class="label" text-anchor="middle" x="730.0" y="222.0"><tspan x="730.0" dy="0">CLIProxyAPI → Opus</tspan><tspan x="730.0" dy="26">Extra High</tspan></text><rect class="box" x="875" y="200" width="175" height="70" rx="10"/><text class="label" text-anchor="middle" x="962.5" y="222.0"><tspan x="962.5" dy="0">Save raw reply</tspan><tspan x="962.5" dy="26">Settle ledger</tspan></text><path class="edge" d="M410,235 H425"/><path class="edge" d="M585,235 H600"/><path class="edge" d="M855,235 H870"/><rect class="box" x="400" y="355" width="250" height="85" rx="10"/><text class="label" text-anchor="middle" x="525.0" y="384.5"><tspan x="525.0" dy="0">Typed host compiler</tspan><tspan x="525.0" dy="26">Render task + reference</tspan></text><rect class="box" x="705" y="355" width="220" height="85" rx="10"/><text class="label" text-anchor="middle" x="815.0" y="384.5"><tspan x="815.0" dy="0">Semantic inventory</tspan><tspan x="815.0" dy="26">One canonical task</tspan></text><path class="edge" d="M465,80 H1088 V330 H525 V350"/><path class="edge" d="M962,270 V330 H525 V350"/><path class="edge" d="M650,397 H700"/><text class="small" text-anchor="middle" x="815" y="480"><tspan x="815" dy="0">Next: common review; no quota from an unreviewed candidate.</tspan></text></svg>
