<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Harness Architecture</title>
<desc id="desc">A serial Python tool loop connects Prompt engineering, Coding Agent Harness, Tool categories, Access control, sandbox, Codified rules and Agent state tracking, then returns to the model.</desc>
