<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">难度与示范准入</title><desc id="desc">同题教师与学生试答可独立进行，真实结果将 SFT 候选送往完整且有依据的示范审查及打包；DAPO 任务另行采集试答，隔离题停止。报告片段不算新题。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="105" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="110.0" y="147.5"><tspan x="110.0" dy="0">已审任务</tspan></text><rect class="box" x="260" y="30" width="215" height="80" rx="10"/><text class="label" text-anchor="middle" x="367.5" y="57.0"><tspan x="367.5" dy="0">教师试答</tspan><tspan x="367.5" dy="26">候选轨迹</tspan></text><rect class="box" x="260" y="205" width="215" height="80" rx="10"/><text class="label" text-anchor="middle" x="367.5" y="232.0"><tspan x="367.5" dy="0">学生试答</tspan><tspan x="367.5" dy="26">成功率差异</tspan></text><path class="edge" d="M200,147 H225 V70 H255"/><path class="edge" d="M225,147 V245 H255"/><rect class="box" x="535" y="105" width="220" height="85" rx="10"/><text class="label" text-anchor="middle" x="645.0" y="134.5"><tspan x="645.0" dy="0">难度与去向</tspan><tspan x="645.0" dy="26">SFT／DAPO／隔离</tspan></text><path class="edge" d="M475,70 H505 V147 H530"/><path class="edge" d="M475,245 H505 V147"/><rect class="green" x="815" y="105" width="260" height="85" rx="10"/><text class="label" text-anchor="middle" x="945.0" y="134.5"><tspan x="945.0" dy="0">完整且有依据的轨迹</tspan><tspan x="945.0" dy="26">独立审查 → 打包</tspan></text><path class="edge" d="M755,147 H810"/><text class="small" text-anchor="middle" x="550" y="385"><tspan x="550" dy="0">仅训练／校准试答选择难度；全同奖励不能形成 DAPO 的回答优劣信号。</tspan></text><text class="small" text-anchor="middle" x="782" y="132">SFT</text><path class="edge" d="M645,190 V245"/><path class="edge" d="M645,220 H945 V245"/><rect class="box" x="535" y="250" width="220" height="65" rx="10"/><text class="label" text-anchor="middle" x="645.0" y="274"><tspan x="645.0" dy="0">DAPO 任务</tspan><tspan x="645.0" dy="25">另行采集试答</tspan></text><rect class="amber" x="815" y="250" width="260" height="65" rx="10"/><text class="label" text-anchor="middle" x="945.0" y="274"><tspan x="945.0" dy="0">隔离</tspan><tspan x="945.0" dy="25">准入前停止</tspan></text></svg>
