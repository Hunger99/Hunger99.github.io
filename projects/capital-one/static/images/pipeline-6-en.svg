<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 315" role="img" aria-labelledby="title desc"><title id="title">DAPO reward and policy masks</title><desc id="desc">Each starting checkpoint has an original-only and an original-plus-synthetic continuation. Reward shaping counts generated tokens, while the entire policy-loss mask is zero for an unfinished rollout. The distributed training run remains unverified.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="75" width="190" height="85" rx="10"/><text class="label" text-anchor="middle" x="115.0" y="104.5"><tspan x="115.0" dy="0">Base / S0 / S1</tspan><tspan x="115.0" dy="26">O or O + R</tspan></text><rect class="box" x="260" y="75" width="210" height="85" rx="10"/><text class="label" text-anchor="middle" x="365.0" y="104.5"><tspan x="365.0" dy="0">Grouped rollouts</tspan><tspan x="365.0" dy="26">Real tool results</tspan></text><rect class="box" x="520" y="75" width="240" height="85" rx="10"/><text class="label" text-anchor="middle" x="640.0" y="104.5"><tspan x="640.0" dy="0">Native reward</tspan><tspan x="640.0" dy="26">Generated-token penalty</tspan></text><rect class="box" x="820" y="75" width="260" height="85" rx="10"/><text class="label" text-anchor="middle" x="950.0" y="104.5"><tspan x="950.0" dy="0">Policy mask</tspan><tspan x="950.0" dy="26">Unfinished → all zero</tspan></text><path class="edge" d="M210,117 H255"/><path class="edge" d="M470,117 H515"/><path class="edge" d="M760,117 H815"/><text class="label" text-anchor="middle" x="550" y="220"><tspan x="550" dy="0">Filter groups without reward variation → update the matched continuation.</tspan></text><text class="small" text-anchor="middle" x="550" y="270"><tspan x="550" dy="0">Tool returns remain context, not generated-length or policy-loss tokens.</tspan></text></svg>
