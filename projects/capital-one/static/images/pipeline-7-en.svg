<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">One evaluation release for nine candidates</title><desc id="desc">All nine candidates use the same frozen evaluation release. Original benchmarks and synthetic challenges remain separately scored, and only validation can select a checkpoint; final test outcomes do not return to generation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="105" width="200" height="85" rx="10"/><text class="label" text-anchor="middle" x="120.0" y="134.5"><tspan x="120.0" dy="0">One frozen release</tspan><tspan x="120.0" dy="26">Same tools + graders</tspan></text><rect class="box" x="290" y="105" width="230" height="85" rx="10"/><text class="label" text-anchor="middle" x="405.0" y="134.5"><tspan x="405.0" dy="0">All nine candidates</tspan><tspan x="405.0" dy="26">Base / SFT / DAPO</tspan></text><rect class="box" x="590" y="30" width="235" height="80" rx="10"/><text class="label" text-anchor="middle" x="707.5" y="57.0"><tspan x="707.5" dy="0">Original cohorts</tspan><tspan x="707.5" dy="26">Native dataset scores</tspan></text><rect class="box" x="590" y="205" width="235" height="80" rx="10"/><text class="label" text-anchor="middle" x="707.5" y="232.0"><tspan x="707.5" dy="0">Synthetic challenges</tspan><tspan x="707.5" dy="26">Separate scores</tspan></text><rect class="green" x="885" y="105" width="195" height="85" rx="10"/><text class="label" text-anchor="middle" x="982.5" y="134.5"><tspan x="982.5" dy="0">Paired comparison</tspan><tspan x="982.5" dy="26">Test stays sealed</tspan></text><path class="edge" d="M220,147 H285"/><path class="edge" d="M520,147 H555 V70 H585"/><path class="edge" d="M555,147 V245 H585"/><path class="edge" d="M825,70 H850 V147 H880"/><path class="edge" d="M825,245 H850 V147"/></svg>
