<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Harness: observations come from host execution</title><desc id="desc">One episode appends messages; each task selects its declared environment.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7654a3" stroke-width="1.6"/></marker></defs><rect width="1000" height="650" rx="18" fill="#faf8fd"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#30243e}.title{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:15px;fill:#5b5266}.node{fill:white;stroke:#b59bcc;stroke-width:1.5}.line{fill:none;stroke:#7654a3;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="40" class="title">Harness: observations come from host execution</text><text x="32" y="68" class="small">One episode appends messages; each task selects its declared environment.</text><rect class="node" x="32" y="105" width="270" height="84" rx="10" style="fill:white"/><text x="167.0" y="136" text-anchor="middle" class="label">Task + system prompt</text><text x="167.0" y="161" text-anchor="middle" class="small">Environment tools only</text><rect class="node" x="365" y="105" width="270" height="84" rx="10" style="fill:white"/><text x="500.0" y="136" text-anchor="middle" class="label">Model turn</text><text x="500.0" y="161" text-anchor="middle" class="small">Task / token / redo limits</text><rect class="node" x="698" y="105" width="270" height="84" rx="10" style="fill:white"/><text x="833.0" y="136" text-anchor="middle" class="label">Host tool dispatch</text><text x="833.0" y="161" text-anchor="middle" class="small">JSON + known-tool checks</text><rect class="node" x="698" y="246" width="270" height="84" rx="10" style="fill:white"/><text x="833.0" y="277" text-anchor="middle" class="label">Read-only source / sandbox</text><text x="833.0" y="302" text-anchor="middle" class="small">Bounded result + provenance</text><rect class="node" x="365" y="246" width="270" height="84" rx="10" style="fill:white"/><text x="500.0" y="277" text-anchor="middle" class="label">finish: H1 verification</text><text x="500.0" y="302" text-anchor="middle" class="small">Bounded correction feedback</text><rect class="node" x="32" y="246" width="270" height="84" rx="10" style="fill:white"/><text x="167.0" y="277" text-anchor="middle" class="label">Independent grader</text><text x="167.0" y="302" text-anchor="middle" class="small">Saved answer / submission</text><rect class="node" x="32" y="381" width="603" height="75" rx="10" style="fill:#f0e9f8"/><text x="333.5" y="412" text-anchor="middle" class="label">Separate admission gates</text><text x="333.5" y="437" text-anchor="middle" class="small">Question → demonstration → training</text><path class="line" d="M302 147 H365"/><path class="line" d="M635 147 H698"/><path class="line" d="M833 189 V246"/><path class="line" d="M365 287 H302"/><path class="line" d="M167 330 V381"/><path class="line" d="M698 287 H669 V215 H500 V189"/><path class="line" d="M550 189 V246"/><path class="line" d="M430 246 V215 H460 V189"/><text x="590" y="233" text-anchor="middle" class="small">append real observation</text><text x="300" y="233" class="small">correction feedback</text><path d="M32 482 H968" stroke="#d2c5df" stroke-dasharray="6 5"/><rect class="node" x="32" y="514" width="270" height="86" rx="10" style="fill:white"/><text x="167.0" y="545" text-anchor="middle" class="label">Synthetic-data API roles</text><text x="167.0" y="570" text-anchor="middle" class="small">Fresh author / blind / critic requests</text><rect class="node" x="365" y="514" width="270" height="86" rx="10" style="fill:white"/><text x="500.0" y="545" text-anchor="middle" class="label">Before each API request</text><text x="500.0" y="570" text-anchor="middle" class="small">Scope + input bound + reserve</text><rect class="node" x="698" y="514" width="270" height="86" rx="10" style="fill:white"/><text x="833.0" y="545" text-anchor="middle" class="label">Native Messages proxy</text><text x="833.0" y="570" text-anchor="middle" class="small">Provider reply → usage ledger</text><path class="line" d="M302 557 H365"/><path class="line" d="M635 557 H698"/><text x="32" y="630" class="small">Finishing or retrieving alone does not establish correctness.</text></svg>