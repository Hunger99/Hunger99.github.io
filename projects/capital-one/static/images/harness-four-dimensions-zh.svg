<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5c92"/></marker></defs><rect width="1200" height="740" rx="16" fill="#fff"/><g font-family="Arial,Noto Sans CJK SC,sans-serif"><text x="600" y="35" text-anchor="middle" font-size="25" fill="#273449"><tspan x="600" dy="0">已实现的 Harness 运行关系</tspan></text><text x="600" y="68" text-anchor="middle" font-size="16" fill="#273449"><tspan x="600" dy="0">多个独立任务可并发；同一任务的工具调用按顺序执行。H1 控制只在启用 H1 时生效。</tspan></text><rect x="30" y="112" width="225" height="82" rx="12" fill="#f3f0ff" stroke="#8a78bc"/><text x="142.5" y="141" text-anchor="middle" font-size="17" fill="#273449"><tspan x="142.5" dy="0">任务＋环境提示词</tspan><tspan x="142.5" dy="24">独立初始化每次尝试</tspan></text><rect x="300" y="112" width="245" height="82" rx="12" fill="#f3f0ff" stroke="#8a78bc"/><text x="422.5" y="141" text-anchor="middle" font-size="17" fill="#273449"><tspan x="422.5" dy="0">追加式上下文</tspan><tspan x="422.5" dy="24">H1：清单与完成状态</tspan></text><rect x="600" y="112" width="220" height="82" rx="12" fill="#f3f0ff" stroke="#8a78bc"/><text x="710.0" y="141" text-anchor="middle" font-size="17" fill="#273449"><tspan x="710.0" dy="0">模型</tspan><tspan x="710.0" dy="24">决定调用工具或结束</tspan></text><rect x="875" y="112" width="285" height="82" rx="12" fill="#f3f0ff" stroke="#8a78bc"/><text x="1017.5" y="141" text-anchor="middle" font-size="17" fill="#273449"><tspan x="1017.5" dy="0">已知工具分派</tspan><tspan x="1017.5" dy="24">JSON 参数；H1 写前规则</tspan></text><path d="M255 153 H300" fill="none" stroke="#6b5c92" stroke-width="2" marker-end="url(#arrow)"/><path d="M545 153 H600" fill="none" stroke="#6b5c92" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 153 H875" fill="none" stroke="#6b5c92" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="300" width="315" height="90" rx="12