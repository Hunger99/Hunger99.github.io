<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Harness Architecture</title>
<desc id="desc">Python 工具调用按串行循环执行：提示工程、编码智能体运行框架、工具分类、权限控制、sandbox、代码化规则、智能体状态记录，再返回模型。</desc>
