<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 200" role="img" aria-labelledby="title desc"><title id="title">Sources and isolated pools</title><desc id="desc">Original files → one report version → source meaning and task contract → isolated source roles → frozen pools. Failure at a source check holds the affected task.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="55" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="110.0" y="97.5"><tspan x="110.0" dy="0">Original files</tspan></text><rect class="box" x="230" y="55" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="320.0" y="97.5"><tspan x="320.0" dy="0">Canonical report</tspan></text><path class="edge" d="M200,97 H225"/><rect class="box" x="440" y="55" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="530.0" y="84.5"><tspan x="530.0" dy="0">Source meaning</tspan><tspan x="530.0" dy="26">Task contract</tspan></text><path class="edge" d="M410,97 H435"/><rect class="box" x="650" y="55" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="740.0" y="84.5"><tspan x="740.0" dy="0">Fixed source roles</tspan><tspan x="740.0" dy="26">Train / dev / test</tspan></text><path class="edge" d="M620,97 H645"/><rect class="green" x="860" y="55" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="950.0" y="97.5"><tspan x="950.0" dy="0">Frozen pools</tspan></text><path class="edge" d="M830,97 H855"/><text class="small" text-anchor="middle" x="530" y="177"><tspan x="530" dy="0">Original targets and private grading data stay outside learner evidence.</tspan></text></svg>
