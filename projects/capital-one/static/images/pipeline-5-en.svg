<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 295" role="img" aria-labelledby="title desc"><title id="title">Two independent two-stage SFT arms</title><desc id="desc">S0 and S1 independently start from the same Base. Within either arm, supplied-evidence reasoning precedes retrieval and reasoning in one continuous training run; the two phases share the fixed total budget. Formal training has not started.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="103" width="150" height="80" rx="10"/><text class="label" text-anchor="middle" x="95.0" y="143.0"><tspan x="95.0" dy="0">Base</tspan></text><rect class="box" x="230" y="35" width="210" height="75" rx="10"/><text class="label" text-anchor="middle" x="335.0" y="59.5"><tspan x="335.0" dy="0">S0 · Phase 1</tspan><tspan x="335.0" dy="26">Given evidence · O</tspan></text><rect class="box" x="515" y="35" width="230" height="75" rx="10"/><text class="label" text-anchor="middle" x="630.0" y="59.5"><tspan x="630.0" dy="0">S0 · Phase 2</tspan><tspan x="630.0" dy="26">Retrieve + reason</tspan></text><rect class="green" x="825" y="35" width="245" height="75" rx="10"/><text class="label" text-anchor="middle" x="947.5" y="59.5"><tspan x="947.5" dy="0">S0 checkpoint</tspan><tspan x="947.5" dy="26">Continuous training state</tspan></text><path class="edge" d="M170,143 H200 V72 H225"/><path class="edge" d="M440,72 H510"/><path class="edge" d="M745,72 H820"/><rect class="box" x="230" y="175" width="210" height="75" rx="10"/><text class="label" text-anchor="middle" x="335.0" y="199.5"><tspan x="335.0" dy="0">S1 · Phase 1</tspan><tspan x="335.0" dy="26">Given evidence · O + S</tspan></text><rect class="box" x="515" y="175" width="230" height="75" rx="10"/><text class="label" text-anchor="middle" x="630.0" y="199.5"><tspan x="630.0" dy="0">S1 · Phase 2</tspan><tspan x="630.0" dy="26">Retrieve + reason</tspan></text><rect class="green" x="825" y="175" width="245" height="75" rx="10"/><text class="label" text-anchor="middle" x="947.5" y="199.5"><tspan x="947.5" dy="0">S1 checkpoint</tspan><tspan x="947.5" dy="26">Continuous training state</tspan></text><path class="edge" d="M170,143 H200 V212 H225"/><path class="edge" d="M440,212 H510"/><path class="edge" d="M745,212 H820"/><text class="small" text-anchor="middle" x="550" y="280"><tspan x="550" dy="0">Per arm: one total token/update budget across both phases; originals and evaluation remain shared.</tspan></text></svg>
