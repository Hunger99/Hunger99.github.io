<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">九组共用同一评测版本</title><desc id="desc">九组使用相同冻结评测版本；原始基准与合成挑战分别评分，只有验证集选择检查点，最终测试结果不反馈出题。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="105" width="200" height="85" rx="10"/><text class="label" text-anchor="middle" x="120.0" y="134.5"><tspan x="120.0" dy="0">同一冻结版本</tspan><tspan x="120.0" dy="26">相同工具与评分器</tspan></text><rect class="box" x="290" y="105" width="230" height="85" rx="10"/><text class="label" text-anchor="middle" x="405.0" y="134.5"><tspan x="405.0" dy="0">全部九组</tspan><tspan x="405.0" dy="26">Base／SFT／DAPO</tspan></text><rect class="box" x="590" y="30" width="235" height="80" rx="10"/><text class="label" text-anchor="middle" x="707.5" y="57.0"><tspan x="707.5" dy="0">原题队列</tspan><tspan x="707.5" dy="26">各数据集原生指标</tspan></text><rect class="box" x="590" y="205" width="235" height="80" rx="10"/><text class="label" text-anchor="middle" x="707.5" y="232.0"><tspan x="707.5" dy="0">合成挑战</tspan><tspan x="707.5" dy="26">独立报告成绩</tspan></text><rect class="green" x="885" y="105" width="195" height="85" rx="10"/><text class="label" text-anchor="middle" x="982.5" y="134.5"><tspan x="982.5" dy="0">配对比较</tspan><tspan x="982.5" dy="26">测试保持封存</tspan></text><path class="edge" d="M220,147 H285"/><path class="edge" d="M520,147 H555 V70 H585"/><path class="edge" d="M555,147 V245 H585"/><path class="edge" d="M825,70 H850 V147 H880"/><path class="edge" d="M825,245 H850 V147"/></svg>
