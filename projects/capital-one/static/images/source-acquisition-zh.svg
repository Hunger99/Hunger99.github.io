<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">先获取真实资料，再构造 FinSearchComp 新题</title><desc id="desc">获取过程保留原始证据并规范事实，核对来源含义与受保护用途后，再交给两条出题支线。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.label{font-size:19px}.small{font-size:15px;fill:#5c5265}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.verified{fill:#edf7f1;stroke:#60947a}</style><rect width="1100" height="390" fill="white"/><rect class="box" x="35" y="35" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="195" y="78">真实公开金融资料</text><text class="small" text-anchor="middle" x="195" y="110">SEC 申报 · FRED 观测</text><rect class="box" x="390" y="35" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="550" y="78">定位原始来源</text><text class="small" text-anchor="middle" x="550" y="110">声明来源及任务用途</text><rect class="box" x="745" y="35" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="905" y="78">保留原始证据</text><text class="small" text-anchor="middle" x="905" y="110">文件／响应 · 版本 · 身份</text><rect class="box" x="745" y="220" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="905" y="263">规范事实字段</text><text class="small" text-anchor="middle" x="905" y="295">主体 · 期间 · 单位 · 原文关联</text><rect class="box verified" x="390" y="220" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="550" y="263">核对含义及来源隔离</text><text class="small" text-anchor="middle" x="550" y="295">验证事实 · 排除受保护评测材料</text><rect class="box verified" x="35" y="220" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="195" y="263">FinSearchComp 来源库</text><text class="small" text-anchor="middle" x="195" y="295">程序出题／Claude 出题</text><path class="edge" d="M355,90 H385"/><path class="edge" d="M710,90 H740"/><path class="edge" d="M905,145 V215"/><path class="edge" d="M745,275 H715"/><path class="edge" d="M390,275 H360"/><text class="small" text-anchor="middle" x="550" y="370">只有经过核对的事实进入出题阶段；资料数量不作为题目数量。</text></svg>