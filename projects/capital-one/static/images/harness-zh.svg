<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Harness：由宿主执行产生真实观察</title><desc id="desc">一条尝试只追加消息；每类任务选择声明的环境。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7654a3" stroke-width="1.6"/></marker></defs><rect width="1000" height="650" rx="18" fill="#faf8fd"/><style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#30243e}.title{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:15px;fill:#5b5266}.node{fill:white;stroke:#b59bcc;stroke-width:1.5}.line{fill:none;stroke:#7654a3;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="40" class="title">Harness：由宿主执行产生真实观察</text><text x="32" y="68" class="small">一条尝试只追加消息；每类任务选择声明的环境。</text><rect class="node" x="32" y="105" width="270" height="84" rx="10" style="fill:white"/><text x="167.0" y="136" text-anchor="middle" class="label">任务 + 系统提示词</text><text x="167.0" y="161" text-anchor="middle" class="small">只开放对应环境工具</text><rect class="node" x="365" y="105" width="270" height="84" rx="10" style="fill:white"/><text x="500.0" y="136" text-anchor="middle" class="label">模型生成一轮</text><text x="500.0" y="161" text-anchor="middle" class="small">任务／token／纠错上限</text><rect class="node" x="698" y="105" width="270" height="84" rx="10" style="fill:white"/><text x="833.0" y="136" text-anchor="middle" class="label">宿主分派工具</text><text x="833.0" y="161" text-anchor="middle" class="small">JSON 与已知工具检查</text><rect class="node" x="698" y="246" width="270" height="84" rx="10" style="fill:white"/><text x="833.0" y="277" text-anchor="middle" class="label">只读来源／隔离运算</text><text x="833.0" y="302" text-anchor="middle" class="small">限定返回长度并保留来源</text><rect class="node" x="365" y="246" width="270" height="84" rx="10" style="fill:white"/><text x="500.0" y="277" text-anchor="middle" class="label">finish：H1 验证</text><text x="500.0" y="302" text-anchor="middle" class="small">有限次数的具体纠错反馈</text><rect class="node" x="32" y="246" width="270" height="84" rx="10" style="fill:white"/><text x="167.0" y="277" text-anchor="middle" class="label">独立评分器</text><text x="167.0" y="302" text-anchor="middle" class="small">检查保存的答案／提交</text><rect class="node" x="32" y="381" width="603" height="75" rx="10" style="fill:#f0e9f8"/><text x="333.5" y="412" text-anchor="middle" class="label">分别检查准入</text><text x="333.5" y="437" text-anchor="middle" class="small">题目 → 完整示范 → 训练</text><path class="line" d="M302 147 H365"/><path class="line" d="M635 147 H698"/><path class="line" d="M833 189 V246"/><path class="line" d="M365 287 H302"/><path class="line" d="M167 330 V381"/><path class="line" d="M698 287 H669 V215 H500 V189"/><path class="line" d="M550 189 V246"/><path class="line" d="M430 246 V215 H460 V189"/><text x="590" y="233" text-anchor="middle" class="small">追加真实工具结果</text><text x="300" y="233" class="small">纠错反馈</text><path d="M32 482 H968" stroke="#d2c5df" stroke-dasharray="6 5"/><rect class="node" x="32" y="514" width="270" height="86" rx="10" style="fill:white"/><text x="167.0" y="545" text-anchor="middle" class="label">合成数据 API 角色</text><text x="167.0" y="570" text-anchor="middle" class="small">出题／盲解／审查独立请求</text><rect class="node" x="365" y="514" width="270" height="86" rx="10" style="fill:white"/><text x="500.0" y="545" text-anchor="middle" class="label">每次 API 请求之前</text><text x="500.0" y="570" text-anchor="middle" class="small">范围 + 输入上界 + 费用预留</text><rect class="node" x="698" y="514" width="270" height="86" rx="10" style="fill:white"/><text x="833.0" y="545" text-anchor="middle" class="label">原生 Messages 代理</text><text x="833.0" y="570" text-anchor="middle" class="small">模型返回 → 用量账本</text><path class="line" d="M302 557 H365"/><path class="line" d="M635 557 H698"/><text x="32" y="630" class="small">结束任务或完成检索，本身不能证明答案正确。</text></svg>