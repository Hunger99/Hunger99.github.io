<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">两路出题共用编译与审查</title><desc id="desc">上方 CPU 程序支线与下方 Claude 出题支线并行；下方先绑定提示并按保守配置的输入上界预留费用，再经原生代理调用并结算实际用量。两路汇入同一编译器和语义索引，再进入共同审查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="45" width="180" height="85" rx="10"/><text class="label" text-anchor="middle" x="110.0" y="74.5"><tspan x="110.0" dy="0">已审来源库</tspan><tspan x="110.0" dy="26">固定阶段用途</tspan></text><rect class="box" x="260" y="40" width="205" height="80" rx="10"/><text class="label" text-anchor="middle" x="362.5" y="67.0"><tspan x="362.5" dy="0">程序出题</tspan><tspan x="362.5" dy="26">仅 CPU</tspan></text><path class="edge" d="M200,87 H255"/><path class="edge" d="M220,87 V225 H255"/><rect class="lane" x="245" y="155" width="825" height="150" rx="12"/><text class="small" text-anchor="start" x="270" y="181"><tspan x="270" dy="0">Claude 出题支线：独立原生对话</tspan></text><rect class="box" x="260" y="200" width="150" height="70" rx="10"/><text class="label" text-anchor="middle" x="335.0" y="222.0"><tspan x="335.0" dy="0">绑定完整提示</tspan><tspan x="335.0" dy="26">输入上界</tspan></text><rect class="box" x="430" y="200" width="155" height="70" rx="10"/><text class="label" text-anchor="middle" x="507.5" y="222.0"><tspan x="507.5" dy="0">预留费用</tspan><tspan x="507.5" dy="26">共享锁</tspan></text><rect class="box" x="605" y="200" width="250" height="70" rx="10"/><text class="label" text-anchor="middle" x="730.0" y="222.0"><tspan x="730.0" dy="0">CLIProxyAPI → Opus</tspan><tspan x="730.0" dy="26">Extra High</tspan></text><rect class="box" x="875" y="200" width="175" height="70" rx="10"/><text class="label" text-anchor="middle" x="962.5" y="222.0"><tspan x="962.5" dy="0">保存原始响应</tspan><tspan x="962.5" dy="26">结算账本</tspan></text><path class="edge" d="M410,235 H425"/><path class="edge" d="M585,235 H600"/><path class="edge" d="M855,235 H870"/><rect class="box" x="400" y="355" width="250" height="85" rx="10"/><text class="label" text-anchor="middle" x="525.0" y="384.5"><tspan x="525.0" dy="0">宿主类型编译器</tspan><tspan x="525.0" dy="26">生成题面与参考答案</tspan></text><rect class="box" x="705" y="355" width="220" height="85" rx="10"/><text class="label" text-anchor="middle" x="815.0" y="384.5"><tspan x="815.0" dy="0">语义索引</tspan><tspan x="815.0" dy="26">一个规范任务</tspan></text><path class="edge" d="M465,80 H1088 V330 H525 V350"/><path class="edge" d="M962,270 V330 H525 V350"/><path class="edge" d="M650,397 H700"/><text class="small" text-anchor="middle" x="815" y="480"><tspan x="815" dy="0">下一步：共同审查；未审候选不能计入配额。</tspan></text></svg>
