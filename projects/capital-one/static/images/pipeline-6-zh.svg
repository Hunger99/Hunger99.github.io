<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 315" role="img" aria-labelledby="title desc"><title id="title">DAPO 奖励与策略掩码</title><desc id="desc">每个起始检查点分别接原题和加合成的 DAPO；奖励长度只统计模型生成内容，未完成回合整条策略损失掩码归零。实际分布式训练仍待验证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.small{font-size:15px;fill:#5c5265}.label{font-size:18px}.lane{fill:#f8f5fc;stroke:#c9b8df;stroke-dasharray:6 5}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.green{fill:#edf7f1;stroke:#60947a}.amber{fill:#fff7e8;stroke:#b39351}</style><rect width="100%" height="100%" fill="white"/><rect class="box" x="20" y="75" width="190" height="85" rx="10"/><text class="label" text-anchor="middle" x="115.0" y="104.5"><tspan x="115.0" dy="0">Base／S0／S1</tspan><tspan x="115.0" dy="26">O 或 O＋R</tspan></text><rect class="box" x="260" y="75" width="210" height="85" rx="10"/><text class="label" text-anchor="middle" x="365.0" y="104.5"><tspan x="365.0" dy="0">同题分组试答</tspan><tspan x="365.0" dy="26">真实工具返回</tspan></text><rect class="box" x="520" y="75" width="240" height="85" rx="10"/><text class="label" text-anchor="middle" x="640.0" y="104.5"><tspan x="640.0" dy="0">原生奖励</tspan><tspan x="640.0" dy="26">只惩罚生成长度</tspan></text><rect class="box" x="820" y="75" width="260" height="85" rx="10"/><text class="label" text-anchor="middle" x="950.0" y="104.5"><tspan x="950.0" dy="0">策略掩码</tspan><tspan x="950.0" dy="26">未完成 → 整条归零</tspan></text><path class="edge" d="M210,117 H255"/><path class="edge" d="M470,117 H515"/><path class="edge" d="M760,117 H815"/><text class="label" text-anchor="middle" x="550" y="220"><tspan x="550" dy="0">过滤无奖励差异的回答组 → 更新对应继续训练模型。</tspan></text><text class="small" text-anchor="middle" x="550" y="270"><tspan x="550" dy="0">工具返回仍作上下文，不计入生成长度或策略损失 token。</tspan></text></svg>
