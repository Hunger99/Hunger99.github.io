<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">Real materials precede new FinSearchComp questions</title><desc id="desc">Acquisition preserves original evidence and normalizes verified facts, then checks protected source roles before either question-author branch.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7354a2"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#30243f}.label{font-size:19px}.small{font-size:15px;fill:#5c5265}.edge{fill:none;stroke:#7354a2;stroke-width:2.2;marker-end:url(#arrow)}.box{fill:#f2ebfc;stroke:#8f73b2;stroke-width:1.5}.verified{fill:#edf7f1;stroke:#60947a}</style><rect width="1100" height="390" fill="white"/><rect class="box" x="35" y="35" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="195" y="78">Public financial materials</text><text class="small" text-anchor="middle" x="195" y="110">SEC filings · FRED observations</text><rect class="box" x="390" y="35" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="550" y="78">Locate the original</text><text class="small" text-anchor="middle" x="550" y="110">Declared source and task role</text><rect class="box" x="745" y="35" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="905" y="78">Preserve raw evidence</text><text class="small" text-anchor="middle" x="905" y="110">File/response · version · identity</text><rect class="box" x="745" y="220" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="905" y="263">Normalize source facts</text><text class="small" text-anchor="middle" x="905" y="295">Entity · period · unit · source link</text><rect class="box verified" x="390" y="220" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="550" y="263">Check meaning and isolation</text><text class="small" text-anchor="middle" x="550" y="295">Verify facts · exclude reserved support</text><rect class="box verified" x="35" y="220" width="320" height="110" rx="12"/><text class="label" text-anchor="middle" x="195" y="263">FinSearchComp source bank</text><text class="small" text-anchor="middle" x="195" y="295">Program author / Claude author</text><path class="edge" d="M355,90 H385"/><path class="edge" d="M710,90 H740"/><path class="edge" d="M905,145 V215"/><path class="edge" d="M745,275 H715"/><path class="edge" d="M390,275 H360"/><text class="small" text-anchor="middle" x="550" y="370">Only checked facts feed question construction; source materials are not counted as questions.</text></svg>