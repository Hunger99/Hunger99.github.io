FinQA`,definition:`读取给定财报，找到数字并计算答案。`,coverage:`检查是否找到正确段落，是否使用相同 accounting definitions、单位和计算参数。`,role:`先用于检查 file reading、数值计算和 trajectory 保存，再用于训练与评测。`,split:`保留官方 train / validation / test split；再从 train set 划出两部分 validation set，分别用于分析错误和比较修改效果。同一报告及其改写题只进入一个 split；发现跨 split 重复时，按预定规则剔除并单独报告。`,example:`从指定年报定位收入与成本，计算 gross margin 及同比变化。`,size:`7,437道题目；train set 5,735 / validation set 780 / test set 922`},{name:`FinSearchComp · T2 / T3`,url:`https://huggingface.co/datasets/ByteSeedXpert/FinSearchComp`,definition:`T2查找历史事实；T3从多个时间和来源查资料后计算答案。`,coverage:`需要现成搜索、网页读取和必要的金融数据 API。T1要求查询随时间变化的数据，单独处理。公开题目不等于已有完整 trajectory。`,role:`用于检查模型能否自行找到金融资料，重点试跑 T3。先检查网络工具和 scorer。`,split:`先确认哪些来源可访问，再确定使用题目。HF 中的 train 只是存储名称；本项目需自行划分 train set、validation set 和 test set。test set 原题不能改写成 training samples。`,example:`核对多个年份与来源，找出给定区间内最大变化并计算结果。`,size:`635题：T1 244／T2 219／T3 172；T2+T3共391题，实际使用数量待确定`},{name:`FinDeepResearch`,url:`https://huggingface.co/datasets/OpenFinArena/FinDeepResearch`,definition:`查找资料、计算指标并按要求写公司研究报告。`,coverage:`检查多步研究能否完成、引用是否支持结论。数字算对不能证明整篇报告正确。`,role:`用于评测完整报告。训练报告使用其他公司和资料文件另行生成。`,split:`评测公司的原报告及其派生题目不进入训练。只使用固定资料文件时，单独标明这种设置，不当作官方联网成绩。`,example:`在资料截止日期约束下完成业绩、估值与风险分析，并为结论提供引用。`,size:`64 个公司研究题目；15,808 个 rubric 检查项`},{name:`DSCodeBench · Relevant Subset`,url:`https://github.com/ShuyinOuyang/DSCodeBench`,definition:`从 Pandas、NumPy、SciPy、Scikit-learn 题目中选择数据处理、统计和建模代码题。`,coverage:`排除不相关的图像、音频和深度学习训练题。先确定题目和依赖版本，再测试180B 模型；旧模型的单次成绩不能预测它的成绩。`,role:`作为主要代码题候选，使用 reference implementation 和执行测试检查结果。新的金融题只从 train set 的代码和题目生成。`,split:`公共题库需要按原始代码和 task template 分开训练与评测。评测题的 reference implementation 和 hidden tests 不能给 actor 读取。`,example:`实现带边界情况的时间窗口构造、missing values 处理或 constrained least squares 流程。`,size:`全量1,000题；实际使用的代码题数量待确定`},{name:`DABstep · Hard`,url:`https://huggingface.co/datasets/adyen/DABstep`,definition:`读取支付记录、费率规则和业务文件，完成筛选、表连接、汇总和计算。`,coverage:`主要检查数据处理，不是训练预测模型。官方主评测答案不公开；2025年论文成绩不代表当前180B 模型的成绩。`,role:`用于实验结束时的外部 evaluation。public dev set（官方提供的接入检查题目）用于检查 tool connection；相似 training samples 需自行生成并检查 reference answer。`,split:`官方隐藏题不用于日常训练或决定是否保留更新。固定题库版本，分别报告官方成绩和自建题成绩；不从其他人的提交文件收集答案。`,example:`读取商户、支付及费率资料，按业务条件关联数据并计算费用。`,size:`v1 全量 450 题；Hard 378 题（23 个核心问题的变体）`},{name:`DSBench · Financial Modeling Subset`,url:`https://github.com/LiqiangJing/DSBench`,definition:`选择金融分析和表格预测题，完成清理数据、建立特征、训练 regressor 和输出预测。`,coverage:`Santander Value Prediction 要求预测数值，允许使用多种 regressor。优先选择 CPU 可完成的金融题。`,role:`作为金融回归题的可选补充。明确限制只能用 OLS 或 Ridge 的题目另行生成、单独报告。`,split:`先检查文件能否取得。每道建模题内部保留 train / validation / test split，分别用于拟合、调参和最终评分；agent 题目整体也需独立划分 train set、validation set 和 test set。`,example:`构建无标签泄漏的处理与验证流程，输出预测文件并评估回归误差。`,size:`全量540题：分析466／建模74；实际使用的金融题数量待确定`},{name:`IFEval`,url:`https://huggingface.co/datasets/google/IFEval`,definition:`检查回答是否满足指定格式、长度、关键词等要求。`,coverage:`只用于检查通用 instruction following 是否下降，不用于判断金融答案是否正确。`,role:`每次决定是否保留更新时，检查 instruction following 成绩是否下降过多。`,split:`先划分 validation set 和 test set；两者都不进入 training data 或 task generation。validation set 在各轮检查 instruction following，test set 只在实验结束时使用。自定义 split 单独报告。`,example:`按要求输出指定段落数，并满足关键词与字数限制。`,size:`541道题目，一道题目可包含多条指令`}],settingsHeading:`Settings`,systemCandidatesHeading:`三个实验组：各自固定一种 training recipe`,candidateHeaders:[`实验组`,`每个训练轮使用的数据`,`下一轮从哪个模型继续训练`],candidates:[[`B-only`,`新增样本只使用 D_B。共同 seed examples 和 replay data 另按固定数量加入。`,`从本组上一次保留的 LoRA adapter 继续，training recipe 始终为 B-only。`],[`Mixed`,`按固定比例混合新增 D_A 与 D_B。`,`从本组上一次保留的 LoRA adapter 继续。使用与 A → B 相同的新增样本和每个样本的训练次数。`],[`A → B`,`在同一份 LoRA adapter 上先训练 D_A，再训练 D_B。`,`从本组上一次保留的 LoRA adapter 继续。由 A 转到 B 时保留 optimizer state 和 learning-rate schedule。`]],recipeHeading:`每轮只能选择一项修改`,recipeNote:`D_A 指输入已经包含全部必要材料的题目；D_B 指需要先读取文件或检索资料、取得缺少材料的题目。两类题目都允许使用工具。每轮三组一起选择修改 skill，或一起选择合成数据并训练；本轮失败后也不改选另一项。`,recipeHeaders:[`本轮选择`,`本轮可以修改什么`,`本轮保持不变的内容`],recipes:[[`修改 skill`,`三组共用的 skill 文字和示例。通过 paired evaluation 后，下一轮三组一起使用。`,`三组 actor、teacher model、task template、Claude Code 和检查规则；本轮不生成 SFTtraining samples、不训练模型。`],[`合成数据并训练`,`生成共同 training samples；三组按各自固定 training recipe训练。轮末还可比较是否更换 teacher model。`,`skill、task template、Claude Code、检查规则及本轮生成数据的 teacher model；本轮不修改 skill。`]],roundLabel:`Actor 与 teacher model 使用同一 initial checkpoint`,sharedWeights:`三个 actor 组 · 一个共用 teacher model`,taskRole:`Actor`,taskDescription:`执行金融和代码题目。三组各自保存 trajectory 与 model checkpoint。`,teacherRole:`Teacher model`,teacherDescription:`在训练轮生成题目并执行题目，得到可用于训练的 trajectory。`,verifierTitle:`Verifier：检查 reference answer 和 trajectory`,verifierDescription:`运行测试、重新计算数值、对照原始资料、按 rubric 检查，必要时由专家检查。`,roleCaption:`teacher model 使用固定 task template 准备题目，再在当前 skill 和 Claude Code 下实际执行。三组使用同一批通过检查的 training samples。修改 skill 的轮次不更换模型；只有训练轮结束时才可比较是否更换 teacher model，新的 teacher model 从以后的训练轮开始生成数据。`,pipelineInstruction:`第1阶段只执行一次。之后每轮执行第2阶段，选择第3或第4阶段，再到第5阶段决定是否保留更新。下方每个小节与流程图中的一步对应，按图中的顺序解释。`,loopNote:`第3和第4阶段每轮只执行一个。第5阶段结束后，下一轮回到第2阶段。`,plannedLabel:`计划步骤`,stageFlowLabel:`本阶段的执行顺序`,stages:[{label:`准备实验`,title:`准备 training samples、verifier 和 baseline`,subtitle:`只做一次；以下四步按图中顺序完成。`,flow:[`准备 seed examples 和来源材料`,`列出要生成的题型`,`检查 verifier 的判断`,`固定 baseline 和实验设置`],units:[{title:`准备 seed examples 和来源材料`,what:{lead:`seed examples 已确认正确，每份文件可追溯，split 在生成前划好。`,items:[[`seed examples`,`已由程序或专家确认正确的题目、reference answer 或 trajectory，所以错误答案不会被扩写。`],[`来源材料`,`支持 reference answer 的财报、业务文件、API documentation 和数据文件，为题目提供事实、会计规则、数据和接口参数。`],[`source、revision 和 checksum`,`每个 seed example 和每份来源材料都保存这三项；checksum 由文件内容算出，内容相同则 checksum 相同，所以能发现分进不同 split 的同一份文件。`],[`split`,`生成题目前，把题目和来源材料划分为 train set、validation set（分析错误用）、validation set（比较修改效果用）和 test set；同一报告、同一原题及其改写题放进同一个 split，所以 train set 以外各 split 题目的答案不会经同一报告或改写题进入训练。`]]},blocks:[{type:`table`,headers:[`已有材料`,`用来做什么`,`保存什么`],rows:[[`seed examples`,`展示正确答案和有效工具操作。`,`原题、答案、已检查的 trajectory 和来源。`],[`来源材料`,`提供事实、会计规则、数据和接口参数。`,`原文件、版本、来源地址和 checksum。`],[`skill`,`写明模型如何找资料、计算和检查答案。`,`模型实际读取的操作说明与示例。`],[`rubric`,`列出一篇报告必须满足的要求。`,`各项要求、参考证据和专家判断。`]]}]},{title:`列出要生成的题型`,motivation:{lead:`先试跑再定题型，可以减少对同一道题的反复改写，并提前发现 teacher model 暂时做不出的题目。`,text:`试跑能看出材料支持哪些题目、模型常在哪些操作上出错。`},what:{lead:`题型清单写明练哪些操作、加哪些条件、每类生成多少题，数量按试跑出的错误确定。`,items:[[`操作和条件`,`操作如单位换算和多文件计算，条件如缺失数据、口径不同和工具报错。`],[`试跑`,`先试跑 DocFinQA、相关 DSCodeBench 和少量 FinSearchComp T3 题目，可每类选 20 至 30 道 validation set（分析错误用）中的题目并规定重复次数，查看模型常错的操作。`],[`数量`,`按 train set 和 validation set（分析错误用）中的错误类型确定各题型的数量，不读取 test set 的成绩，所以 test set 的成绩不会影响生成内容。`]]},how:{lead:`清单确定后，第3步才知道 verifier 要处理哪些情况。`},blocks:[]},{title:`检查 verifier 的判断`,motivation:{lead:`错误的 reference answer 或 trajectory 一旦通过检查就会进入训练，所以先检查 verifier 会不会误判。`},what:{lead:`用已知正确和已知错误的 reference answer 和 trajectory 检查 verifier，再固定检查规则。`,items:[[`verifier`,`检查 reference answer 和 trajectory 的程序及人工检查步骤：数值题重新计算，代码题运行 unit tests，报告题用 rubric 和专家检查。`],[`检查 verifier`,`准备一批已知正确和已知错误的 reference answer 和 trajectory，检查 verifier 是否误判，据此修正检查程序、numerical tolerance 和 rubric，并确认专家判断与程序判断的差异。`],[`固定规则`,`主实验开始后固定这些检查规则，每道新题按规则另行生成 reference answer 和中间计算值，所以各轮的成绩变化能归于本轮选择的修改。`]]},how:{lead:`之后每轮的 training samples 和 paired evaluation 都按这一套检查规则检查。`},blocks:[]},{title:`固定 baseline 和实验设置`,motivation:{lead:`后续每轮都要和旧系统比较，所以主实验前先固定一个可运行的初始系统。`,text:`前三步定下材料、题型和检查方法后，才能确定初始设置。`},what:{lead:`baseline 保存五个部分；主实验前先跑通流程，并写定预算和规则。`,items:[[`baseline`,`本项目训练前的 checkpoint M₀、初始 skill S₀、Claude Code H₀、task template S_gen 和检查规则 V₀；H₀、S_gen 和 V₀ 在主实验期间不变，M₀ 和 S₀ 留到实验结束时与三组最终模型一起在 test set 上测试。`],[`跑通流程`,`先跑通 file reading、计算、skill 加载和 model input 日志，再在四卡上跑通最小规模的 LoRA 训练、导出、服务加载和 inference，设置问题才会在比较开始前暴露。`],[`写定规则`,`保存 data split、题型清单、inference budget、training budget、最多轮数、本轮选择规则和保留更新的条件，各轮才按同一套规则选择修改和保留更新。`],[`初始成绩`,`三组 actor 和 teacher model 都从 M₀ 开始；初始成绩只在 validation set 的题目上记录，因为 test set 留到全部轮次结束后才运行。`]]},how:{lead:`三组从同一起点出发，之后各自保留自己的 LoRA adapter。`},blocks:[{type:`note`,text:`若模型连接、trajectory 保存、四卡训练或导出后的 inference 有一项失败，先停止主实验。修正设置后重新检查，不把设置变化算作 skill 或训练带来的成绩提升。`}]}]},{label:`选择本轮修改内容`,title:`根据 failed trajectory，只选择一项修改`,subtitle:`从这里开始，每轮都执行；先选择，再提出修改。`,flow:[`保存本轮开始时的版本`,`根据 failed trajectory 做 error analysis`,`选择修改 skill 或合成数据并训练`,`只执行已经选择的修改`],units:[{title:`保存本轮开始时的版本`,motivation:{lead:`actor、teacher model 和 skill 可能已在前几轮变化，要先记下本轮从哪里开始。`},what:{lead:`保存三组各自的 actor 和三组共用的部分，并保证旧版本能直接重新运行。`,items:[[`保存范围`,`三组各自的 actor 及其 LoRA adapter，以及三组共用的 skill、teacher model、task template、检查规则、题目文件和预算。`],[`可以重新运行`,`本轮提出新版本前，确保旧版本可以直接重新运行，paired evaluation 才能在同一批题目上运行旧版本。`]]},how:{lead:`本轮改了什么可以准确比较；不保留更新时，也能恢复旧版本。`},blocks:[]},{title:`根据 failed trajectory 做 error analysis`,motivation:{lead:`先看到具体错误，才能判断修改 skill 能否解决，还是需要合成数据并训练。`},what:{lead:`从 train set 的 failed trajectory 找出出错的步骤和原因，先排除不是模型造成的错误。`,items:[[`failed trajectory`,`包含题目、model input、model output、tool call、tool response，以及没有满足的要求。`],[`error analysis`,`查看这些记录，判断模型在哪一步、因为什么出错。`],[`使用的数据`,`汇总三组在 train set 题目上的 trajectory；validation set（分析错误用）只提供错误类型和数量，它的原题和答案才不会进入生成过程。`],[`判断顺序`,`先排除材料缺失、工具不能使用和 trajectory 不完整，因为这些问题造成的错误不能算作模型能力不足；再判断错误是因为 skill 没有写清规则，还是 skill 和材料齐全、模型仍反复操作错误。`]]},how:{lead:`错误被归为 skill 没写清或模型反复操作错误两类，第3步据此选择本轮修改；原因无法确定或材料、工具有问题时，第3步暂停本轮。`},blocks:[]},{title:`选择修改 skill 或合成数据并训练`,motivation:{lead:`先定下本轮唯一的修改，成绩变化才分得清来自哪一项。`,text:`否则看到某项修改效果不好后，可能在同一轮追加另一项。`},what:{lead:`按实验前写好的规则二选一，三组做同一选择。`,items:[[`两种修改`,`修改 skill 改变操作说明；合成数据并训练改变 training samples 和 LoRA adapter。`],[`选择规则`,`按实验前写好的规则选择，规则见下表；skill 没写清和模型反复操作错误两类都有时，先选修改 skill；原因无法确定时暂停本轮。`],[`三组一致`,`三组做同一选择，三组之间的差别才来自各自的 training recipe。`]]},how:{lead:`本轮只进入第3阶段或第4阶段之一，或者暂停。`},blocks:[{type:`table`,headers:[`已有记录说明什么`,`本轮选择`,`保持什么不变`],rows:[[`步骤、单位或会计规则没写清`,`修改 skill`,`actor 和 teacher model 权重。`],[`skill 和材料充分，模型仍反复操作错误`,`合成数据并训练`,`skill 和本轮 teacher model。`],[`来源、工具、日志或检查规则有问题`,`暂停本轮`,`先保留全部旧版本，不生成未经检查的 training samples。`]]}]},{title:`只执行已经选择的修改`,motivation:{lead:`每轮只改变一项，才能用同一批题目判断这项修改是否有效。`},what:{lead:`选了哪项就只进入对应的阶段，失败也不改选。`,items:[[`进入阶段`,`选择修改 skill 就进入第3阶段，选择合成数据并训练就进入第4阶段，本轮不执行另一个阶段。`],[`失败处理`,`新 skill 成绩未达到保留更新的条件，或 teacher model 没能得到足够的通过检查的 training samples 时，保留旧版本并结束或暂停本轮。`]]},how:{lead:`下一轮回到第2阶段重新选择。`},blocks:[]}]},{label:`修改 skill`,title:`修改操作说明，所有model weights不变`,subtitle:`只在本轮选择修改 skill 时执行。`,flow:[`固定全部model weights`,`修改 skill`,`对新旧 skill 做 paired evaluation`,`提交新 skill 和比较结果`],units:[{title:`固定全部model weights`,motivation:{lead:`成绩变化要能归于 skill 的修改，所以其他部分都不能变。`},what:{lead:`所有 model weights 和其余设置都保持本轮开始时的版本。`,items:[[`model weights`,`三组 actor 和 teacher model 都使用本轮开始时的 model weights，LoRA adapter 也不变。`],[`其余设置`,`task template、Claude Code 和检查规则保持不变。`],[`本轮不做`,`不生成 training samples、不训练模型，也不更换 teacher model。`]]},how:{lead:`第5阶段核对时，所有 model weights 应与本轮开始时一致。`},blocks:[]},{title:`修改 skill`,motivation:{lead:`第2阶段判定错误来自 skill 没写清规则，所以修改对应的说明。`},what:{lead:`只改 skill 的文字和示例，并保存新旧差异。`,items:[[`skill`,`模型执行题目时读取的操作说明，包括步骤、会计规则、tool arguments 的解释和示例。`],[`修改范围`,`根据 train set 中的 failed trajectory，只修改对应的文字或示例，所以能查出是哪条说明改变了模型的操作。`],[`保存差异`,`保存新旧版本的差异，供第4步提交。`],[`不改配置`,`影响模型选择、权限、hooks 或辅助脚本的配置保持不变，Claude Code 的设置才保持一致。`]]},how:{lead:`新 skill 交给第3步做 paired evaluation。`},blocks:[]},{title:`对新旧 skill 做 paired evaluation`,motivation:{lead:`第5阶段要根据新旧 skill 的成绩决定是否保留更新，所以先比较两者。`},what:{lead:`三组各自用新旧 skill 执行同一批题目，条件和 inference budget 全部相同。`,items:[[`paired evaluation`,`在同一批题目和相同条件下分别运行旧版本和新版本，再逐题比较成绩；这里是同一 actor 分别使用旧 skill 和新 skill。`],[`题目`,`validation set（比较修改效果用）中的同一批题目，这部分 validation set 专门用于决定是否保留更新。`],[`条件`,`文件、工具和 inference budget（token 数、tool-call 次数和时限）都相同；每次执行都从新 session 和相同文件状态开始，重试也计入 inference budget，这样能减少题目难度、材料变化或重试次数造成的成绩差别。`],[`结果`,`按预定主要指标计算成绩，记录逐题差异。`]]},how:{lead:`比较结果交给第4步提交，正在使用的 skill 在第5阶段之前不替换。`},blocks:[]},{title:`提交新 skill 和比较结果`,motivation:{lead:`正式使用的版本只在第5阶段替换，同一轮才不会在两个阶段各做一次更新决定。`},what:{lead:`提交新 skill 和比较记录后，直接进入第5阶段。`,items:[[`提交内容`,`新 skill、新旧文字差异、逐题成绩，以及是否达到保留更新的条件的记录。`],[`下一步`,`直接进入第5阶段决定是否保留更新，本轮不进入第4阶段。`]]},how:{lead:`若保留，新 skill 从下一轮起供三组 actor 共同使用，并只在以后的训练轮影响新生成的 trajectory。`},blocks:[]}]},{label:`合成数据并训练`,title:`生成一批 training samples，三组按固定方法训练`,subtitle:`skill 在本轮保持不变，teacher model 在本轮生成数据期间保持不变。`,flow:[`固定 skill 和 teacher model`,`生成题目和 reference answer`,`实际执行并检查 trajectory`,`固定本轮 training samples`,`按三种固定 training recipe 训练`],units:[{title:`固定 skill 和 teacher model`,motivation:{lead:`三组要使用同一批 training samples，所以先固定生成条件。`},what:{lead:`本轮三组共用一个 skill 和一个 teacher model，题型按第2阶段的错误确定。`,items:[[`共用部分`,`skill、teacher model、task template、Claude Code 和检查规则在本轮固定；teacher model 与 actor 参数规模相同。`],[`题型`,`按第2阶段记录的错误类型确定本轮题型，生成的题目才针对模型常错的操作。`],[`顺序`,`生成数据完成前，不训练三组 actor，也不更换 teacher model，这批数据才不会因 teacher model 更换而前后不一致。`]]},how:{lead:`teacher model 最早在本轮第5阶段才可能更换，新的 teacher model 只用于以后的训练轮。`},blocks:[]},{title:`生成题目和 reference answer`,what:{lead:`从 train set 的材料按 task template 生成新题目；数值题先算出 reference answer 再写题面，报告题先定事实、证据要求和 rubric。`,items:[[`题目来源`,`training samples 中的题目来自 train set 的材料；按 task template 替换 seed examples 中的公司、fiscal year 和条件，生成新题目，并绑定新的真实材料。`],[`reference answer`,`verifier 检查时对照的答案；数值题先核对抽取的数字，再用程序算出 reference answer 和中间计算值。`],[`中间计算值`,`记录单位、公式和关键步骤。`],[`读取限制`,`actor 和 teacher model 执行时只能读取允许的材料，不能读取 reference answer，trajectory 才不会依赖它。`]]},blocks:[{type:`table`,headers:[`已有公开方法`,`本项目具体怎么使用`],rows:[[`NVIDIA Nemotron 3 Super 的金融 task template`,`作为主要出题方法：替换公司、fiscal year、指标和例外条件，重新从财报计算答案。借用出题步骤，不借用其 teacher model 或评测题。`],[`Microsoft Foundry 的文档问答与 OpenAPI 题目生成`,`补充从财报、业务文档生成的问题，以及按接口说明生成的工具题目。trajectory 只能调用 Claude Code 实际提供的 tool name 和参数。`],[`Salesforce Koa 的角色与业务题目组合`,`需要复杂业务题目时再考虑“分析师角色、交付内容和约束条件”的组合；当前没有实现此生成程序。`]]},{type:`p`,text:`例如生成 profit margin 变化题：从 train set 选择新公司和两个 fiscal year，保存原文位置、单位及 accounting definitions，重新计算 profit margin 和变化值，再要求模型找数、计算并解释。遇到缺少数字或口径无法比较时，剔除题目，或明确要求回答“资料不足”。更换公司和数字后必须重新计算答案。`},{type:`p`,text:`需要从多家公司中选唯一结果时，另存允许选择的公司、实体标识、原文位置、单位、中间值和最终值；并列时必须有明确规则，否则剔除。最大值差距要足以覆盖 tolerance。抽取数字先与原文核对，计算程序再用独立实现或已知答案检查。`},{type:`p`,text:`根据三组轮初模型的训练记录补充常错题型。已经常做对的题可增加文件数量、参数范围或条件组合，但每次都重新计算 reference answer。开放报告没有唯一全文答案，数字检查之外仍需专家检查解释和引用。Axion 为这些出题方法提供参考。`}]},{title:`实际执行并检查 trajectory`,what:{lead:`teacher model 在当前设置下实际执行，保存实际的 model input，再按检查规则检查。`,items:[[`trajectory`,`包含 teacher model 每一步实际读到的 model input、生成的 model output、tool call、tool arguments、真实的 tool response 和 final answer。`],[`执行`,`让 teacher model 在当前 Claude Code、skill 和允许读取的材料下实际执行题目；可以多次 sampling，也可以按真实报错 retry，全部尝试计入 generation budget；完整重跑时重置 session 和文件。`],[`保存 model input`,`保存 context compaction 后的 model input，才能检查 trajectory 是否依赖私有 reference answer、额外 teacher prompt 或执行之后才出现的信息。`],[`检查`,`按检查规则运行 unit tests、重新计算数值、对照原文和 rubric，必要时由专家检查；无法判断对错的 trajectory 不用于训练。`]]},blocks:[{type:`note`,text:`若旧 trajectory 曾使用私有 reference answer、额外 teacher prompt 或未来信息，必须在不提供这些信息的条件下重新执行并通过 verifier。不能只删除 prompt 后保留旧输出。模型编写的“调用成功”文字不能代替真实 tool response。`},{type:`table`,headers:[`trajectory`,`怎样保留`,`训练时使用哪些输出`],rows:[[`第一次执行成功`,`答案、工具操作和证据都通过检查。`,`正确的模型输出、tool arguments 和最终回答。`],[`出错后成功`,`保留真实错误及其前面的操作，检查后续恢复操作确实可执行。`,`错误操作只放在输入历史中，不计算 loss；只训练已检查的后续正确输出。`],[`删去多余操作后成功`,`从同一初始文件状态重新运行精简后的操作并检查。`,`只训练重新执行仍成功的输出。`],[`新题执行成功`,`从训练材料生成新题，重新计算答案并执行。`,`只训练这道新题实际产生并通过检查的输出。`]]}]},{title:`固定本轮 training samples`,motivation:{lead:`Mixed 与 A → B 的差别要限定为新增 training samples 的顺序，所以数据在训练前固定。`,text:`teacher model 执行完、trajectory 通过检查后，才知道有哪些可用的 training samples，所以这一步排在第3步之后。`},what:{lead:`去重，加入 seed examples 和 replay data，分成 D_A 和 D_B，三组读取同一批文件。`,items:[[`D_A 和 D_B`,`D_A 的输入已给全必要材料；D_B 要先读取文件或检索，取得没有直接给出的材料。`],[`去重和加入`,`先做 deduplication，即去掉重复的 training samples，再按预定数量加入 seed examples 和 replay data（前几轮保存的、通过检查的 trajectory）。`],[`固定内容`,`固定难度比例、文件清单和版本，三组读取同一批文件。`],[`原题分配`,`一道原题及其改写题只放进 D_A 或 D_B 之一，所以不会先在 D_A 给出某题答案、再在 D_B 只删掉材料。`],[`不再补改`,`开始训练后，不因某组成绩补改本轮数据。`]]},how:{lead:`第5步三组按各自的 training recipe 使用这同一批数据。`},blocks:[{type:`table`,headers:[`training samples`,`输入是什么`,`要训练的操作`],rows:[[`D_A`,`已经给出必要段落、数字、规则或函数要求；仍可使用工具。`,`根据已给材料选择公式、处理数据并检查答案。`],[`D_B`,`必要材料未直接给全；可读取本地文件、检索文档或调用已检查的网络工具。`,`先找材料，再进行计算、代码运行、建模或报错后的恢复。`]]},{type:`note`,text:`所有通过检查的 trajectory 都保存。以后加入多少 replay data 按实验前写好的规则确定，三组使用同一清单。若本轮没有足够的已检查样本，暂停训练；skill 和model weights仍使用旧版本。`}]},{title:`按三种固定 training recipe 训练`,motivation:{lead:`本轮固定的 training samples 要按三种 training recipe 分别训练，三组才能比较各 training recipe 的效果。`},what:{lead:`三组按各自的 training recipe 继续训练，supervised token budget 及 seed examples 和 replay data 的比例相同。`,items:[[`三种 training recipe`,`三组从各自上一次保留的 LoRA adapter 继续训练：B-only 只使用新增 D_B；Mixed 按固定比例混合新增 D_A 和 D_B；A → B 先训练新增 D_A，再训练新增 D_B。`],[`其余条件`,`base weights 和 skill 保持不变；Mixed 每个新增 training sample 的训练次数与 A → B 相同；这样三组才构成清楚的对照。`],[`optimizer`,`每轮开始时重新初始化 optimizer；A → B 从 D_A 转到 D_B 时保留 optimizer state 和 learning-rate schedule。`],[`硬件`,`用现成训练框架把 BF16 n-gram embedding 放在 CPU，三组依次使用四张 GPU 训练。`]]},how:{lead:`每组得到本轮的新模型，由第5阶段与本组旧模型比较。`},blocks:[{type:`list`,items:[`只对正确的 assistant outputs 计算 loss，包括已检查的 tool arguments 和 final answer。system messages、user messages、tool responses 和已知错误操作仍可作为 context，但不计算 loss。使用 checkpoint 对应的 chat template 和 tool-call format，不补写缺失 inference。`,`长 trajectory 只能在 message boundary 切段，每段带上解释后续操作所需的 context。同一 target token 不因窗口重叠而重复监督。training window 与执行题目时的 context length 分别记录。`,`记录 base model revision、LoRA adapter 的来源 checkpoint、target modules、rank、optimizer、learning rate、batch size、parallelism、data checksum 和 random seed。先通过四卡训练及导出加载检查，再运行正式训练。`,`金融建模题内部也有 train / validation / test split，分别用于拟合、调参和最终评分；test labels 不提供给 actor。这与 agent 题目整体的 train / validation / test split 是两层不同的划分。`]}]}]},{label:`决定是否保留更新`,title:`检查成绩，再决定下一轮使用哪个版本`,subtitle:`只在本阶段替换正式使用的 skill、actor 或 teacher model。`,flow:[`确认本轮修改内容`,`检查 paired evaluation 结果`,`保留更新或恢复旧版本`,`开始下一轮或结束实验`],units:[{title:`确认本轮修改内容`,motivation:{lead:`只有其他部分都没变，成绩差才对应本轮选择的修改。`},what:{lead:`对照本轮开始时的版本，核对实际改动只有选定的那一项。`,items:[[`修改 skill 的轮次`,`所有 model weights 应不变。`],[`训练轮`,`skill 应不变。`],[`两种轮次`,`工具和检查规则都应与本轮开始时一致。`]]},how:{lead:`核对通过后，第2步才读取 paired evaluation 结果。`},blocks:[]},{title:`检查 paired evaluation 结果`,motivation:{lead:`逐题比较能看出哪些题目由错变对、哪些由对变错。`},what:{lead:`在 validation set（比较修改效果用）上按预定规则比较新旧版本，test set 不参与。`,items:[[`修改 skill 的轮次`,`只按第3阶段保存的三组新旧 skill 成绩判断。`],[`训练轮`,`每组的新旧模型用同一 skill、文件、工具和 inference budget 执行同一批题目；条件相同，才能减少材料和运行次数造成的差别。`],[`判断标准`,`按预定主要指标、允许下降程度和成本上限判断；失败、超时和未完成的题目都计入统计。`]]},how:{lead:`每个新版本都得到是否达到保留更新的条件的结论，交给第3步处理。`},blocks:[]},{title:`保留更新或恢复旧版本`,motivation:{lead:`skill 由三组共用，模型各自训练，所以 skill 一起决定，模型逐组决定。`},what:{lead:`达到保留更新的条件，下一轮就正式使用新版本；否则继续使用旧版本。`,items:[[`skill`,`三组成绩下降都没有超过允许程度，且按预定汇总规则成绩提高，新 skill 才供三组共同使用。`],[`模型`,`训练轮逐组判断：达到保留更新的条件就保留本组新模型，否则保留本组旧模型，training recipe 不变；不把成绩最好一组的 model weights 复制给其他组，才能比较三种 training recipe。`]]},how:{lead:`下一轮使用的 skill 和各组 actor 由这一步确定。`},blocks:[{type:`p`,text:`只有训练轮结束时，才可把本轮模型副本列为 teacher model 候选。在同一批保留的生成题目、相同 skill、task template 和完整 generation budget 下，与旧 teacher model 比较，按预定检查规则和排序决定是否更换。候选都不达标就保留旧 teacher model。用于比较 teacher model 的题目不进入训练。`},{type:`p`,text:`新的 teacher model 只用于以后的训练轮，不能重新生成本轮数据。修改 skill 的轮次不更换 teacher model。保存全部新旧版本、未保留的修改及其成绩。`}]},{title:`开始下一轮或结束实验`,motivation:{lead:`test set 不参与生成题目和决定是否保留更新，所以留到最后，衡量训练后在未见题目上的表现。`},what:{lead:`未达到停止条件就回到第2阶段；全部轮次结束后，统一在 test set 上测试。`,items:[[`下一轮`,`无论是否保留更新，都先结束本轮；未达到最多轮数或停止条件时，下一轮回到第2阶段。`],[`结束`,`保存三组最终模型和最后使用的 skill；全部轮次结束后，才在 test set 上运行 M₀ 加初始 skill S₀，以及三组最终模型加最后使用的 skill，按数据集分别报告成绩和 confidence interval。`],[`工具变化`,`若工具版本必须改变，暂停实验，重新运行受影响的初始比较。`]]},how:{lead:`三组共用 skill 和 teacher model，最终比较的是三种 training recipe 的长期效果。`},blocks:[]}]}],diagnosisTitle:`根据 failed trajectory 选择本轮修改内容`,diagnosisNote:`以下例子用于解释选择规则，不是实验结果。例子中提到的记录来自已经完成的尝试；本轮还没有同时修改 skill 和模型。`,caseLabel:`失败例子`,observationLabel:`出现了什么错误`,replayLabel:`已有记录说明什么`,actionLabel:`本轮做什么`,cases:[{name:`skill未写清规则`,observation:`把 profit margin 变化的 percentage points 写成百分比增长。`,replay:`已有 skill 没有说明两种计算方式的区别，已保存的 trajectory 显示模型在这里用错公式。`,action:`修改 skill`,reason:`补充公式说明和示例，再用相同 validation set 中的题目比较新旧 skill；本轮不训练模型。`},{name:`规则齐全仍操作错误`,observation:`skill 已写明公式，材料和单位也齐全，模型仍反复选择错误参数。`,replay:`多个已保存的训练题 trajectory 出现同类错误，不能用缺少说明解释。`,action:`合成数据并训练`,reason:`本轮 skill 不变，生成此类操作的正确 trajectory，三组按各自固定 training recipe训练。`},{name:`资料不足`,observation:`模型写出原文没有支持的利润变化原因。`,replay:`现有资料不能确定这一原因；模型对自己的回答打高分也没有补充证据。`,action:`暂停本轮，补充材料或请专家检查`,reason:`原因无法检查的回答不作为 training samples；也暂不据此选择修改 skill 或训练模型。`},{name:`工具或上下文限制`,observation:`题目因工具无法使用或 session 长度限制而未完成。`,replay:`trajectory 显示失败发生在当前 Claude Code 设置或模型连接上。`,action:`记录限制，暂停需要这些功能的实验`,reason:`主实验使用固定 Claude Code，不另写运行程序；必要设置修改后，重新运行受影响的比较。`}],previousLabel:`上一个阶段`,nextLabel:`下一个阶段`,restartLabel:`下一轮：重新查看 failed trajectory`,evaluationHeading:`Evaluation Metrics`,evaluationNote:`使用相同评测题目、inference budget 和 scorer，对比按失败原因选择更新、只修改 skill、只微调模型三种方式；训练轮另比较 B-only、Mixed、A → B 三种 training recipe。以下指标按数据集分别统计。`,metricHeaders:[`Metric`,`如何计算`,`使用该 metric 的 dataset`],metrics:[[`Accuracy`,`使用各数据集的 official scorer 比较 final answer 与 reference answer，计算答对题目占比。DABstep Hard 使用官方外部 evaluation。`,`DocFinQA、FinSearchComp T2/T3、DABstep Hard、DSBench 金融分析子集`],[`Code pass rate`,`在固定 inference budget 内，final code 通过全部 official tests 的题目占比。标明是否允许 Claude Code tool use 和 retry；与原生 single-generation Pass@1 分开报告。`,`DSCodeBench 相关子集`],[`Task metric / RPG`,`按每道建模题指定的 metric 评估 test predictions。跨题汇总采用 official RPG：reference model 的成绩对应0、reference best score 对应1，并按官方规则计算；RPG 越高越好。`,`DSBench 金融建模子集`],[`HisRubric score`,`沿用 official HisRubric rubric 和 aggregation rule，固定 judge model 与 source cutoff。fixed-corpus evaluation 与 official online evaluation 分开报告。`,`FinDeepResearch`],[`Strict prompt-level accuracy`,`使用 official strict checker，计算同时满足全部可检查 instructions 的 prompt 占比，用于检查 instruction following 是否下降。`,`IFEval`]],acceptanceHeading:`怎样证明这两项贡献有效`,acceptanceHeaders:[`要证明什么`,`比较哪些结果`,`什么结果才支持结论`],acceptanceRows:[[`C1 · 每轮只修改一项后，系统能否逐轮提高成绩`,`逐轮比较更新前后的版本；另从相同起点和数据划分出发，在相同 Claude Code、总预算和停止条件下，比较按失败原因选择更新、始终只修改 skill、始终只微调模型。最终统一在 test set 上测试。`,`在预定主要指标上，按失败原因选择更新的方案优于两个固定更新方案，且 IFEval 下降未超过允许程度，才支持这种选择方式更有效。`],[`C2 · 同规模 teacher model 生成的 training samples 是否有用，按错误补题是否更好`,`固定 teacher model、actor 起点、skill 和 training recipe，对比“根据 failed trajectory 补题”与“按固定题型清单出题”。两侧使用相同 generation budget、A/B 比例、supervised token budget 和检查规则。`,`先证明同规模 teacher model 的 training samples 能提高未见题目的成绩；再证明根据 failed trajectory 补题优于固定题型清单，才能把额外提升归于按错误补题。若要单独证明更换 teacher model 有用，还需比较保留旧 teacher model 和使用新 teacher model 的结果。`]],referenceNote:`以下来源用于说明已有模型、工具和方法。`,references:[{title:`Qwen3.8-Flash-Next · Official Model Card`,url:`https://huggingface.co/Qwen/Qwen3.8-Flash-Next`,description:`查模型结构、参数数量和下载版本；BF16是weight precision。`},{title:`NVIDIA · RTX PRO 6000 Blackwell`,url:`https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/`,description:`查每卡96GB 的硬件规格；pilot 时记录实际卡型和主机连接方式。`},{title:`Megatron-SWIFT · Qwen3.8-Flash-Next Best Practice`,url:`https://swift.readthedocs.io/en/latest/BestPractices/Qwen3_8-Flash-Next-Best-Practice.html`,description:`使用已有 BF16 LoRA 和 PLE 放到 CPU 的功能；文档中的八卡成绩不能代替四卡检查。`},{title:`Axolotl · Qwen 3.8 Flash Next`,url:`https://docs.axolotl.ai/docs/models/qwen3.8-flash-next.html`,description:`查实际加载的参数及 PLE 表大小，用于估算 BF16权重占用的内存。`},{title:`Claude Code · 非交互运行与结构化输出`,url:`https://code.claude.com/docs/en/headless`,description:`使用现成命令行执行题目和记录结果，不编写新的 tool call 循环。`},{title:`Claude Code · Skills`,url:`https://code.claude.com/docs/en/skills`,description:`使用现成 skill 文件和加载方式保存操作说明。`},{title:`vLLM · Claude Code Integration`,url:`https://docs.vllm.ai/en/stable/serving/integrations/claude_code/`,description:`使用兼容接口连接本地 Qwen；具体模型、tool call 和 trajectory 仍需实际检查。`},{title:`NVIDIA Nemotron 3 Super · SFTtraining data`,url:`https://docs.nvidia.com/nemotron/latest/nemotron/super3/sft.html`,description:`参考其替换公司和年份的金融题模板，以及实际执行工具操作的做法。`},{title:`Microsoft Foundry · Synthetic Data Generation`,url:`https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation`,description:`参考从文档和 OpenAPI 说明生成问答及工具题目的方法；不据此假定该服务支持训练本项目的 Qwen。`},{title:`Salesforce Koa · 2026-09-15 公告`,url:`https://www.salesforce.com/news/press-releases/2026/09/15/koa-reasoning-model/`,description:`参考组合角色、题目和业务条件的出题方法；公告没有公开完整实现。`},{title:`Axion 1.0: Open Agent Foundation Models, Simplified (2026)`,url:`https://arxiv.org/html/2611.03233v2`,description:`参考先计算 reference answer 再出题、根据模型错误补题及先 A 后 B 的训练安排；其全参数 SFT 成绩不等于本项目 LoRA 成绩。`},{title:`Agent-R: Training Language Model Agents to Reflect via Iterative Self-Training (2025)`,url:`https://arxiv.org/abs/2501.11425`,description:`参考搜索并修正出错操作，再用正确操作训练的方法。`},{title:`Re-ReST: Reflection-Reinforced Self-Training for Language Agents (EMNLP 2024)`,url:`https://aclanthology.org/2024.emnlp-main.861/`,description:`参考用环境实际返回检查模型自己生成的 trajectory。`},{title:`ReSTᴱᴹ: Beyond Human Data (2023 / 2024)`,url:`https://arxiv.org/abs/2312.06585`,description:`参考多次执行、检查记录、训练模型，再重复这些步骤的方法。`},{title:`DSCodeBench · Controlled coding comparison`,url:`https://arxiv.org/html/2505.15621v3`,description:`查题目构造和 DS-1000对照成绩；不代表本项目180B 成绩。`},{title:`DABstep · Evaluation protocol`,url:`https://arxiv.org/html/2506.23719v1`,description:`查 public dev set、隐藏答案和官方评分方法。`},{title:`DABstep · Official leaderboard`,url:`https://huggingface.co/spaces/adyen/DABstep`,description:`查题库版本、成绩是否经过验证及提交评分要求。`},{title:`DSBench · Source and task manifests`,url:`https://github.com/LiqiangJing/DSBench`,description:`查金融分析和预测题；regression 题不强制使用线性模型。`},{title:`FinSearchComp · ICLR 2026`,url:`https://proceedings.iclr.cc/paper_files/paper/2026/file/4d42358702dff82e1436550a05ade260-Paper-Conference.pdf`,description:`查题目、数据时间要求和评分方法；工具 trajectory 是否可用需检查发布文件。`},{title:`FinSearchComp · Implementation`,url:`https://github.com/randomtutu/FinSearchComp`,description:`区分完整题库和 AkShare 可用子集，确定本项目可访问的资料来源。`},{title:`DocFinQA · Original paper`,url:`https://aclanthology.org/2024.acl-short.42/`,description:`查给定长财报中的数值问答题目。`},{title:`FinDeepResearch · Original benchmark scale`,url:`https://arxiv.org/abs/2510.13936`,description:`查64个公司研究题目和15,808个报告检查项的区别。`}],footerNote:`Agent Learning Flywheel · 金融 LLM agent 的逐轮改进方案。`,attribution:`布局与呈现方式参考`,backToTop:`返回顶部`,unitMotivationLabel:`Motivation`,unitWhatLabel:`What`,unitHowLabel:`How`,candidatesHeading:`Candidates`,settingsGroups:[{title:`Models and runtime`,items:[[`Base model`,`Qwen/Qwen3.8-Flash-Next，使用 BF16。发布的约180B参数包含 n-gram embedding 和 MTP；官方另列主体125B、每次激活6B。记录实际加载范围。BF16 是 weight storage precision。`],[`Actor and teacher model`,`M_g,t 表示第 g 组在第 t 轮使用的 actor；三组最初使用同一 checkpoint M₀。teacher model 记为 Gₜ，最初 G₀=M₀，之后三组共用一个 teacher model。Sₜ 是共用 skill；S_gen 是全程不修改的 task template。`],[`Claude Code`,`全程使用同一版本、工具、权限、model alias 和 session 设置，记为 H₀。资料文件按题目保存版本。实验脚本只启动、重置和记录题目；模型仍通过 Claude Code 原有功能调用工具。`],[`Model serving`,`使用现成 vLLM 的 Anthropic Messages API 兼容服务。逐项检查 tool-call format、streaming response、skill 加载、实际模型请求和日志。先用训练后的 LoRA adapter 完成导出、加载和 inference，再开始主实验。`]]},{title:`Data and evaluation`,items:[[`Data split`,`train set 用于 error analysis 和生成 training samples。validation set 分成两部分：validation set（分析错误用）只输出错误类型与数量，不把原题或答案交给生成过程；validation set（比较修改效果用）用于 model selection，即决定是否保留新的 skill、actor 或 teacher model。test set 只在全部轮次结束后使用。`],[`Shared training data`,`每个训练轮只用一个固定的 teacher model 生成一批数据。三组读取同一份 D_A、D_B 文件和同一份共同 seed examples、replay data 清单。开始训练后不再补改本轮数据。`],[`Verification rules`,`V₀包括检查程序、numerical tolerance、rubric 和保留更新的条件，主实验期间不修改。每道新题的 reference answer 和中间计算值按这些规则另行生成。若发现规则本身有误，暂停实验，修正后重新计算所有受影响的比较结果。`]]},{title:`Training configuration`,items:[[`LoRA SFT`,`base weights W₀ 保持 BF16 且不训练。每组模型等于 W₀ 加本组 LoRA adapter 的有效增量 Δ_g,t，初始 Δ_g,0=0。每个训练轮从本组上一次保留的 LoRA adapter 继续。修改 skill 时不训练权重。当前三组均不使用 QLoRA。`],[`Supervised token budget`,`三组主要匹配 supervised token budget，即参与 loss 计算的 assistant tokens 数量。另记全部 input tokens、sample repetitions、training steps 和 GPU-hours。B-only 没有新增 D_A，因此与另外两组比较的是 data mixture；各组接触 D_B 的次数可能不同。`],[`Data order`,`Mixed 与 A → B 使用相同的新增 training samples、supervised token budget 和每个 sample 的训练次数，只改变新增 D_A 与 D_B 的顺序。共同 seed examples 和 replay data 的插入位置、比例也相同。`],[`Optimizer and learning rate`,`每个训练轮开始时，三组按相同规则重新初始化 optimizer。A → B 从 A 转到 B 时保留 optimizer state 和 learning-rate schedule，不重新开始 warmup。learning rate、长 trajectory 的切分规则和 packing 规则保持一致。`],[`Training pilot`,`先用现成框架检查四卡分配、target modules 和导出后的模型加载。初始配置候选为 rank=8、alpha=32、micro-batch size=1、activation checkpointing 和 gradient accumulation；不默认使用 all-linear。逐步测试4K 和8K training window，即一次训练读取的 token 数量。分别测量 backpropagation 和 inference 的 peak VRAM；inference 还需计入 KV cache，并测试预定 context length。三组使用同一套通过检查的配置。`]]},{title:`Experiment protocol`,items:[[`Round start`,`保存三组模型、skill、teacher model、task template、检查规则和预算的版本。随后只选择修改 skill，或合成数据并训练。工具或材料不能使用时先暂停本轮，不增加第三种修改内容。`],[`Update policy`,`三组在同一轮选择同一项修改。新 skill 只有在三组成绩都没有超过允许程度的下降，且按预定汇总规则有提升时，才供三组共同使用。`],[`Checkpoint management`,`三组最初的模型相同；之后各自保留自己的 LoRA adapter。每轮不重新从 initial checkpoint 开始，也不把成绩最好一组的权重复制给其他组。`],[`Paired evaluation`,`三组使用相同 Claude Code、检查规则、每轮选择、skill、teacher model 和生成数据。每组的新模型与本组旧模型比较。保留初始 M₀和初始 skill S₀，供实验结束时一起测试。`],[`Preregistration`,`先做 pilot，再在主实验开始前保存样本数量、generation budget、training budget、最多轮数、本轮选择规则及保留更新的条件。不同轮次的三组模型会因历史训练而不同，因此最终比较的是三种 training recipe 长期使用后的成绩。后续单轮成绩不能单独证明 training order 的作用。`]]},{title:`Compute resources`,items:[[`Hardware`,`4张 NVIDIA RTX PRO 6000 Blackwell，每张96GB，标称总 VRAM 384GB。training framework 必须正确完成 model sharding；四卡 training 仍需实际检查。`],[`CPU offload`,`训练优先使用现成 Megatron-SWIFT 的 PLE_CPU_OFFLOAD=1，把 n-gram PLE 表保存在 host RAM。该表约95.4GiB（102.4GB）；host RAM 还要容纳加载时的临时数据、各进程副本和题目文件。inference 服务是否支持同样操作要另外检查。`],[`VRAM budget`,`按 Axolotl 记录的加载范围，BF16 weights 约329.6GiB；PLE CPU offload 后，GPU 上的 weights 约234.2GiB（251.5GB）。LoRA training state、activations、communication buffers 和 temporary buffers 另占 VRAM。SWIFT 八卡4K示例的 peak VRAM 为每卡63.6GiB，不能代替四卡实测。GB 与 GiB 分别记录。`],[`Resource scheduling`,`teacher model 生成数据、LoRA SFT 和 evaluation 依次运行，切换前释放上一项的 model server。四卡上不同时常驻 teacher model、actor 和训练进程。分别记录 training 与 inference 的 peak VRAM、throughput 和 CPU transfer time。`],[`Task execution resources`,`优先选择 CPU 能完成的金融表格题目，固定 CPU 数量、内存和时限。CPU 还要保存 PLE 表，需检查两项工作是否争用资源。需要 GPU 训练 regressor 的题目先另外确认可用资源。题目内训练 regressor 与对180B 模型做 LoRA SFT 是两项不同操作。`]]}]},en:{titleLead:`Improving`,titleRest:` a 180B Financial LLM Agent`,titleSecond:`with Claude Code, skill and LoRA SFT`,subtitle:`Each round: edit skill, or generate data and train · Each group keeps its training recipe`,computeLine:`Planned hardware: 4 × RTX PRO 6000 96GB · BF16 LoRA · n-gram embedding on CPU`,status:`Research Design`,navigation:`Project navigation`,methodLabel:`Execution steps`,modelLabel:`Model Card`,referencesLabel:`References`,abstractHeading:`Abstract`,abstract:`Financial agents built on large language models (LLMs) must retrieve sources, calculate answers and support research conclusions with evidence. Such agents can improve by revising skill, the operating instructions read during tasks, or by fine-tuning model parameters. Skill-only updates leave parameters unchanged; fine-tuning-only updates leave instructions unchanged, motivating a test of whether choosing an update from task failures is more effective. We propose Agent Learning Flywheel for Qwen3.8-Flash-Next, an approximately 180B model. Each round analyzes failed trajectories, the complete execution records of failed tasks, excluding missing sources, unavailable tools and incomplete records before choosing one update. Unclear rules prompt skill revision; repeated execution errors despite adequate instructions and sources prompt training-data generation and supervised fine-tuning (SFT) with low-rank adaptation (LoRA), keeping skill fixed. LoRA SFT trains added parameters while keeping original parameters fixed. A teacher model of the same size executes tasks to produce training samples, checked by numerical recomputation, code tests or source evidence. The Claude Code harness, which manages tool calls and sessions, and all other settings remain fixed within each round. Old and new versions run identical tasks under the same budget, and an update is retained only if it meets preset criteria.`,contributionsLead:`Our Contributions are:`,contributions:[{title:`Change one thing per round and compare on the same tasks`,description:`Use failed trajectories to choose between editing skill and generating data plus training. Compare old and new results task by task, keeping changes only when they meet preset requirements.`},{title:`Generate training samples with a teacher model of the same size`,description:`Have a 180B teacher model execute real tool operations, check the trajectories with programs and experts, add task types around common errors, and compare three fixed training recipes.`}],dataHeading:`Datasets`,dataHeaders:[`Dataset and source`,`Public count / planned scope`,`What the task requires`,`How this project uses it`,`Keeping training and evaluation separate`,`Example task`],coverageLabel:`Task requirements and limits`,datasets:[{name:`DocFinQA`,url:`https://huggingface.co/datasets/kensho/DocFinQA`,definition:`Read the supplied financial report, find numbers and calculate an answer.`,coverage:`Check source passages, accounting definitions, units and calculation arguments.`,role:`First check file reading, numerical calculation and trajectory storage, then use for training and evaluation.`,split:`Respect official train/validation/test splits; divide the training part further for the two validation uses. Keep a report and its derived questions in one part. Remove overlaps under a preset rule and report that adjustment.`,example:`Find revenue and costs in an assigned report, then compute gross margin and its change.`,size:`7,437 questions; train set 5,735 / validation set 780 / test set 922`},{name:`FinSearchComp · T2 / T3`,url:`https://huggingface.co/datasets/ByteSeedXpert/FinSearchComp`,definition:`T2 retrieves historical facts; T3 combines time periods and sources before calculating an answer.`,coverage:`Needs working search, page reading and relevant financial-data APIs. Treat time-varying T1 separately. Published questions do not themselves provide complete trajectories.`,role:`Test whether the model can obtain financial material itself, first trying T3. Check web tools and scoring programs.`,split:`Check source availability before choosing questions. The HF train name is storage, not an independent training split. Separate training and evaluation; do not rewrite evaluation questions as training samples.`,example:`Reconcile periods and sources to identify a maximum change within a specified interval and compute its value.`,size:`635 tasks: T1 244 / T2 219 / T3 172; T2+T3 391; project count undecided`},{name:`FinDeepResearch`,url:`https://huggingface.co/datasets/OpenFinArena/FinDeepResearch`,definition:`Find sources, calculate measures and write a company research report in the requested structure.`,coverage:`Check completion of research steps and whether citations support claims. Correct arithmetic does not establish report correctness.`,role:`Evaluate complete reports. Generate training reports from other companies and files.`,split:`Keep evaluation companies’ source reports and derived questions out of training. Label fixed-file evaluations separately from official online scores.`,example:`Complete performance, valuation and risk sections using evidence available before a specified cutoff.`,size:`64 company-research tasks; 15,808 rubric items`},{name:`DSCodeBench · Relevant Subset`,url:`https://github.com/ShuyinOuyang/DSCodeBench`,definition:`Choose data processing, statistics and modeling code tasks using Pandas, NumPy, SciPy and Scikit-learn.`,coverage:`Exclude unrelated image, audio and deep-learning training tasks. Fix tasks and dependencies before testing 180B; earlier single-generation scores do not predict its performance.`,role:`Primary code-task candidate, checked by reference code and execution tests. Build new financial tasks only from training-side code and questions.`,split:`Split public tasks by original code and question template before training. Hide evaluation reference implementations and private tests from the actor.`,example:`Implement edge-case-sensitive temporal windows, missing-value processing or constrained least-squares workflows.`,size:`1,000 tasks total; selected code-task count undecided`},{name:`DABstep · Hard`,url:`https://huggingface.co/datasets/adyen/DABstep`,definition:`Read payments, fee rules and business files, then filter, join, aggregate and calculate.`,coverage:`Primarily data processing rather than predictive-model training. Official main-test answers are hidden; 2025 paper results are not current 180B results.`,role:`External evaluation at the end. Use public developer tasks to check integration; build and check reference answers for analogous training tasks independently.`,split:`Do not use the hidden official set for routine training or update choices. Freeze the version, report official and custom-task scores separately, and do not collect answers from others’ submissions.`,example:`Join merchant, payment and fee data and apply business rules to compute charges.`,size:`v1: 450 total; 378 Hard variants from 23 core questions`},{name:`DSBench · Financial Modeling Subset`,url:`https://github.com/LiqiangJing/DSBench`,definition:`Select financial analysis and table-prediction tasks that clean data, create features, fit regressors and output predictions.`,coverage:`Santander Value Prediction permits different regression models. Prefer financial tasks feasible on CPU.`,role:`Optional additional regression tasks. Generate and report OLS-only or Ridge-only tasks separately.`,split:`Check file access first. Keep a train / validation / test split inside each modeling task for fitting, tuning and final scoring. Independently split the agent tasks themselves into train, validation and test sets.`,example:`Build a leakage-free feature/validation pipeline, produce predictions and assess regression error.`,size:`540 tasks: 466 analysis + 74 modeling; selected financial-task count undecided`},{name:`IFEval`,url:`https://huggingface.co/datasets/google/IFEval`,definition:`Check whether responses satisfy specified format, length, keywords and other instructions.`,coverage:`Check general instruction-following declines, not financial correctness.`,role:`Check whether instruction-following scores fall too much when deciding to keep an update.`,split:`Separate validation-set prompts from test-set prompts. Neither enters training or task generation. Reuse validation checks during rounds and run final prompts only at the end; report this custom split.`,example:`Produce the requested paragraph count while satisfying keyword and length constraints.`,size:`541 prompts; each may contain multiple instructions`}],settingsHeading:`Settings`,systemCandidatesHeading:`Three groups, each with one fixed training recipe`,candidateHeaders:[`Group`,`Data used in each training round`,`Model used to start the next round`],candidates:[[`B-only`,`Use only D_B among new samples. Add shared seed examples and replay data under a separate fixed allowance.`,`Continue from this group’s last kept LoRA adapter, always using B-only.`],[`Mixed`,`Mix new D_A and D_B at fixed proportions.`,`Continue from this group’s last kept LoRA adapter. Use the same new samples and repetitions per sample as A → B.`],[`A → B`,`Train the same LoRA adapter first on D_A and then on D_B.`,`Continue from this group’s last kept LoRA adapter. Keep optimizer state and learning-rate progress when moving from A to B.`]],recipeHeading:`Choose one change per round`,recipeNote:`D_A tasks already include all necessary material. D_B tasks require reading files or searching for missing material first. Both allow tools. All three groups choose edit skill or generate data and train together. A failed round does not switch to the other choice.`,recipeHeaders:[`Round’s choice`,`What may change`,`What stays unchanged`],recipes:[[`Edit skill`,`Shared operating instructions and examples. All groups use the new skill next round if the paired evaluation passes.`,`All actor and teacher-model weights, the task template, Claude Code and checking rules. No SFT samples are generated and no model is trained.`],[`Generate data and train`,`Shared new training samples and each group’s LoRA adapter. The end of the round may also compare teacher-model candidates.`,`The skill, task template, Claude Code, checking rules and teacher model used to generate this round’s data.`]],roundLabel:`Actors and teacher model start from the same model`,sharedWeights:`Three actor groups · One shared teacher model`,taskRole:`Actor`,taskDescription:`Runs financial and code tasks. Each group keeps its own trajectories and model versions.`,teacherRole:`Teacher model`,teacherDescription:`Writes tasks and executes them in training rounds to produce trajectories for training.`,verifierTitle:`Verifier: reference answers and trajectories`,verifierDescription:`Run tests, recalculate numbers, consult original sources, apply the rubric and ask experts when needed.`,roleCaption:`The teacher model uses a fixed task template and then executes under the current skill and Claude Code. All groups use the same checked training batch. Edit-skill rounds do not change models. Only the end of a training round may choose a new teacher model, which generates data in later training rounds.`,pipelineInstruction:`Run stage 1 once. Then each round starts at stage 2, chooses stage 3 or 4, and reaches stage 5 to decide which version to use. Each subsection below explains one flow node in the displayed order.`,loopNote:`Run only one of stages 3 and 4 per round. After stage 5, the next round returns to stage 2.`,plannedLabel:`Planned step`,stageFlowLabel:`Order within this stage`,stages:[{label:`Prepare experiment`,title:`Prepare samples, the verifier and the baseline`,subtitle:`Run once, in the four-step order shown.`,flow:[`Prepare seed examples and sources`,`List task types to generate`,`Check the verifier’s decisions`,`Fix the baseline and settings`],units:[{title:`Prepare seed examples and sources`,what:{lead:`Seed examples are confirmed correct, every file is traceable, and splits are set before generation.`,items:[[`Seed examples`,`tasks, reference answers or trajectories confirmed correct by programs or experts, so wrong answers are not multiplied.`],[`Sources`,`the reports, business documents, API documentation and data files that support the reference answers, supplying facts, accounting rules, data and API arguments.`],[`Source address, revision and checksum`,`saved for each seed example and each source; a checksum is computed from a file's content, so identical files have identical checksums and the same file placed in different splits can be detected.`],[`Splits`,`before generating tasks, split the tasks and sources into the train set, validation set (error analysis), validation set (update selection) and test set, keeping each report, original question and its rewrites in one split, so answers to tasks outside the train set cannot enter training through the same report or rewrites.`]]},blocks:[{type:`table`,headers:[`Existing material`,`What it is used for`,`What is saved`],rows:[[`Seed examples`,`Show correct answers and working tool operations.`,`Questions, answers, checked trajectories and sources.`],[`Source material`,`Supply facts, accounting rules, data and API arguments.`,`Original files, versions, source addresses and checksums.`],[`skill`,`Explain how the model should find material, calculate and check answers.`,`The operating instructions and examples actually read.`],[`Rubric`,`List requirements for a report.`,`Each requirement, supporting evidence and expert judgments.`]]}]},{title:`List task types to generate`,motivation:{lead:`Trial runs before choosing task types reduce repeated rewrites of one task and reveal early which tasks the teacher model cannot yet solve.`,text:`Trial runs show which tasks the sources support and which operations the model often gets wrong.`},what:{lead:`The task-type list sets the operations, conditions and counts, with counts based on trial-run errors.`,items:[[`Operations and conditions`,`operations such as unit conversion and multiple-file calculations; conditions such as missing data, conflicting definitions and tool errors.`],[`Trial run`,`first try DocFinQA, relevant DSCodeBench tasks and a few FinSearchComp T3 tasks, for example 20 to 30 tasks per type from validation set (error analysis) with fixed repetitions, to see which operations the model often gets wrong.`],[`Counts`,`set the count of each task type from the error types in the train set and validation set (error analysis), without reading test set scores, so test set scores cannot influence what is generated.`]]},how:{lead:`Once the list is set, step 3 knows which cases the verifier must handle.`},blocks:[]},{title:`Check the verifier’s decisions`,motivation:{lead:`A wrong reference answer or trajectory that passes the checks enters training, so first check whether the verifier misjudges.`},what:{lead:`Check the verifier on known-correct and known-incorrect reference answers and trajectories, then fix the checking rules.`,items:[[`Verifier`,`the programs and human checks that examine reference answers and trajectories: numerical tasks are recalculated, code tasks run unit tests, and reports are checked with a rubric and by experts.`],[`Verifier check`,`prepare known-correct and known-incorrect reference answers and trajectories, check whether the verifier misjudges them, correct the checking programs, numerical tolerances and the rubric accordingly, and inspect the disagreements between expert and program judgments.`],[`Fixed rules`,`fix these checking rules once the main experiment starts and generate each new task's reference answer and intermediate values under them, so each round's score changes can be attributed to that round's chosen change.`]]},how:{lead:`Every later round checks training samples and paired evaluations under this one set of checking rules.`},blocks:[]},{title:`Fix the baseline and settings`,motivation:{lead:`Every later round is compared with an old system, so a runnable initial system is fixed before the main experiment.`,text:`The initial setup can be fixed only after the first three steps settle the sources, task types and checking methods.`},what:{lead:`The baseline saves five parts; before the main experiment, the pipeline is tested and the budgets and rules are written down.`,items:[[`Baseline`,`the checkpoint M₀ from before this project's training, initial skill S₀, Claude Code H₀, task template S_gen and checking rules V₀; H₀, S_gen and V₀ stay unchanged during the main experiment, and M₀ and S₀ are tested on the test set alongside the three groups' final models at the end.`],[`Pipeline test`,`first get file reading, calculation, skill loading and model-input logging working, then complete a minimal LoRA training run, export, service loading and inference on four GPUs, so setup problems surface before comparisons start.`],[`Written rules`,`save the data split, task-type list, inference budget, training budget, maximum number of rounds, the rule for choosing each round's change and the requirements for keeping an update, so every round chooses changes and keeps updates by the same rules.`],[`Initial scores`,`all three groups' actors and the teacher model start from M₀; initial scores are recorded only on validation set tasks, because the test set runs only after all rounds.`]]},how:{lead:`The three groups start from the same point and afterwards each keeps its own LoRA adapter.`},blocks:[{type:`note`,text:`If model connection, trajectory capture, four-GPU training or exported-model inference fails, stop the main experiment. Correct settings and recheck them; do not credit those setting changes to skill edits or training.`}]}]},{label:`Choose this round’s change`,title:`Examine failures and choose only one change`,subtitle:`Every round starts here. Choose before proposing a change.`,flow:[`Save round-start versions`,`Read failed trajectories`,`Choose edit skill or generate data and train`,`Run only the chosen change`],units:[{title:`Save round-start versions`,motivation:{lead:`Actors, the teacher model and the skill may have changed in earlier rounds, so record where this round starts.`},what:{lead:`Save each group's actor and the shared parts, and keep the old versions directly rerunnable.`,items:[[`What is saved`,`each group's actor with its LoRA adapter, plus the shared skill, teacher model, task template, checking rules, task files and budgets.`],[`Rerunnable`,`before this round proposes new versions, make sure the old versions can be rerun directly, so paired evaluation can run them on the same tasks.`]]},how:{lead:`What this round changes can be compared exactly, and the old versions can be restored if the update is not kept.`},blocks:[]},{title:`Read failed trajectories`,motivation:{lead:`Only specific errors show whether editing the skill could fix them or generating data and training is needed.`},what:{lead:`Find the failing step and its cause in train set failed trajectories, ruling out causes other than the model first.`,items:[[`Failed trajectory`,`contains the task, model inputs, model outputs, tool calls, tool responses and the unmet requirements.`],[`Error analysis`,`reads these records to find at which step and why the model failed.`],[`Data used`,`summarize all three groups' trajectories on train set tasks; validation set (error analysis) supplies only error types and counts, so its tasks and answers never reach generation.`],[`Order of checks`,`first rule out missing sources, unavailable tools and incomplete trajectories, because the errors they cause do not show a lack of model capability; then decide whether the skill leaves a rule unclear or the model repeatedly acts wrongly despite an adequate skill and sources.`]]},how:{lead:`Errors are sorted into an unclear skill or repeated operation errors, and step 3 chooses this round's change from that; when the cause cannot be determined or sources or tools fail, step 3 pauses the round.`},blocks:[]},{title:`Choose edit skill or generate data and train`,motivation:{lead:`Deciding the round's single change first keeps score changes traceable to it.`,text:`Otherwise a second change could be added in the same round after the first looks disappointing.`},what:{lead:`Choose one of two changes by the preset rules; all three groups make the same choice.`,items:[[`Two changes`,`edit skill changes the operating instructions; generate data and train changes the training samples and LoRA adapters.`],[`Choice rules`,`choose by the rules written before the experiment, shown in the table below; when both an unclear skill and repeated operation errors occur, choose edit skill first; pause the round when the cause cannot be determined.`],[`Same choice`,`all three groups make the same choice, so differences between groups come from their training recipes.`]]},how:{lead:`This round enters only stage 3 or stage 4, or pauses.`},blocks:[{type:`table`,headers:[`What existing records show`,`Round’s choice`,`What remains unchanged`],rows:[[`Unclear steps, units or accounting rules`,`Edit skill`,`Task-model and teacher-model weights.`],[`Adequate skill and sources, but repeated operation errors`,`Generate data and train`,`The skill and this round’s teacher model.`],[`Sources, tools, logs or checking rules fail`,`Pause the round`,`Keep old versions and do not create unchecked training samples.`]]}]},{title:`Run only the chosen change`,motivation:{lead:`Changing one thing per round lets the same tasks show whether that change worked.`},what:{lead:`Enter only the stage for the chosen change, and do not switch after a failure.`,items:[[`Stage`,`edit skill leads to stage 3 and generate data and train leads to stage 4; the other stage does not run this round.`],[`Failure`,`if the new skill's scores miss the requirements for keeping an update or the teacher model cannot produce enough checked training samples, keep the old versions and end or pause the round.`]]},how:{lead:`The next round returns to stage 2 to choose again.`},blocks:[]}]},{label:`Edit skill`,title:`Edit instructions without changing model weights`,subtitle:`Run only when this round chose edit skill.`,flow:[`Keep all model weights fixed`,`Edit skill`,`Run paired evaluation of old and new skill`,`Submit skill and comparison results`],units:[{title:`Keep all model weights fixed`,motivation:{lead:`Score changes must be attributable to the skill edit, so nothing else may change.`},what:{lead:`All model weights and other settings stay at their round-start versions.`,items:[[`Model weights`,`all actors and the teacher model use their round-start model weights, including LoRA adapters.`],[`Other settings`,`the task template, Claude Code and checking rules stay unchanged.`],[`Not done this round`,`no training samples are generated, no model is trained and the teacher model is not replaced.`]]},how:{lead:`When stage 5 checks this round, all model weights must match the round start.`},blocks:[]},{title:`Edit skill`,motivation:{lead:`Stage 2 found that the errors come from rules the skill leaves unclear, so the matching instructions are edited.`},what:{lead:`Edit only the skill's text and examples, and save the diff.`,items:[[`Skill`,`the operating instructions the model reads while executing tasks, including steps, accounting rules, explanations of tool arguments and examples.`],[`Scope`,`based on failed trajectories from the train set, edit only the relevant text or examples, so it is clear which instruction changed the model's actions.`],[`Diff`,`save the diff between the old and new versions for the submission in step 4.`],[`Settings`,`settings that affect model selection, permissions, hooks or helper scripts stay unchanged, keeping Claude Code consistent.`]]},how:{lead:`The new skill goes to step 3 for paired evaluation.`},blocks:[]},{title:`Run paired evaluation of old and new skill`,motivation:{lead:`Stage 5 decides whether to keep the update from the old and new skill scores, so the two are compared first.`},what:{lead:`Each group runs the old and new skill on the same tasks with identical conditions and inference budget.`,items:[[`Paired evaluation`,`runs the old and new versions on the same tasks under the same conditions and compares scores task by task; here the same actor runs with the old skill and with the new skill.`],[`Tasks`,`the same validation set (update selection) tasks; this part of the validation set is used only to decide whether to keep updates.`],[`Conditions`,`the same files, tools and inference budget (tokens, tool calls and time limit); every run starts from a fresh session and the same file state, and retries count against the inference budget, which reduces score differences caused by task difficulty, source changes or retry counts.`],[`Results`,`compute scores on the preset primary metrics and record task-by-task differences.`]]},how:{lead:`The comparison goes to step 4 for submission, and the skill in use is not replaced before stage 5.`},blocks:[]},{title:`Submit skill and comparison results`,motivation:{lead:`The versions in use are replaced only in stage 5, so one round never makes two update decisions at different stages.`},what:{lead:`Submit the new skill and its comparison record, then go directly to stage 5.`,items:[[`Submission`,`the new skill, the text diff, task-by-task scores and a record of whether the requirements for keeping an update were met.`],[`Next step`,`go directly to stage 5 to decide whether to keep the update; this round does not enter stage 4.`]]},how:{lead:`If kept, the new skill is shared by all three groups' actors from the next round and affects newly generated trajectories only in later training rounds.`},blocks:[]}]},{label:`Generate data and train`,title:`Generate one batch and train three fixed methods`,subtitle:`Keep the skill fixed throughout; keep the teacher model fixed during generation.`,flow:[`Fix skill and teacher model`,`Write tasks and reference answers`,`Execute tasks and check records`,`Fix this round’s training samples`,`Train the three fixed methods`],units:[{title:`Fix skill and teacher model`,motivation:{lead:`All three groups must use the same batch of training samples, so the generation conditions are fixed first.`},what:{lead:`The groups share one skill and one teacher model this round, and task types follow stage 2 errors.`,items:[[`Shared parts`,`the skill, teacher model, task template, Claude Code and checking rules are fixed for this round; the teacher model has the same parameter scale as the actors.`],[`Task types`,`choose this round's task types from the error types recorded in stage 2, so the generated tasks target operations the model often gets wrong.`],[`Order`,`until generation finishes, do not train the actors or replace the teacher model, so the batch does not become inconsistent because the teacher model changed.`]]},how:{lead:`The teacher model can be replaced no earlier than this round's stage 5, and a new teacher model is used only in later training rounds.`},blocks:[]},{title:`Write tasks and reference answers`,what:{lead:`Generate new tasks from train set sources with the task template; numerical tasks get their reference answer before the question is written, and reports get their facts, evidence requirements and rubric first.`,items:[[`Task source`,`tasks in the training samples come from train set sources; following the task template, replace the company, fiscal year and conditions in seed examples to generate new tasks, and bind them to new real sources.`],[`Reference answer`,`the answer the verifier checks results against; for numerical tasks, check the extracted numbers, then compute the reference answer and intermediate values with a program.`],[`Intermediate values`,`record units, formulas and key steps.`],[`Read limits`,`actors and the teacher model may read only allowed sources during execution, never the reference answer, so trajectories cannot depend on it.`]]},blocks:[{type:`table`,headers:[`Published method`,`How this project uses it`],rows:[[`NVIDIA Nemotron 3 Super financial templates`,`Primary method: vary companies, fiscal years, measures and exceptions, then recompute answers from reports. Reuse the steps, not its teacher models or evaluation questions.`],[`Microsoft Foundry document QA and OpenAPI generation`,`Add questions from reports and business documents and tool tasks from API descriptions. Trajectories may call only tools and arguments actually provided by Claude Code.`],[`Salesforce Koa role and business-task combinations`,`Consider analyst roles, deliverables and constraints for complex workflows later. This generator is not implemented here.`]]},{type:`p`,text:`For a margin-change question, select a new training-side company and two fiscal years. Save original passages, units and accounting definitions, recompute margins and changes, then ask the model to find numbers, calculate and explain them. Remove questions with incomparable definitions or missing values, or explicitly ask for an insufficient-information answer. Always recompute after changing a company or number.`},{type:`p`,text:`Tasks selecting a unique company save the permitted company set, entity IDs, evidence locations, units, intermediate values and final answer. Ties need an explicit rule; extrema need a gap large enough for numerical tolerance. Check extracted values against sources and the calculation program against an independent implementation or known cases.`},{type:`p`,text:`Use all groups’ round-start training records to add commonly failed task types. Add files, parameter ranges or conditions for familiar tasks, rebuilding reference answers each time. Reports have no unique full-text answer; experts still check explanations and citations. Axion informs these methods.`}]},{title:`Execute tasks and check records`,what:{lead:`The teacher model actually executes under the current setup, its actual model inputs are saved, and the checking rules are applied.`,items:[[`Trajectory`,`contains the model inputs the teacher model actually read at each step, its model outputs, tool calls, tool arguments, real tool responses and final answer.`],[`Execution`,`the teacher model executes tasks under the current Claude Code, skill and allowed sources; sampling several times and retrying after real errors are allowed, with all attempts counted against the generation budget; reset the session and files for complete reruns.`],[`Saved model inputs`,`save model inputs after context compaction, so it can be checked whether a trajectory depends on private reference answers, extra teacher prompts or information that appeared only after execution.`],[`Checks`,`under the checking rules, run unit tests, recalculate numbers, compare against original sources and the rubric, and ask experts when needed; trajectories whose correctness cannot be decided are not used for training.`]]},blocks:[{type:`note`,text:`If an earlier record used reference answers, extra hints or future information, rerun without that information and check the new execution. Do not simply remove hints while retaining old outputs. Model-written claims of tool success cannot replace real responses.`},{type:`table`,headers:[`Trajectory`,`How it is kept`,`Outputs used for training`],rows:[[`Success on the first attempt`,`Check answers, operations and evidence.`,`Correct model outputs, arguments and final answer.`],[`Success after an error`,`Keep the actual error and earlier operations; verify the subsequent recovery.`,`Use wrong actions as input history without training loss. Train only checked later correct outputs.`],[`Success after removing extra operations`,`Rerun shortened operations from the same initial file state.`,`Use outputs only if the shortened execution still succeeds.`],[`Success on a new task`,`Create a task from training material, recompute its answer and execute.`,`Use only its actual, checked outputs.`]]}]},{title:`Fix this round’s training samples`,motivation:{lead:`The difference between Mixed and A → B must be limited to the order of new training samples, so the data is fixed before training.`,text:`Which training samples are usable is known only after the teacher model's trajectories have been executed and checked, so this step follows step 3.`},what:{lead:`Deduplicate, add seed examples and replay data, split into D_A and D_B, and have all groups read the same files.`,items:[[`D_A and D_B`,`D_A inputs already supply all necessary material; D_B first requires reading files or searching to obtain material not supplied directly.`],[`Deduplication and additions`,`first deduplicate the training samples, then add seed examples and replay data (checked trajectories saved from earlier rounds) in preset amounts.`],[`Fixed contents`,`fix the difficulty proportions, file list and versions; all three groups read the same files.`],[`Question assignment`,`put each original question and its rewrites in only one of D_A and D_B, so no answer shown in D_A reappears in D_B with only the material removed.`],[`No later edits`,`after training starts, do not revise this round's data because of any group's scores.`]]},how:{lead:`In step 5, the three groups use this same batch by their own training recipes.`},blocks:[{type:`table`,headers:[`Samples`,`What is supplied`,`Operations to train`],rows:[[`D_A`,`Necessary passages, numbers, rules or function requirements; tools remain allowed.`,`Select formulas, transform data and check answers from supplied material.`],[`D_B`,`Some necessary material is missing; available file, document or checked web tools can retrieve it.`,`Find material first, then calculate, execute code, build models or recover from errors.`]]},{type:`note`,text:`Archive all checked trajectories. Choose later reuse under a rule written before the experiment, with one shared list. Pause if the required checked samples are insufficient; retain the old skill and model weights.`}]},{title:`Train the three fixed methods`,motivation:{lead:`This round's fixed training samples are trained by the three training recipes separately, so the groups can compare the recipes.`},what:{lead:`The groups continue training by their own training recipes with the same supervised token budget and the same proportion of seed examples and replay data.`,items:[[`Three training recipes`,`each group continues from its own last kept LoRA adapter: B-only uses only new D_B; Mixed mixes new D_A and D_B in a fixed proportion; A → B trains new D_A and then new D_B.`],[`Other conditions`,`base weights and the skill stay unchanged, and Mixed trains each new training sample the same number of times as A → B; together these give a clear comparison among the three groups.`],[`Optimizer`,`reinitialize the optimizer at the start of each round; A → B keeps the optimizer state and learning-rate schedule when switching from D_A to D_B.`],[`Hardware`,`use an existing training framework to place the BF16 n-gram embedding on the CPU, and train the three groups one after another on four GPUs.`]]},how:{lead:`Each group gets this round's new model, which stage 5 compares with that group's old model.`},blocks:[{type:`list`,items:[`Train only correct assistant outputs, including checked tool arguments and final answers. System/user messages, tool responses and known wrong actions may remain inputs but do not contribute to loss. Use the model’s actual chat and tool format; do not invent missing reasoning.`,`Split long records at message boundaries and retain the history needed to explain subsequent actions. Avoid training the same target token twice in overlapping windows. Record training-window length separately from task-execution context length.`,`Record base version, previous LoRA version, target layers, rank, optimizer, learning rate, batches, GPU distribution, data checksums and random seeds. Complete four-GPU training and exported-model loading checks before main training.`,`Keep fitting, tuning and final-scoring data separate inside modeling tasks, hiding final labels from executing models. Manage this separately from which agent tasks belong to training, development and test-set evaluation.`]}]}]},{label:`Decide which version to use`,title:`Check scores and choose next round’s versions`,subtitle:`Only this stage changes the skill, actors or teacher model actually used.`,flow:[`Confirm what this round changed`,`Read paired evaluation results`,`Keep the update or the previous version`,`Start another round or finish`],units:[{title:`Confirm what this round changed`,motivation:{lead:`Score differences correspond to this round's chosen change only if nothing else changed.`},what:{lead:`Check the actual changes against the round-start versions: only the chosen change may differ.`,items:[[`Edit-skill rounds`,`all model weights must be unchanged.`],[`Training rounds`,`the skill must be unchanged.`],[`Both`,`tools and checking rules must match the round start.`]]},how:{lead:`Only after this check does step 2 read the paired evaluation results.`},blocks:[]},{title:`Read paired evaluation results`,motivation:{lead:`Task-by-task comparison shows which tasks went from wrong to right and which from right to wrong.`},what:{lead:`Compare old and new versions on validation set (update selection) by the preset rules; the test set is not used.`,items:[[`Edit-skill rounds`,`decide only from the three groups' old and new skill scores saved in stage 3.`],[`Training rounds`,`run each group's old and new model on the same tasks with the same skill, files, tools and inference budget; equal conditions reduce differences caused by sources and run counts.`],[`Decision rule`,`decide by the preset primary metrics, tolerated declines and cost limits; failures, timeouts and incomplete tasks all count in the scores.`]]},how:{lead:`Each new version gets a verdict on whether it meets the requirements for keeping an update, which step 3 acts on.`},blocks:[]},{title:`Keep the update or the previous version`,motivation:{lead:`The skill is shared and the models are trained separately, so the skill is decided jointly and the models group by group.`},what:{lead:`A version that meets the requirements for keeping an update is used from the next round; otherwise the old version stays in use.`,items:[[`Skill`,`the new skill is shared by all three groups only if no group's decline exceeds the tolerance and the score under the preset aggregation rule improves.`],[`Models`,`in training rounds, judge each group separately: keep its new model if it meets the requirements, otherwise keep its old model, with its training recipe unchanged; never copy the best group's model weights to other groups, so the three training recipes can be compared.`]]},how:{lead:`This step settles the skill and each group's actor for the next round.`},blocks:[{type:`p`,text:`Only at a training round’s end may copies of its model candidates be considered as teacher models. Compare with the old teacher on reserved generation tasks under the same skill, task template and full generation budget. Use preset checking rules and ranking; keep the old teacher if none qualifies. Do not move these reserved tasks into training.`},{type:`p`,text:`A new teacher generates data only in later training rounds and cannot regenerate this round’s batch. Edit-skill rounds do not replace teachers. Save old/new versions, rejected updates and scores.`}]},{title:`Start another round or finish`,motivation:{lead:`The test set takes no part in generating tasks or deciding whether to keep updates, so it is kept to the end to measure performance on unseen tasks after training.`},what:{lead:`Return to stage 2 until a stopping condition is reached; after all rounds, test all systems together on the test set.`,items:[[`Next round`,`end the round whether or not the update is kept; until the maximum number of rounds or the stopping rule is reached, the next round returns to stage 2.`],[`Finish`,`save the three groups' final models and the last skill used; only after all rounds, run on the test set M₀ with initial skill S₀ and the three groups' final models with the last skill used, reporting scores and confidence intervals per dataset.`],[`Tool changes`,`if a tool version must change, pause the experiment and rerun the affected initial comparisons.`]]},how:{lead:`The three groups share the skill and teacher model, so the final comparison is of the long-term effect of the three training recipes.`},blocks:[]}]}],diagnosisTitle:`Use failed trajectories to choose this round’s change`,diagnosisNote:`These examples explain the decision rules; they are not results. Evidence comes from completed attempts, before this round changes a skill or model.`,caseLabel:`Failure example`,observationLabel:`What went wrong`,replayLabel:`What existing records show`,actionLabel:`What this round does`,cases:[{name:`Unclear skill rule`,observation:`The answer confuses percentage-point change with percentage growth.`,replay:`Existing skill does not distinguish the formulas; saved records show the model using the wrong one.`,action:`Edit skill`,reason:`Add the formula explanation and an example, then compare old and new skill on the same tasks from the validation set. Do not train this round.`},{name:`Errors despite adequate rules`,observation:`Skill gives the formula, material and units are complete, yet the model repeatedly selects wrong arguments.`,replay:`Several saved training-task records show the same error despite adequate instructions.`,action:`Generate data and train`,reason:`Keep skill fixed, generate correct trajectories and train each group with its fixed method.`},{name:`Insufficient source material`,observation:`The answer gives a margin-change explanation not supported by the source.`,replay:`Existing material cannot establish the explanation; self-rating adds no source evidence.`,action:`Pause and add sources or expert checks`,reason:`Uncheckable answers are not training samples. Do not yet choose a skill edit or model training from this evidence.`},{name:`Tool or context limit`,observation:`An unavailable tool or session-length limit prevents completion.`,replay:`Records locate the failure in current Claude Code settings or model connection.`,action:`Record the limit and pause dependent experiments`,reason:`Keep Claude Code fixed without writing another runtime. If necessary settings change, rerun affected comparisons.`}],previousLabel:`Previous stage`,nextLabel:`Next stage`,restartLabel:`Next round: inspect failed trajectories`,evaluationHeading:`Evaluation Metrics`,evaluationNote:`Compare choosing updates from task failures with skill-only and fine-tuning-only updates using the same evaluation tasks, inference budget and scorer. Separately compare B-only, Mixed and A → B training recipes in training rounds. Aggregate each metric by dataset.`,metricHeaders:[`Metric`,`How it is calculated`,`Applicable datasets`],metrics:[[`Accuracy`,`Use each dataset’s official scoring program to compare final and reference answers and calculate the fraction correct. Obtain DABstep Hard results through official external scoring.`,`DocFinQA; FinSearchComp T2/T3; DABstep Hard; DSBench financial-analysis subset`],[`Code pass rate`,`Fraction of tasks whose final code passes all official tests within the preset runtime budget. State whether Claude Code may call tools and retry; report those results separately from native single-generation Pass@1.`,`Relevant DSCodeBench subset`],[`Task metric / RPG`,`Score test predictions with each task’s required metric. Across tasks use official RPG, where the reference model scores 0 and the reference best result scores 1, following the official calculation. Higher RPG is better.`,`DSBench financial-modeling subset`],[`HisRubric score`,`Use the official HisRubric rubric and aggregation rule, keeping the judge model and source cutoff fixed. Report fixed-file evaluations separately from official online results.`,`FinDeepResearch`],[`Strict prompt-level accuracy`,`Use the official strict checker to calculate the fraction of prompts satisfying all checkable instructions. Check whether general instruction following declines after training.`,`IFEval`]],acceptanceHeading:`What results would support the two contributions?`,acceptanceHeaders:[`What to establish`,`Which results to compare`,`What supports the conclusion`],acceptanceRows:[[`C1 · Can changing one thing per round improve task scores?`,`Compare old and new versions within each round. Separately compare choosing updates from failures, always editing skill and always fine-tuning, starting from the same checkpoint and data split with the same Claude Code, total budget and stopping rules. Evaluate all final systems on the test set.`,`An advantage over both fixed update methods on the preset primary metric, without an IFEval decline beyond tolerance, supports choosing updates from failures.`],[`C2 · Do same-size teacher samples help, and does adding tasks around errors help further?`,`Fix the teacher model, actor starting point, skill and training recipe. Compare adding tasks from failed trajectories with generating from a fixed task-type list. Match generation budget, A/B proportions, supervised token budget and checking rules.`,`First show that training on the same-size teacher’s samples improves unseen-task scores. An additional advantage over fixed task types supports adding tasks around errors. A separate claim for replacing the teacher model requires comparing the old and new teacher models.`]],referenceNote:`These sources describe existing models, tools and methods.`,references:[{title:`Qwen3.8-Flash-Next · Official Model Card`,url:`https://huggingface.co/Qwen/Qwen3.8-Flash-Next`,description:`Check model architecture, parameter counts and download revision. BF16 is weight precision.`},{title:`NVIDIA · RTX PRO 6000 Blackwell`,url:`https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/`,description:`Check the 96GB card specification; record actual card type and host connections in trial runs.`},{title:`Megatron-SWIFT · Qwen3.8-Flash-Next Best Practice`,url:`https://swift.readthedocs.io/en/latest/BestPractices/Qwen3_8-Flash-Next-Best-Practice.html`,description:`Use existing BF16 LoRA and PLE-on-CPU support. Eight-GPU measurements do not establish four-GPU feasibility.`},{title:`Axolotl · Qwen 3.8 Flash Next`,url:`https://docs.axolotl.ai/docs/models/qwen3.8-flash-next.html`,description:`Check loaded parameter scope and PLE size for BF16 weight-memory estimates.`},{title:`Claude Code · Programmatic Execution`,url:`https://code.claude.com/docs/en/headless`,description:`Use existing command-line task execution and logging without building another tool-call loop.`},{title:`Claude Code · Skills`,url:`https://code.claude.com/docs/en/skills`,description:`Use existing skill files and loading to supply operating instructions.`},{title:`vLLM · Claude Code Integration`,url:`https://docs.vllm.ai/en/stable/serving/integrations/claude_code/`,description:`Connect local Qwen through the compatible interface; actual models, tool calls and records still need checks.`},{title:`NVIDIA Nemotron 3 Super · SFT training data`,url:`https://docs.nvidia.com/nemotron/latest/nemotron/super3/sft.html`,description:`Reference financial templates varying company and year, together with real tool execution.`},{title:`Microsoft Foundry · Synthetic Data Generation`,url:`https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation`,description:`Reference document QA and OpenAPI tool-task generation, without assuming this service trains the project’s Qwen.`},{title:`Salesforce Koa · September 15, 2026 Announcement`,url:`https://www.salesforce.com/news/press-releases/2026/09/15/koa-reasoning-model/`,description:`Reference role, task and business-constraint combinations. The announcement is not a complete implementation.`},{title:`Axion 1.0: Open Agent Foundation Models, Simplified (2026)`,url:`https://arxiv.org/html/2611.03233v2`,description:`Reference answer-first task construction, tasks chosen from model errors and A-then-B training. Full-parameter SFT results are not this project’s LoRA results.`},{title:`Agent-R: Training Language Model Agents to Reflect via Iterative Self-Training (2025)`,url:`https://arxiv.org/abs/2501.11425`,description:`Reference searching for corrected operations and training on verified recovery.`},{title:`Re-ReST: Reflection-Reinforced Self-Training for Language Agents (EMNLP 2024)`,url:`https://aclanthology.org/2024.emnlp-main.861/`,description:`Reference actual environment responses for checking model-generated trajectories.`},{title:`ReSTᴱᴹ: Beyond Human Data (2023 / 2024)`,url:`https://arxiv.org/abs/2312.06585`,description:`Reference repeated execution, checking, training and repetition.`},{title:`DSCodeBench · Controlled coding comparison`,url:`https://arxiv.org/html/2505.15621v3`,description:`Check task construction and DS-1000 comparisons, not this project’s 180B scores.`},{title:`DABstep · Evaluation protocol`,url:`https://arxiv.org/html/2506.23719v1`,description:`Check public developer tasks, hidden answers and official scoring.`},{title:`DABstep · Official leaderboard`,url:`https://huggingface.co/spaces/adyen/DABstep`,description:`Check dataset version, validation status and submission requirements.`},{title:`DSBench · Source and task manifests`,url:`https://github.com/LiqiangJing/DSBench`,description:`Check financial analysis and prediction tasks; numerical regression does not mandate a linear model.`},{title:`FinSearchComp · ICLR 2026`,url:`https://proceedings.iclr.cc/paper_files/paper/2026/file/4d42358702dff82e1436550a05ade260-Paper-Conference.pdf`,description:`Check tasks, data-time requirements and scoring; inspect released trajectory files.`},{title:`FinSearchComp · Implementation`,url:`https://github.com/randomtutu/FinSearchComp`,description:`Distinguish the full task bank from AkShare-compatible tasks and available sources.`},{title:`DocFinQA · Original paper`,url:`https://aclanthology.org/2024.acl-short.42/`,description:`Check numerical questions over supplied long financial reports.`},{title:`FinDeepResearch · Original benchmark scale`,url:`https://arxiv.org/abs/2
