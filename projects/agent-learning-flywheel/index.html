},"dataOverview":"The datasets cover financial-report questions, historical financial search, company research reports, coding, payment data processing, workbook analysis, predictive modeling, and instruction following.","datasetDetailsTitle":"Dataset details","dapoReward":{"title":"Future DAPO: establish financial correctness before quality and cost","status":"This is a proposal for future research. DAPO uses a training score to reward correct financial answers with reliable evidence. The main experiment uses correct demonstrations for supervised fine-tuning (SFT). LoRA determines which parameters train and could also be used with DAPO.","scope":"The proposal covers financial tasks our data can verify: financial-report questions, historical fact retrieval, company analysis and source-supported industry comparisons. Current data lacks customer risk preferences, holdings and investment constraints, so it does not establish personalized allocation or suitability capability.","scopeHeaders":["Financial scenario","What the data supports","What the Reward checks"],"scopeRows":[["Customer / deep financial questions","Financial extraction and calculation in DocFinQA; historical lookup and cross-source investigation in FinSearchComp T2/T3. Construct RL tasks only from isolated Train sources.","Check company, fiscal period, accounting definition, currency and units; recompute answers independently; require supporting evidence available by the task cutoff."],["Stock / company analysis","The numerical and retrieval subtasks can train the actor. FinDeepResearch remains evaluation-only: its evaluation companies, references and derived tasks stay outside training. Report-level RL requires separately sourced Train companies and scoring rules.","Check critical numbers and evidence first, then use a fixed rubric to assess required coverage, internal consistency and supported risk / uncertainty analysis. A rubric is an itemized scoring guide; sentiment or writing style is not the objective."],["Factual comparisons within industry analysis","Limit scope to report-supported industry context, business segments and comparable calculations. FinDeepResearch requests industry context, but this does not provide a separate industry-wide training corpus.","Align entities, periods and definitions; distinguish sourced industry facts from inference. A single company disclosure cannot support an industry-wide claim on its own."],["Calculation and execution as supporting skills","DSCodeBench and DSBench analysis support tables, statistics and tested code. DSBench financial modeling, DABstep and IFEval retain their existing boundaries; their names do not make them allocation datasets.","Verify real computations, tests and tool logs. Generic coding / instruction scores do not establish financial truth; DABstep final-test tasks cannot tune the Reward."]],"rewardTitle":"Our proposal: check critical validity before quality and cost","rewardIntro":"A wrong critical figure or unsupported conclusion earns a low score. After the key checks pass, complete analysis earns points and unnecessary calls or overly long answers lose points. Programs recompute numbers, run tests and verify tool records. Opus 5.5 (high) judges whether the evidence supports the conclusion and the analysis is complete. This scoring setup still needs calibration.","formula":"Critical requirement failed: R = −1; all critical requirements met: R = 1 + αQ − βC − γL.","termIntro":"Critical requirements cover the answer and essential calculations, authentic supporting evidence and task constraints. Reports must ground critical facts and conclusions before other analytical quality is compared. All terms below lie in [0, 1]; α ≥ 0, β, γ ≥ 0 and β + γ < 1, so a valid execution always outranks a confirmed critical failure. Weights and thresholds remain unfrozen until independent calibration.","termHeaders":["Reward dimension","Our design","Why we choose it","Reference basis and project adaptation"],"termRows":[["Critical correctness and evidence: required","A confirmed critical answer, calculation or evidence error, or a missing required subanswer or result, gives R = −1; other points cannot compensate. Freeze the critical checklist before sampling. Q, C and L apply only after all critical requirements pass.","Financial analysis depends on correct facts. Wrong fiscal periods, units or unsupported evidence can invalidate a central conclusion, so critical failures should always rank below valid executions.","DAPO §2.4 rewards verifiable outcomes. DocFinQA supplies filings and answers, with reference programs for some tasks; FinSearchComp §2.2–2.3 specifies periods, definitions and provenance. Combining these into non-compensable financial requirements and our formula is a project proposal without direct training evidence."],["Q: analytical quality of a valid answer","After all critical items pass, use a fixed rubric to assess sufficient explanation, supporting-analysis coverage and consistency between inference and evidence. Missing required items or unsupported critical conclusions fail outright rather than merely lowering Q. Q may be zero for objective short answers. A rubric is an itemized scoring guide.","The same correct conclusion can come with different levels of explanation. Q encourages supported comparisons, explanations and limitations, without rewarding length or citation count itself.","FinDeepResearch §2.3–2.4 evaluates recognition, calculation, abstraction and interpretation, summing and normalizing grading items. It supports itemized assessment, not our proposed validity-before-Q RL rule."],["C: unproductive tool use","Use real logs to identify repeated calls with no new evidence and irrelevant queries. Necessary evidence gathering is not penalized; report total calls, time and cost separately.","Reduce waste while preserving retrieval needed to finish the task. Rewarding fewer calls alone could encourage skipping evidence.","A project design motivated by execution cost; the current references do not directly establish its effect on financial task performance. Calibrate waste criteria and penalty weights first."],["L: excessive generated length","Increase the penalty gradually after a reasonable threshold, counting model-generated reasoning, tool arguments and answers only. Tool observations still occupy the context window and count toward actual cost.","Limit unnecessary generation without treating lengthy filings or tool observations as actor verbosity, or penalizing necessary evidence gathering.","DAPO §3.4, Eq.13 supplies the soft-length-penalty basis. Separating generated tokens from tool observations is our tool-task adaptation; thresholds remain unfrozen."]],"samplingTitle":"Sample the current model independently to guide this weight update","sampling":"Freeze the verified Skill, source snapshot, tools and budgets, then let the actor being updated execute each task several times without teacher hints and compare Rewards. These are on-policy data: executions produced by the current model for its policy update. Keep SFT demonstrations and Opus-assisted corrections separate. If shared across groups, they are not on-policy data from every recipient model and cannot be relabelled as independent RL executions.","filter":"Original DAPO math experiments remove all-correct / all-incorrect groups by correctness; the public recipe filters within-group variation in a specified metric. Here, objective tasks would use verified_success: 1 when all critical requirements pass, 0 otherwise. This group filter excludes the cost / length terms of the final Reward. Calibrated report tasks would use critical validity and meaningful differences in business quality Q, excluding cost-only or length-only variation. All-failure groups without useful business variation provide no relative signal: adjust curriculum difficulty or warm up with accepted SFT demonstrations rather than resampling indefinitely or inventing success from process points.","environmentTitle":"Fix source time, real tools and evaluation boundaries","environment":"Simulate the environment with as-of document / web snapshots and resettable workspaces. Execute real tools and preserve raw observations; keep private references and judge comments out of actor inputs. Use identical evidence access, tools and budgets within each group, preserving failures and actual costs. Programs handle reliable checks; Opus handles remaining semantics. For this RL option, each complete Train execution with a definite score and its scoring evidence is independently selected with 5% probability for an asynchronous human audit, which may trigger an external stop without blocking every record on human approval.","qualification":"Before enabling RL, use a separate Reward calibration set to test wrong periods / units, fabricated citations, omissions, unwarranted refusals, repeated calls and excessive output. Freeze scorer versions, weights, group size, resampling caps and task budgets, then qualify distributed normalization and real training. Distinguish infrastructure interruptions from model failures; do not automatically zero the loss of every unfinished trajectory and let deliberate truncation escape failure. Compare old and new weights with the same Skill on source-isolated, unhinted held-out tasks, reporting category scores, critical errors and cost. A higher Reward alone does not show transfer; never tune it on final test.","literature":"The references support verifiable outcome rewards, financial verification criteria, analytical assessment and length handling. The financial requirements, Q/C/L combination, filtering choices and unfrozen weights are our research proposal. No project RL comparison yet establishes that the combination outperforms alternatives. Current official code does not mandate Overlong Filtering; unfinished-trajectory training needs a separately frozen protocol.","uncertain":"Missing scoring materials, infrastructure failure or unresolved judgment means unscorable: repair and recollect the whole group within budget, otherwise leave it unused. This prevents a checking failure from becoming a correctness signal. Confirmed model-caused missing required subanswers or results, unwarranted refusals, fabricated tool records or exhausted task budgets remain task failures.","controlReason":"FinSearchComp historical tasks require period and definition alignment, and FinDeepResearch templates specify filing periods; these sources support as-of evidence requirements. We additionally fix the Skill, materials and tools to isolate training in old-versus-new weight comparisons, and exclude teacher hints, private references and judge comments to test independent problem solving. Snapshots, real-tool environments and the 5% asynchronous human audit are project controls; the cited work does not establish 5% as optimal or sufficient."},"harnessIntro":"Qwen uses Claude Code to read financial reports and run calculations. Claude Code records each tool call and its result so we can trace errors."}},d={"dataset-0":["docfinqa"],"dataset-1":["finsearchcomp-paper","finsearchcomp-code"],"dataset-2":["findeepresearch"],"dataset-3":["dscodebench"],"dataset-4":["dabstep-paper","dabstep-leaderboard"],"dataset-5":["dsbench"],"setting-0-0":["qwen-model","qwen-27b"],"setting-0-2":["claude-code","claude-skills"],"setting-0-3":["vllm-serving"],"setting-2-0":["swift-lora"],"setting-2-4":["swift-lora"],"setting-4-0":["nvidia-gpu"],"setting-4-1":["swift-lora"],"setting-4-2":["axolotl-memory","swift-lora"],"setting-2-5":["dapo-paper","dapo-implementation"],"execution-synthesis":["nemotron-data"],"candidate-task-types":["axion"],"candidate-data-rationale":["axion"],"execution-nvidia-select":["nvflow-select","nvflow-select-code"],"execution-nvidia-filter":["nvflow-filter"],"execution-nvidia-clean":["nvflow-clean","nvflow-prep","nvflow-prep-code","nemo-read-data"],"execution-star":["star"],"dapo-parameterization":["lora-paper","verl-rl-lora"],"dapo-scenario-scope":["docfinqa","finsearchcomp-paper","findeepresearch"],"dapo-dataset-scope":["docfinqa","finsearchcomp-paper","findeepresearch","findeep-task-structure"],"dapo-group-metric":["dapo-paper","dapo-group-filter"],"dapo-literature":["dapo-paper","dapo-implementation"],"dapo-dimension-0":["dapo-paper","docfinqa","finsearchcomp-paper"],"dapo-dimension-1":["findeepresearch"],"dapo-dimension-3":["dapo-paper","dapo-implementation"],"dapo-review-roles":["docfinqa","dscodebench","findeepresearch"],"dapo-on-policy":["dapo-paper"],"dapo-controls":["finsearchcomp-paper","findeep-task-structure"],"abstract-skill-only":["skillops","skillopt"],

    "appendix-lora": ["lora-paper"]},f=[...new Set(Object.values(d).flat())],p=[`Harness element`,`Core content`,`Implementation in this project`],m=[{element:`Context management`,cores:[`Prompt engineering`,`Agent state tracking`,`Context compression`,`Agent Skills`]},{element:`Context management: retrieval and cross-session memory`,cores:[`User memory`,`RAG`,`Structured indexing`,`Agentic RAG`]},{element:`Tool interfaces and constraints`,cores:[`Tool categories`,`Access control`,`MCP standard`,`Active tool discovery`]},{element:`Verification and correction`,cores:[`Coding Agent Harness`,`Test-driven execution`,`Codified rules`]}];function h(e){return m.map(({element:t,cores:n})=>({element:t,rows:n.map(t=>({core:t,implementation:e[t]}))}))}var g={"zh":{"note":"H₀ 固定为原版 Claude Code。底座可选 Qwen3.8-Flash-Next（FP8）或 Qwen3.8-27B（BF16），通过 vLLM 的 Anthropic-compatible service 接入。对所选底座核验接入和运行隔离。","groups":[{"element":"Context management","rows":[{"core":"Prompt engineering","implementation":"固定 system prompt、task template、output format 和 tools；每题按 template 填入对应问题与允许资料。"},{"core":"Agent state tracking","implementation":"复用固定 Claude Code 版本中可用的 native task state tracking，记录 task 状态及其在 trajectory 中的表示。"},{"core":"Context compression","implementation":"复用 native context compaction，保存 compaction 前后 actor 实际可见的输入。"},{"core":"Agent Skills","implementation":"沿用 native skill loading；只修改 skill 文字与示例，hooks、permissions 和 tools 固定。"}]},{"element":"Context management: retrieval and cross-session memory","rows":[{"core":"User memory","implementation":"每题使用独立 session 与工作目录，重置或禁用 cross-task memory，并检查跨题隔离。"},{"core":"RAG","implementation":"读取每题提供的文件。FinSearchComp 和 FinDeepResearch 可通过项目脚本搜索和读取公开网页。"},{"core":"Structured indexing","implementation":"未配置 BM25 或 vector index；仅使用带 source ID 与版本号的资料文件。"},{"core":"Agentic RAG","implementation":"actor 在 Claude Code 中按需多次读资料和运行计算。指定检索题可以继续查公开网页。"}]},{"element":"Tool interfaces and constraints","rows":[{"core":"Tool categories","implementation":"Qwen 可直接调用 Skill、Read、Bash、Agent 和 Write。系统保存调用参数和工具返回。"},{"core":"Access control","implementation":"沿用固定 permissions 与现有执行限制；actor 不得读取 reference answer、verifier 内部数据或其他题目的 trajectory。"},{"core":"MCP standard","implementation":"当前 Qwen 配置未连接 MCP server 或专用金融数据 API。"},{"core":"Active tool discovery","implementation":"每题使用同一组预先开放的 Claude Code 工具。"}]},{"element":"Verification and correction","rows":[{"core":"Coding Agent Harness","implementation":"actor 的 task calls 由原版 Claude Code native loop 执行；保存真实 model input、tool call、tool response 与 trajectory，不另写 custom harness。"},{"core":"Test-driven execution","implementation":"actor 可在 Claude Code sandbox 中运行 visible tests；hidden tests 由外部 verifier 执行。未配置强制 test-first 或 custom correction workflow。"},{"core":"Codified rules","implementation":"actor 外部的 verifier 使用固定 checking rules V₀，按 schema、numerical tolerance、原始证据和 rubric 检查结果，供 data filtering 与 paired evaluation 使用；不新增 custom completion-correction runtime。"}]}],"tools":{"title":"工具与能力","nativeTitle":"Claude Code 的五个工具","projectTitle":"项目编写或复用的五项功能","native":[["Skill","加载本题适用的做题规则，例如怎样取数和核对计算。"],["Read","读取本题允许访问的报告、表格或代码文件。"],["Bash","运行命令，例如用 Python 计算财务指标。"],["Agent","把限定范围的读文件或计算任务交给助手，并取回结果。"],["Write","在本题工作目录创建或修改输出文件，例如报告或预测结果。题目和原始材料保持只读。"]],"project":[["公开网页搜索","配置允许 Qwen 通过 Bash 调用项目脚本，脚本用第三方 ddgs 库返回搜索结果。仅向 FinSearchComp 和 FinDeepResearch 开放。"],["公开网页读取","Qwen 可通过 Bash 请求网页。搜索和网页读取共用改自 llm-pipeline 的联网通道，由项目记录返回的内容，开放范围相同。"],["准备本题材料","执行前，项目代码把题目和允许读取的材料放进该题单独的工作目录。"],["DocFinQA 数值评分","交答后，项目评分程序统一数值格式，再把回答与数据集保存的参考答案比较。"],["DSCodeBench 代码评分","交答后，项目评分程序用适配后的运行器执行官方测试，检查提交代码在测试输入上的输出。"]]},"examples":{"title":"SFT 样本格式示例","intro":"SFT（supervised fine-tuning）用示范回复微调模型。下面两条节选来自使用预设模型回复的格式测试。题目、返回和 ID 已简化，系统提示和工具定义已省略。真实财报合成题已核对参考答案，正式训练示范仍待验收。","format":"样本用 messages 保留题目、模型调用和工具返回。程序把工具返回写进 role: user 的 <tool_response>。训练时，前面的消息作为输入，只对标记 loss: true 的最后一条模型回复计算训练损失。若要训练某次工具调用，可以用截至这次调用的消息单独构成一条样本。","entries":[{"title":"样本一 · 所需数字随题提供","record":{"accepted_for_training":false,"messages":[{"role":"user","content":"Read task.json and answer the question."},{"role":"assistant","content":"","tool_calls":[{"id":"call_1","type":"function","function":{"name":"Read","arguments":{"file_path":"/workspace/task.json"}}}],"loss":false},{"role":"user","content":"<tool_response>\nAdd the two numbers on the specified line: 20 and 12.\n</tool_response>"},{"role":"assistant","content":"{\"answer\":\"32.00\",\"unit\":\"source_units\"}","loss":true}]}},{"title":"样本二 · 读取另一份文件，将第 3 行中的 1 和 4 相加","record":{"accepted_for_training":false,"messages":[{"role":"user","content":"Read task.json and answer the question."},{"role":"assistant","content":"","tool_calls":[{"id":"call_1","type":"function","function":{"name":"Read","arguments":{"file_path":"/workspace/task.json"}}}],"loss":false},{"role":"user","content":"<tool_response>\nAdd the first two numbers on line 3 of input-0.txt.\n</tool_response>"},{"role":"assistant","content":"","tool_calls":[{"id":"call_2","type":"function","function":{"name":"Read","arguments":{"file_path":"/workspace/input-0.txt"}}}],"loss":false},{"role":"user","content":"<tool_response>\n3\t| ITEM 1: BUSINESS. | 4 |\n</tool_response>"},{"role":"assistant","content":"{\"answer\":\"5.00\",\"unit\":\"source_units\"}","loss":true}]}}]}},"en":{"note":"H₀ is fixed to the original Claude Code. Connect either Qwen3.8-Flash-Next (FP8) or Qwen3.8-27B (BF16) through vLLM’s Anthropic-compatible service. Verify integration and task isolation for the selected checkpoint.","groups":[{"element":"Context management","rows":[{"core":"Prompt engineering","implementation":"Fix the system prompt, task template, output format and tools. Fill the template with each task's question and permitted materials."},{"core":"Agent state tracking","implementation":"Reuse native task state tracking available in the fixed Claude Code version, recording task states and their representation in the trajectory."},{"core":"Context compression","implementation":"Reuse native context compaction and save the actor's actual inputs before and after compaction."},{"core":"Agent Skills","implementation":"Use native skill loading and edit only skill content and examples. Hooks, permissions and tools stay fixed."}]},{"element":"Context management: retrieval and cross-session memory","rows":[{"core":"User memory","implementation":"Use an independent session and working directory per task, reset or disable cross-task memory, and check task isolation."},{"core":"RAG","implementation":"Read the supplied task files. FinSearchComp and FinDeepResearch can search and read public webpages through project scripts."},{"core":"Structured indexing","implementation":"No BM25 or vector index is configured. Use only source-ID-tagged, versioned files."},{"core":"Agentic RAG","implementation":"The actor can read sources and run calculations multiple times in Claude Code. Designated retrieval tasks can also query public webpages."}]},{"element":"Tool interfaces and constraints","rows":[{"core":"Tool categories","implementation":"Qwen can directly call Skill, Read, Bash, Agent and Write. The runtime records the arguments and tool outputs."},{"core":"Access control","implementation":"Reuse fixed permissions and existing execution constraints. The actor must not access reference answers, verifier internals or other tasks' trajectories."},{"core":"MCP standard","implementation":"The current Qwen configuration connects to no MCP servers or dedicated financial data APIs."},{"core":"Active tool discovery","implementation":"Every task uses the same predefined set of Claude Code tools."}]},{"element":"Verification and correction","rows":[{"core":"Coding Agent Harness","implementation":"Execute the actor's task calls in the original Claude Code native loop. Save actual model inputs, tool calls, tool responses and trajectories without writing a custom harness."},{"core":"Test-driven execution","implementation":"The actor may run visible tests in the Claude Code sandbox. An external verifier runs hidden tests. No mandatory test-first or custom correction workflow is configured."},{"core":"Codified rules","implementation":"The external verifier applies fixed checking rules V₀: schema checks, numerical tolerances, source evidence and the rubric. Results support data filtering and paired evaluation; no custom completion-correction runtime is added."}]}],"tools":{"title":"Tools and capabilities","nativeTitle":"Five Claude Code tools","projectTitle":"Five functions built or reused by the project","native":[["Skill","Load the instructions for the task, such as how to extract figures and check calculations."],["Read","Open reports, tables or source files supplied for the task."],["Bash","Run commands, such as a Python calculation for a financial metric."],["Agent","Delegate a bounded reading or calculation task to a helper and collect its result."],["Write","Create or edit outputs, such as a report or prediction file, in the current task's workspace. The task and source materials stay read-only."]],"project":[["Public web search","The configuration lets Qwen call a project script through Bash. The script uses the third-party ddgs library to return search results. Enabled for FinSearchComp and FinDeepResearch."],["Public page fetch","Qwen can request a page through Bash. Search and fetch share a network bridge adapted from llm-pipeline. The project records the returned content, and both functions are enabled for the same datasets."],["Task material staging","Before execution, project code puts the question and its permitted materials in a separate working directory for that task."],["DocFinQA numeric scoring","After submission, the project scorer normalizes numeric formatting and compares the answer with the reference stored in the dataset."],["DSCodeBench code scoring","After submission, the project scorer runs the official tests in an adapted runner and checks what the submitted code returns on test inputs."]]},"examples":{"title":"SFT sa
