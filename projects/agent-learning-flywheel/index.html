/* BEGIN FLYWHEEL OVERRIDES */
.key-takeaways-list { margin: 0; padding-inline-start: 1.55em; }
.key-takeaways-list > li + li { margin-block-start: .9rem; }
.key-takeaways-list p { margin: .45rem 0 0; }
.dataset-table { min-width: 1050px; table-layout: fixed; }
.dataset-table th:nth-child(1), .dataset-table td:nth-child(1) { width: 15%; }
.dataset-table th:nth-child(2), .dataset-table td:nth-child(2) { width: 34%; }
.dataset-table th:nth-child(3), .dataset-table td:nth-child(3) { width: 23%; }
.dataset-table th:nth-child(4), .dataset-table td:nth-child(4) { width: 28%; }
td { white-space: pre-line; overflow-wrap: anywhere; }
.settings-group { border: 1px solid #dcd5e9; border-radius: 10px; margin: 12px 0; padding: 0; }
.settings-group > summary { cursor: pointer; padding: 17px 22px; color: #593887; }
.settings-group > summary h3 { display: inline; margin: 0; font-size: 1.12rem; }
.settings-group[open] > summary { border-bottom: 1px solid #e8e2ef; }
.settings-group > .settings-list { padding: 0 22px 10px; }
.shared-architecture { max-width: 1000px; margin: 32px auto; scroll-margin-top: 56px; }
.diagram-scroll { overflow-x: auto; border: 1px solid #e3ddec; border-radius: 10px; background: white; }
.diagram-scroll img { display: block; width: 100%; height: auto; min-width: 720px; }
.shared-architecture figcaption { font-size: .91rem; line-height: 1.65; color: #5d5668; padding: 12px 2px; }
.appendix-qa-list { margin: 0; padding: 16px 22px 20px; }
.appendix-qa-list dt { margin-top: 1em; font-weight: 650; }
.appendix-qa-list dt:first-child { margin-top: 0; }
.appendix-qa-list dd { margin: 0.35em 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.appendix-qa-list dd.appendix-diagram-links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.9em; white-space: normal; }
.appendix-diagram-links a { text-decoration: underline; text-underline-offset: 0.15em; }
.module-explanation { border-bottom: 1px solid #ddd6e7; padding: 16px 0; }
.module-explanation > summary { cursor: pointer; font-weight: 650; color: #593887; }
.module-explanation .table-wrap { margin-top: 20px; }
#pipeline .module-explanation table { min-width: 0; table-layout: fixed; }
.module-explanation thead th:nth-child(1) { width: 28%; }
.module-explanation thead th:nth-child(2) { width: 34%; }
.module-explanation thead th:nth-child(3) { width: 38%; }
.module-explanation th[scope="row"] { border-bottom: 1px solid #e2e3e7; padding: 12px 12px 12px 7px; vertical-align: top; overflow-wrap: anywhere; }
#evaluation table { min-width: 950px; }
#evaluation th:nth-child(1) { width: 15%; }
#evaluation th:nth-child(2) { width: 40%; }
#evaluation th:nth-child(3) { width: 25%; }
#evaluation th:nth-child(4) { width: 20%; }
summary:focus-visible, .diagram-scroll:focus-visible { outline: 3px solid #9171b9; outline-offset: 4px; }
#evaluation table { table-layout: fixed; }
#evaluation th:nth-child(1), #evaluation td:nth-child(1) { width: 15%; }
#evaluation th:nth-child(2), #evaluation td:nth-child(2) { width: 38%; }
#evaluation th:nth-child(3), #evaluation td:nth-child(3) { width: 25%; }
#evaluation th:nth-child(4), #evaluation td:nth-child(4) { width: 22%; }
@media (max-width: 800px) {
  .dataset-table, .dataset-table tbody, .dataset-table tr { display: block; width: 100%; max-width: 100%; min-width: 0; }
  .dataset-table thead { display: none; }
  .dataset-table td:nth-child(n) { display: block; width: 100% !important; min-width: 0; padding: 10px 0; }
  .dataset-table td::before { display: block; }
  #pipeline .table-wrap table, #pipeline .table-wrap tbody, #pipeline .table-wrap tr { display: block; width: 100%; min-width: 0; }
  #pipeline .table-wrap thead { display: none; }
  #pipeline .table-wrap tr { padding: 12px 0; border-bottom: 1px solid #ddd6e7; }
  #pipeline .module-explanation tr > * { display: block; width: 100%; border: 0; padding: 8px 12px; }
  #pipeline .module-explanation tr > [data-label]::before { content: attr(data-label); display: block; margin-bottom: 4px; font-weight: 650; color: #593887; }
}

.harness-disclosure { border: 1px solid #dcd5e9; border-radius: 10px; padding: 0 20px; }
.harness-disclosure > summary { cursor: pointer; padding: 18px 0; font-weight: 650; color: #593887; }
.harness-disclosure[open] > summary { border-bottom: 1px solid #e8e2ef; }
.harness-disclosure .harness-table-wrap { margin-top: 20px; }
.harness-supplement { margin-top: 12px; scroll-margin-top: 80px; }
.harness-supplement .settings-list { margin-bottom: 20px; }
#sft-samples > summary { scroll-margin-top: 80px; }
.sft-record-links { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.sft-table-hint { display: none; }
@media (max-width: 600px) { .sft-table-hint { display: inline; } }
#v9-run-record dd { overflow-wrap: anywhere; }
.sft-sample {
  padding: 14px;
  background: #f8f6fb;
  border: 1px solid #e8e2ef;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 0.875rem;
}

.diagram-canvas { position: relative; min-width: 720px; width: 100%; }
.diagram-node-links { position: absolute; inset: 0; }
.diagram-node-links > a { position: absolute; display: block; border-radius: 6px; }
.diagram-node-links > a:is(:hover, :focus-visible, :target) { outline: 3px solid #593887; outline-offset: -2px; background: rgb(121 84 143 / 10%); }
#pipeline tr:is(:target, :focus-visible) > * { background: #f3eafb; }
#pipeline tr:is(:target, :focus-visible) { outline: 2px solid #79548f; outline-offset: -2px; }
.diagram-return { display: block; width: fit-content; margin-top: .6em; font-size: .82em; }
.diagram-hint { text-align: center; color: #593887; }
.dataset-details > .table-wrap { width: auto; margin: 0 20px 14px; }

.page-toc { position: sticky; top: 0; z-index: 15; padding: 0 20px; background: rgb(255 255 255 / 97%); border-bottom: 1px solid #e7e1ed; }
.toc-title { display: none; }
.toc-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; padding: 12px 0; border: 0; background: transparent; color: #593887; font-size: 15px; font-weight: 600; text-align: left; }
.page-toc nav { display: none; max-height: 60vh; overflow-y: auto; padding: 0 0 12px; }
.page-toc nav[data-expanded="true"] { display: block; }
.page-toc ol { margin: 0; padding: 0; list-style: none; }
.page-toc li { margin: 0; }
.page-toc a { display: block; padding: 10px 12px; border-left: 2px solid transparent; color: #645b70; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.page-toc a:hover { background: #f7f4fb; color: #593887; text-decoration: none; }
.page-toc a[aria-current="location"] { color: #593887; background: #f1eaf8; border-left-color: #79548f; font-weight: 600; }
.page-with-toc > section { scroll-margin-top: 64px; }
@media (min-width: 1200px) {
  .page-with-toc { padding-left: 224px; }
  .page-toc { position: fixed; left: 18px; top: 84px; width: 188px; max-height: calc(100vh - 110px); overflow-y: auto; padding: 0; border: 0; background: transparent; }
  .page-toc .toc-title { display: block; margin: 0 0 14px; padding: 0 12px; font-size: 14px; line-height: 1.4; letter-spacing: 0; text-align: left; color: #8a7d99; font-weight: 600; }
  .toc-toggle { display: none; }
  .page-toc nav { display: block; max-height: none; padding: 0; }
  .page-toc a { padding: 9px 12px; font-size: 13px; }
  .page-with-toc > section { scroll-margin-top: 32px; }
}
@media print { .page-toc { display: none; } .page-with-toc { padding-left: 0; } }

.page-with-toc > .lang-switch { z-index: 20; }
.page-with-toc > .cv-link { position: absolute; top: 12px; right: 118px; z-index: 20; padding: 6px 10px; color: #535863; font-size: 14px; line-height: 22px; }
@media (max-width: 1199px) { .toc-toggle { padding-right: 160px; } }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

#evaluation-methods { scroll-margin-top: 72px; }
.evaluation-method-tables { padding: 0 20px 20px; }
.evaluation-method-tables h4 { margin: 22px 0 10px; color: #593887; }
#settings .evaluation-method-tables table { min-width: 0; table-layout: fixed; }
.evaluation-method-tables th:nth-child(1) { width: 22%; }
.evaluation-method-tables th:nth-child(2) { width: 29%; }
@media (max-width: 600px) {
  .evaluation-method-tables :is(table, tbody, tr) { display: block; width: 100%; }
  .evaluation-method-tables thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .evaluation-method-tables tr { padding: 8px 0; border-bottom: 1px solid #e8e2ef; }
  .evaluation-method-tables td { display: block; padding: 5px 0; border: 0; }
  .evaluation-method-tables td::before { display: block; content: attr(data-label); font-weight: 650; color: #593887; }
}

.dapo-reward > summary { scroll-margin-top: 72px; }
.reward-content { padding: 2px 20px 20px; }
.reward-content p { line-height: 1.85; margin: 16px 0; }
.reward-content h3 { margin-top: 26px; }
.reward-content .table-wrap { margin: 18px 0; }
.reward-content table { min-width: 720px; }
.reward-formula { padding: 14px; background: #f5f0fa; border-left: 3px solid #9171b9; font-weight: 600; overflow-wrap: anywhere; }
.reward-content .reward-sources { margin-top: -8px; }
.reward-content .reward-dimensions { min-width: 940px; }
.reward-dimensions th:first-child { width: 15%; }
.reward-dimensions th:nth-child(2) { width: 26%; }
.reward-dimensions th:nth-child(3) { width: 25%; }
.reward-dimensions th:nth-child(4) { width: 34%; }
@media (max-width: 800px) {
  .reward-content .reward-dimensions, .reward-dimensions tbody, .reward-dimensions tr { display: block; width: 100%; min-width: 0; }
  .reward-dimensions thead { display: none; }
  .reward-dimensions tr { padding: 12px 0; border-bottom: 1px solid #ddd6e7; }
  .reward-dimensions td:nth-child(n) { display: block; width: 100%; border: 0; padding: 8px 0; }
  .reward-dimensions td::before { content: attr(data-label); display: block; margin-bottom: 4px; font-weight: 650; color: #593887; }
}

"problemAndPriorWork":"金融智能体使用 Skill（可复用的操作说明）查找资料、计算数值并提交可核验的答案。一次财报问答试跑中，模型算出了正确金额，作答因在规定格式的答案前多写说明而未通过评分。SkillOps 维护 Skill 库，SkillOpt 用留出题筛选 Skill 的文本改写","gapAndApproach":"，两项工作都把更新放在外部 Skill 上，本项目进一步研究何时应针对明确规则下反复出现的错误微调模型。我们提出 Agent Learning Flywheel，按错因选择只改 Skill、只微调模型，或先改 Skill 再微调模型。流程用同题的多次作答对照原始资料和 Skill 规则来定位错因，在规则经核验且同类执行错误在不同资料来源的题目上复现时，针对该错误出题并筛选完整示范用于低秩适配（LoRA）监督微调，再用独立留出题比较更新前后的表现，决定是否保留改动。"},"dataHeading":"数据集","dataHeaders":["数据集与来源","原始规模与拆分安排","题目要求","训练／评测的能力"],"coverageLabel":"题目要求与使用限制","datasets":[{"name":"DocFinQA","url":"https://huggingface.co/datasets/kensho/DocFinQA","definition":"读取给定财报，找到数字并计算答案。","coverage":"检查财报段落、accounting definitions、单位与计算参数；normalized exact answer 去除千位逗号与显示用美元/百分号后要求数值相等，不设数值容差；文字忽略大小写与首尾空格。","role":"1. 从财报提取数据\n2. 计算财务数值","size":"1. 官方 7,437 题\n2. 本项目共 3,684 题\n3. 拆分 Train 2,504 题、Valid 258 题、Test 922 题"},{"name":"FinSearchComp · T2 / T3","url":"https://huggingface.co/datasets/ByteSeedXpert/FinSearchComp","definition":"T2查找历史事实；T3从多个时间和来源查资料后计算答案。","coverage":"需要现成搜索、网页读取和必要的金融数据 API。T1要求查询随时间变化的数据，单独处理。公开题目不等于已有完整 trajectory。","role":"1. 检索金融证据\n2. 跨来源和期间核对事实","size":"1. 官方 635 题\n2. 本项目共 342 题\n3. 拆分 Train 277 题、Valid 27 题、Test 38 题"},{"name":"FinDeepResearch","url":"https://huggingface.co/datasets/OpenFinArena/FinDeepResearch","definition":"查找资料、计算指标并按要求写公司研究报告。","coverage":"官方 reference reports 和 rubric（逐项评分规则）已取得，仅供 evaluator 使用；actor 读取报告结构后自行查资料。完整评分流程已用控制案例接通，judge 已通过一组范围有限的控制校准，完整官方评分与真实任务上的质量仍待验证。","role":"1. 检索金融证据\n2. 撰写带引用的公司研究报告","size":"1. 官方 64 题\n2. 本项目共 48 题\n3. 拆分 Train 0 题、Valid 0 题、Test 48 题"},{"name":"DSCodeBench · Relevant Subset","url":"https://github.com/ShuyinOuyang/DSCodeBench","definition":"从 Pandas、NumPy、SciPy、Scikit-learn 题目中选择数据处理、统计和建模代码题。","coverage":"保留 NumPy、Pandas、SciPy、Scikit-learn 题。评分使用官方测试加 CPU comparator 修复：移除未用的神经库依赖，并修复四处未检查比较结果的表达式。新版指标 official_tests_with_cpu_shape_and_mask_v2 先检查数组形状和 mask，再按原规则比较值；实际 Train 控制中正确答案通过200/200，前导维度错误通过0/200。旧指标的通过结论须重验，完整子集尚未重新评分。","role":"1. 编写数据分析代码\n2. 筛选并汇总表格数据","size":"1. 官方 1,000 题\n2. 本项目共 358 题\n3. 拆分 Train 285 题、Valid 33 题、Test 40 题"},{"name":"DABstep · Hard","url":"https://huggingface.co/datasets/adyen/DABstep","definition":"读取支付记录、费率规则和业务文件，完成筛选、表连接、汇总和计算。","coverage":"主要检查数据处理，不是训练预测模型。官方主评测答案不公开；论文中的 2025 年成绩来自其原始实验。","role":"1. 筛选并汇总表格数据\n2. 按支付规则计算费用","size":"1. 官方 450 题\n2. 本项目共 375 题\n3. 拆分 Train 0 题、Valid 0 题、Test 375 题"},{"name":"DSBench · Financial Analysis and Modeling","url":"https://github.com/LiqiangJing/DSBench","definition":"读取工作簿完成分析，或清理表格、建立特征、训练 classifier / regressor 并输出预测。","coverage":"建模题使用各题官方 metric 和 RPG。RPG 衡量相对官方 baseline 的提升比例。任务优先使用 CPU。","role":"1. 分析工作簿数据\n2. 建立分类和回归模型","size":"1. 官方 540 题\n2. 本项目共 373 题\n3. 拆分 Train 343 题、Valid 0 题、Test 30 题"},{"name":"IFEval","url":"https://huggingface.co/datasets/google/IFEval","definition":"检查回答是否满足指定格式、长度、关键词等要求。","coverage":"只用于检查通用 instruction following 是否下降，不用于判断金融答案是否正确。","role":"1. 遵循明确的答复要求","size":"1. 官方 541 题\n2. 本项目共 494 题\n3. 拆分 Train 0 题、Valid 223 题、Test 271 题"}],"candidatesHeading":"对比方案","settingsHeading":"设置","candidateHeaders":["方法名称","方法内容"],"candidates":[["先 A 后 B（A → B）","先用 A 类题的示范微调，再用 B 类题的示范接着微调。"],["只更新 Skill（Skill Only）","每轮只更新 Skill，模型使用初始权重。"]],"settingsGroups":[{"id":"0","title":"模型与运行环境","items":[["Base model","两种备选底座为 Qwen3.8-Flash-Next（官方 FP8 checkpoint）和 Qwen3.8-27B（BF16 checkpoint）。FP8 和 BF16 是权重存储使用的浮点格式。三种 training recipe 在同一对照中使用同一底座版本。启用所选底座前，核验其推理与训练配置。"],["作答模型与出题模型","首轮由 Qwen3.8-27B（BF16）通过 Claude Code 2.1.322 作答，使用 task-completion Skill 和原始底座。以后各轮使用轮初保留的模型和 Skill。Opus 5.5（high）负责财报和工作簿出题，参与核对作答证据。代码题按原任务构造，并用可执行测试检查。需要模型评分的验证题由固定的本地 Qwen 底座打分。"],["Claude Code","全程使用同一版本、工具、权限、model alias 和 session 设置，记为 H₀。资料文件按题目保存版本。实验脚本只启动、重置和记录题目；模型仍通过 Claude Code 原有功能调用工具。"],["Model serving","按所选底座核验 Claude Code 的工具调用、工具返回和推理配置。thinking开启、Qwen effort=xhigh；temperature=1、top_p=0.95、top_k=20、min_p=0。普通题32 turns、64 tool calls、900秒、单次8K及整题32K输出；报告64 turns、3600秒、64K总输出。子agent同模型、最多2个且深度1，合计消耗计入预算。"]]},{"id":"1","title":"评测方法","headers":["名称","作用对象","方法"],"tables":[{"title":"程序评测","rows":[["来源隔离","训练、验证和测试中的题目及资料","按来源组比对各数据划分，检查同一份资料及其派生题是否跨划分出现。"],["财务数值判分","DocFinQA 的数值答案","统一数值写法后，将模型答案与参考答案或明确接受的答案变体比对。"],["合成题参考答案验算","可以独立复算的合成财务题","用原始资料独立复算数值和单位，再与生成的参考答案比对。"],["代码题验题","合成代码题的起始代码、参考解和独立实现","模型作答前，程序确认参考解和独立实现通过全部测试，且起始代码至少在一个目标用例上失败、通过其余原有行为的测试。"],["指令遵循","IFEval 回答中的格式、长度和关键词要求","用 IFEval 官方严格评分器逐项检查，全部指令满足才算该题通过。"],["代码正确性","模型为 DSCodeBench 提交的函数","用官方用例运行提交的函数，对照预期结果检查适用的输出形状、掩码和数值。"],["合成代码题评分","Qwen 为合成代码题提交的函数","程序检查提交格式、函数名和参数，再运行该题生成的测试，目标行为和其余原有行为的测试全部通过才算答对。"],["工具与执行记录","合成示范的工具调用、返回和执行日志","按调用编号逐条匹配工具调用与返回，并确认日志从首条模型请求一直记录到最终作答。"]]},{"title":"LLM as a Judge","rows":[["错误诊断（待完整验收）","诊断阶段（C1–C5）的参考答案、评分规则、Skill 和作答记录","程序无法确定错因时，Opus 5.5（high）在 Claude Code 中核对原始资料和作答记录，判断参考答案、评分、Skill 或模型执行哪里有问题。"],["新版 Skill 核验（待完整验收）","新建或修改的 Skill 及受影响的题目","两次独立的 Opus 审查对照原始资料和做题记录，检查新规则是否正确并能覆盖已发现的问题。"],["训练示范评审（待完整验收）","有教师提示或无教师提示生成的完整轨迹","Opus 核对每条轨迹的事实、证据和执行步骤，多条通过时选出证据最充分、过程最清楚的一条。"],["检索与工作簿分析评分","FinSearchComp 和 DSBench 分析题的回答","固定的评分模型按各数据集的官方评分提示和参考答案判断回答是否正确。"],["研究报告评分（待校准）","FinDeepResearch 的公司研究报告","由独立校准后的固定评分模型按官方细则逐项核对报告中的事实、计算和证据。"]]},{"title":"人工抽查","rows":[["独立异步抽查","已有明确自动判定的训练题诊断、Skill 候选和合成轨迹","程序按 5% 概率抽取完整审查记录，人工在主流程继续运行时先根据原始资料和执行记录独立判断，再对照自动结论。"],["发现漏判","抽查发现的错误及可能受影响的记录和版本","人工可以暂停流程，同时隔离受影响的 Skill、数据和模型，修复并重新验收后再恢复。"]]}]},{"id":"2","title":"训练设置","items":[["LoRA SFT","所选底座的权重 W₀ 保持冻结。每组模型为 W₀ 加本组 LoRA adapter 的有效增量 Δ_g,t，初始 Δ_g,0=0，从本组上次采用的 adapter 继续。允许同轮先核验新版 Skill，再固定该版本生成数据并做 LoRA SFT；审查 Skill 时不更新权重，训练时不继续改 Skill。"],["Supervised token budget","Mixed 和 A → B 使用同一批训练记录，每段使用次数相同，因此计入损失的 token 总数一致。B-only 匹配两者的监督 token 预算，差额控制在一段完整训练记录的 token 数以内，并报告实际差额。输入 token、重复次数、步数和 GPU-hours 分开记录。"],["Data order","D_A 是题面已给齐资料的新增示范，D_B 是需要模型先找资料的新增示范。 离线生成唯一消费顺序：Mixed打乱新增A/B，A→B先A后B，支持window位置相同；trainer关闭两层shuffle和按长度分组，保存每step sample IDs。Mixed 和 A → B 每读 8 段新记录，加入 1 段起始示范和 1 段此前验收的记录（replay）。当前 Skill 下没有合格 replay 时，改用 2 段起始示范。"],["Optimizer and learning rate","AdamW，learning rate=1e-4、betas=0.9/0.95、weight decay=0、clip norm=1；cosine schedule、warmup 3%。每轮重建optimizer，A/B交界保留其状态与进度。训练前完整schedule必须不超过4,194,304 supervised tokens和512steps；24小时未完成不得参与保留比较。"],["早期 Flash-Next 试跑设置","原 Flash-Next BF16 验收协议使用 rank=8、alpha=32、dropout=0及attention projections in_proj/out_proj/linear_qkv/linear_proj，使用TP4/PP1/EP1/ETP4、micro-batch=1、gradient accumulation=8、activation checkpointing且不packing。16K 协议规定完整训练窗口上限为 16,384 token；先核4K连通性，再核真实16K更新、基座冻结、完整状态恢复、导出和新adapter回载。不改变单次8K输出上限。两种候选底座都需分别验证训练与回载。现有记录只覆盖其对应的模型和配置。"],["备选 RL · DAPO","DAPO 根据同题多条真实执行的相对 Reward 更新当前 actor，作为后续独立 RL 方案。当前 Mixed 研究和计划中的 B-only、A → B 对照采用 LoRA SFT。LoRA 与 DAPO 可以组合。金融场景、正确性优先的 Reward、筛组指标及防刷分设计见下方“后续 DAPO”；这些内容尚未实现或运行。"],["新题与作答限额","每轮最多尝试 512 道候选题，目标是两类各 128 道合格题。Qwen 第一次和第二次独立作答使用不同随机种子。用本轮开头保留的模型作答，首轮用原始模型。Opus 的提示和审查都记入本次调用预算。"],["怎样选保留的版本","Valid 主分取三个数据集分数的等权平均，分别是 DocFinQA（258 题）、FinSearchComp（27 题）和 DSCodeBench（33 题）。IFEval（223 题）用来检查指令遵循是否退化。只改 Skill 时，本轮原题要做得更好，其他防退化和受影响能力检查须通过，Valid 主分可以持平。微调权重要求 Valid 主分提高至少 1 个百分点，三个主要数据集各最多降 5 个百分点，IFEval 最多降 2 个百分点。两项一起改时，最终组合还须相对轮初改善本轮原题，并通过 Valid 和受影响能力检查。"],["更新方式的对照条件","计划让各组独立运行，都从同一个初始模型和 Skill 出发。用混合两类题的训练方案（Mixed），各组资源上限相同。只微调组始终使用初始 Skill。"],["合成题型配比","每种题型的权重 = 该题型出现已确认执行错误的独立训练来源数 + 1。同一来源在每种题型里只算一次。「题面给齐资料」和「需要先找资料」用同一套题型配比，各有 128 个合格名额。某题型的初算名额 = 128 × 该题型权重 ÷ 所有题型权重之和。先向下取整，剩余名额按小数部分从大到小补齐，小数相同时按题型名称排序。"],["27B v9 运行记录","协议为 pipeline-v9-27b-adaptive-mixed-three-splits（8453aad0e093），拆分清单为 data-v2（63c24f6aa842），Qwen3.8-27B BF16 权重索引为 770420940766。从原始底座和 task-completion 起跑，训练种子为 42。拆分检查发现 Train、Valid 和 Test 之间重合的来源组为 0。Valid 的代表性，以及此前模型开发是否接触过这些来源，仍待核实。","v9-run-record"],["27B v9 LoRA 计划","首轮计划在 Megatron-SWIFT 中按 Mixed 训练，冻结 BF16 底座。LoRA 只对两个 attention projection 模块 linear_qkv 和 linear_proj 增加可训练参数，rank 为 8、alpha 为 32、dropout 为 0。训练用单卡，TP1／PP1／EP1／ETP1。每个 micro-batch 读一段记录，累计 8 段才更新。每段最多 16,384 个 token，AdamW 学习率为 0.0001，预热 3%。"]]},{"id":"4","title":"计算资源","items":[["Hardware","4张 NVIDIA RTX PRO 6000 Blackwell，每张96GB，标称总 VRAM 384GB。training framework 必须正确完成 model sharding；四卡 training 仍需实际检查。"],["CPU offload","Flash-Next 的 n-gram embedding 是一张存储短词元组合表示的表。其训练可通过 Megatron-SWIFT 的 PLE_CPU_OFFLOAD 将表放到主机内存。公开训练示例使用 Flash-Next BF16。在实际训练与推理配置中分别核验 Flash-Next FP8 的内存占用和 CPU offload 支持。"],["Compute budget","计划最多同时使用 4 张 RTX PRO 6000 Blackwell 96GB。生成示范、训练和评测依次进行。每组独立运行上限是 240 GPU-hours 或 70,000 次作答，整个研究上限是 1,440 GPU-hours。模型调用按授权预算预留费用并记账，达到上限就停止新增调用。"],["Resource scheduling","teacher model 生成数据、LoRA SFT 和 evaluation 依次运行，切换前释放上一项的 model server。四卡上不同时常驻 teacher model、actor 和训练进程。分别记录 training 与 inference 的 peak VRAM、throughput 和 CPU transfer time。"],["Task execution resources","新协议启用task进程的cgroup CPU/RAM硬限制，与模型服务和PLE分开。实际Train参考／工具工作负载已测量并冻结：文本1 CPU core／1GiB，代码与工作簿2 cores／4GiB，任务内建模4 cores／16GiB。IFEval、报告与DABstep按明确任务类别复用对应Train测量，不声称直接测过其保留题。上限至少为代表工作负载峰值的4倍，并使用上述最低值；这些是工程上限，不是完整actor测量或最优值。超限保留真实记录并暂停修复，不归因为模型能力不足。"]]}],"evaluationHeading":"评估指标","evaluationNote":"先重做同一批 Train 题检查已知错误，再在固定的 Valid 题上选版本。配对评测使用同一批题、评分方式、工具、推理种子和作答预算。正式 Test 在同一批测试题上配对比较初始模型加 Skill 与最终保留的 Mixed 版本，按数据集报告训练种子 42 的前后分差。","metricHeaders":["指标","公式与符号解释","公式含义","评估范围"],"metrics":[["Accuracy","Accuracy = (1/N) Σᵢ cᵢ；N 为题数，数据集约定的 scorer 判最终答案正确时 cᵢ=1，否则为0。DABstep test 使用本次官方外部评分。","答对的题占全部题的比例。","DocFinQA、FinSearchComp T2/T3、DABstep Hard、DSBench analysis"],["Code pass rate","Pass rate = (1/N) Σᵢ 𝟙[第 i 题全部测试通过]；N 为代码题数，𝟙[条件] 在条件成立时为1。使用项目修复后的 CPU comparator，并标明工具与重试预算，区别于原生 single-generation Pass@1。","一道代码题通过全部测试，才计为一道通过。","DSCodeBench CPU 相关子集"],["Task metric / RPG","RPG = max(0, (m − b)/(r − b))；m 为该题官方 metric，b 为官方 baseline，r 为官方 reference best，r≠b；分类、回归各用本题规定的 metric，跨题再汇总 RPG。","0 表示没超过基准，1 表示达到参考最佳表现，大于 1 表示超过它。","DSBench 金融建模子集"],["HisRubric score","Hᵣ = Σⱼ round(wᵣⱼ aᵣⱼ / 100, 2) / Fᵣ，H = (1/N) Σᵣ Hᵣ；a 为官方 adjusted_mark（0—100），w 为官方条目权重，round(·,2) 逐项保留两位小数，F 为报告官方满分，N 为报告数。固定 judge、source cutoff 和 N/A 规则。","先算每篇报告拿到了多少比例的满分，再对报告取平均。","FinDeepResearch；fixed-corpus 与 official online 分开报告"],["Strict prompt-level accuracy","Strict accuracy = (1/N) Σᵢ ∏ⱼ aᵢⱼ；N 为 prompt 数，第 i 题第 j 项指令通过 official strict checker 时 aᵢⱼ=1，否则为0。","一道题的每条指令都满足，才算通过。","IFEval"],["这轮检查题的成绩改善","Δ_Train = S_Train(候选组合) − S_Train(本轮起点)。S_Train 是本轮同一批检查题的加权平均：Σ_i w_i·mean_r(s_i,r) / Σ_i w_i；i 为这轮检查题，r 为配对的两次执行，s∈[0,1]沿用冻结评分。先将每个大类权重归一到相同总量，再在该类内让每个来源组权重相同；w 在新输出可见前固定。","分差为正，说明新版在本轮重做的题上做得更好。","Skill-only 比较仅换 Skill 的组合；联合更新比较最终组合。题单、材料条件和评分须前后匹配，模型超时计原规定失败，设施异常先修复不伪记零分。 每个 actor 分别计算；共享 Skill 的最终组合须各组 Δ_Train≥0，且至少一组>0。"]],"referenceNote":"以下来源用于说明已有模型、工具和方法。","references":[{"title":"SkillOps: Managing LLM Agent Skill Libraries as Self-Maintaining Software Ecosystems","url":"https://arxiv.org/abs/2605.13716","description":"Song、Pu 与 Zhao（2026）利用执行记录诊断 Skill 库的缺陷，并维护 Skill、验证器与依赖关系。","id":"skillops"},{"title":"SkillOpt: Executive Strategy for Self-Evolving Agent Skills","url":"https://arxiv.org/abs/2605.23904","description":"Yang 等（2026）在固定的执行模型上，根据作答记录改写单份 Skill，并用留出验证题筛选改写。","id":"skillopt"},{"title":"Qwen3.8-Flash-Next FP8 · Official Model Card","url":"https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8","description":"查 Flash-Next 的官方 FP8 checkpoint 和模型结构。","id":"qwen-model"},{"title":"Qwen3.8-27B (BF16) · Official Model Card","url":"https://huggingface.co/Qwen/Qwen3.8-27B","description":"查 Qwen3.8-27B 的官方 BF16 checkpoint 和推理设置。","id":"qwen-27b"},{"title":"NVIDIA · RTX PRO 6000 Blackwell","url":"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/","description":"查每卡96GB 的硬件规格；pilot 时记录实际卡型和主机连接方式。","id":"nvidia-gpu"},{"title":"Megatron-SWIFT · Qwen3.8-Flash-Next Best Practice","url":"https://swift.readthedocs.io/en/latest/BestPractices/Qwen3_8-Flash-Next-Best-Practice.html","description":"使用已有 BF16 LoRA 和 PLE 放到 CPU 的功能；文档中的八卡成绩不能代替四卡检查。","id":"swift-lora"},{"title":"Axolotl · Qwen 3.8 Flash Next","url":"https://docs.axolotl.ai/docs/models/qwen3.8-flash-next.html","description":"查 Flash-Next 的参数范围和 PLE 表。","id":"axolotl-memory"},{"title":"Claude Code · 非交互运行与结构化输出","url":"https://code.claude.com/docs/en/headless","description":"使用现成命令行执行题目和记录结果，不编写新的 tool call 循环。","id":"claude-code"},{"title":"Claude Code · Skills","url":"https://code.claude.com/docs/en/skills","description":"使用现成 skill 文件和加载方式保存操作说明。","id":"claude-skills"},{"title":"vLLM · Claude Code Integration","url":"https://docs.vllm.ai/en/stable/serving/integrations/claude_code/","description":"使用兼容接口连接本地 Qwen；具体模型、tool call 和 trajectory 仍需实际检查。","id":"vllm-serving"},{"title":"NVIDIA Nemotron 3 Super · Technical Report","url":"https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Super-Technical-Report.pdf","description":"第21页“Financial Reasoning”：按公司与年份扩展题目，绑定对应财报，并筛选候选回答构建训练数据。","id":"nemotron-data"},{"title":"Microsoft Foundry · Synthetic Data Generation","url":"https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation","description":"参考从文档和 OpenAPI 说明生成问答及工具题目的方法；不据此假定该服务支持训练本项目的 Qwen。","id":"foundry-data"},{"title":"Salesforce Koa · Technical Paper (2026)","url":"https://arxiv.org/html/2609.15066","description":"§3说明任务规范、persona/scenario、NeMo Gym及GRPO；可由helper模拟工具，不等于本项目真实工具执行后SFT。","id":"koa-data"},{"title":"Axion 1.0: Open Agent Foundation Models, Simplified (2026)","url":"https://arxiv.org/html/2611.03233v3#S3.SS2","description":"§2.1–2.2 给出两类任务的定义，§3.2 给出分阶段训练设计。A/B 是本项目对两类任务的简称。","id":"axion"},{"title":"Agent-R: Training Language Model Agents to Reflect via Iterative Self-Training (2025)","url":"https://arxiv.org/abs/2501.11425","description":"参考从错误历史学习正确恢复；本项目未实现原文MCTS分支搜索与拼接。","id":"agent-r"},{"title":"Re-ReST: Reflection-Reinforced Self-Training for Language Agents (EMNLP 2024)","url":"https://aclanthology.org/2024.emnlp-main.861/","description":"参考环境反馈检查；本项目不训练原文独立reflector，不称完整复现。","id":"re-rest"},{"title":"ReSTᴱᴹ: Beyond Human Data (2023 / 2024)","url":"https://arxiv.org/abs/2312.06585","description":"借鉴生成、筛选、训练循环；原文每轮从base重训，本项目从各组保留的LoRA继续。","id":"rest-em"},{"title":"DSCodeBench · Controlled coding comparison","url":"https://arxiv.org/html/2505.15621v3","description":"查题目构造和官方 DS-1000 对照。","id":"dscodebench"},{"title":"DABstep · Evaluation protocol","url":"https://arxiv.org/html/2506.23719v1","description":"查 public dev set、隐藏答案和官方评分方法。","id":"dabstep-paper"},{"title":"DABstep · Official leaderboard","url":"https://huggingface.co/spaces/adyen/DABstep","description":"查题库版本、成绩是否经过验证及提交评分要求。","id":"dabstep-leaderboard"},{"title":"DSBench · Source and task manifests","url":"https://github.com/LiqiangJing/DSBench","description":"查金融分析和预测题；regression 题不强制使用线性模型。","id":"dsbench"},{"title":"FinSearchComp · ICLR 2026","url":"https://proceedings.iclr.cc/paper_files/paper/2026/file/4d42358702dff82e1436550a05ade260-Paper-Conference.pdf","description":"查题目、数据时间要求和评分方法；工具 trajectory 是否可用需检查发布文件。","id":"finsearchcomp-paper"},{"title":"FinSearchComp · Implementation","url":"https://github.com/randomtutu/FinSearchComp","description":"区分完整题库和 AkShare 可用子集，确定本项目可访问的资料来源。","id":"finsearchcomp-code"},{"title":"DocFinQA · Original paper","url":"https://aclanthology.org/2024.acl-short.42/","description":"查给定长财报中的数值问答题目。","id":"docfinqa"},{"title":"FinDeepResearch · Original benchmark scale","url":"https://arxiv.org/abs/2510.13936","description":"查64个公司研究题目和15,808个报告检查项的区别。","id":"findeepresearch"},{"title":"DAPO · Original paper","url":"https://arxiv.org/html/2503.14476v2","description":"§3.2–3.4说明 Dynamic Sampling、token-level loss 与超长奖励处理；金融工具任务的生成长度计量和未完成回合规则是本项目备选适配。","id":"dapo-paper"},{"title":"verl · DAPO recipe and implementation FAQ","url":"https://verl.readthedocs.io/en/latest/algo/dapo.html","description":"核对筛组、token-mean 与软长度奖励配置；FAQ说明 Overlong Filtering 并非所有实验都启用。","id":"dapo-implementation"},{"id":"nvflow-select","title":"NVIDIA nvflow · candidate selection","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/prompts/genselect_answers.yaml","description":"固定公开版本：选择提示词；上下文、问题和候选编号。"},{"id":"nvflow-filter","title":"NVIDIA nvflow · completeness filtering","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/prompts/filter_answers.yaml","description":"固定公开版本：完整性判定；实际输入只含回答。"},{"id":"nvflow-clean","title":"NVIDIA nvflow · cleaning code","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/utils/shared/dataset_transformer.py","description":"固定公开版本：字符长度分位数及可选 UUID 去重。"},{"id":"nvflow-prep","title":"NVIDIA nvflow · SFT data preparation","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/stages/sft/config/data_prep.yaml","description":"SFT ReadData 的精确文本去重配置；准备流程按 chunk 运行。"},{"id":"star","title":"STaR: Self-Taught Reasoner Bootstrapping Reasoning With Reasoning","url":"https://arxiv.org/abs/2203.14465","description":"Zelikman et al.，2022；§3.1–3.2、图2与算法1。"},{"id":"nvflow-select-code","title":"NVIDIA nvflow · selection implementation","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/lib/sdg/document_grounded/genselect.py","description":"候选长度过滤及按编号取回原答案与 reasoning。"},{"id":"nvflow-prep-code","title":"NVIDIA nvflow · chunked SFT preparation","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/stages/sft/prepare_for_sft.py","description":"按 chunk 准备 SFT 数据的调用边界。"},{"id":"nemo-read-data","title":"NVIDIA NeMo-Skills · ReadData deduplication","url":"https://github.com/NVIDIA/NeMo-Skills/blob/7d6c49a51efb441b61db3e78f6ffa2f04c9a68ef/nemo_skills/training/data_preparation_utils/preprocessing.py","description":"初版 nvflow 固定依赖中的精确 (problem, generation) 去重。"},{"id":"lora-paper","title":"LoRA: Low-Rank Adaptation of Large Language Models","url":"https://arxiv.org/abs/2106.09685","description":"冻结预训练参数并训练低秩增量；参数更新方法与 SFT／RL 训练目标分开。"},{"id":"verl-rl-lora","title":"verl · LoRA reinforcement learning","url":"https://github.com/verl-project/verl/blob/07490cb5ce1fa1818e0d98540abc9bccd02534ac/docs/advance/ppo_lora.rst","description":"官方 RL LoRA 文档说明二者可以组合，不证明本项目目标模型与四卡配置已合格。"},{"id":"findeep-task-structure","title":"FinDeepResearch · NVIDIA company-analysis task","url":"https://huggingface.co/datasets/OpenFinArena/FinDeepResearch/blob/main/Analytical%20Structure/test001.md","description":"原题明确财报时期、币种、可核算比率和行业／公司分析要求；仅用于核对评测范围。"},{"id":"dapo-group-filter","title":"verl-recipe · DAPO group filtering","url":"https://github.com/verl-project/verl-recipe/blob/acc239fc978bf001e1957b7148b36e69df63cc19/dapo/dapo_ray_trainer.py#L235","description":"公开代码按 prompt uid 汇总指定 metric，只保留组内有差异的组；复合 Reward 须另定筛选指标。"},{"id":"webshop-benchmark","title":"WebShop: Towards Scalable Real-World Web Interaction with Grounded Language Agents","url":"https://papers.neurips.cc/paper_files/paper/2022/hash/82ad13ec01f9fe44c01cb91814fd7b8c-Abstract-Conference.html","description":"模拟购物基准，要求模型根据用户给出的商品条件检索和选购。"}],"footerNote":"Agent Learning Flywheel · 金融 LLM agent 的逐轮改进方案。","attribution":"布局与呈现方式参考","backToTop":"返回顶部","candidateTaskIntro":"A 类题随题给齐解题资料，B 类题需要模型先用工具取回缺失资料再解题。","execution":{

},"dataOverview":"数据涵盖财报问答、历史金融检索、公司研究报告、编程、支付数据处理、工作簿分析、预测建模和指令遵循。","datasetDetailsTitle":"数据集明细","dapoReward":{"title":"后续 DAPO：先保证金融答案可信，再比较质量与成本","status":"这是后续研究设想。DAPO 用训练分数鼓励模型答对并给出可靠证据。主实验用正确示范做监督微调（SFT）。LoRA 决定训练哪些参数，将来也可以用于 DAPO。","scope":"本方案聚焦现有数据能够核验的金融任务：财报问答、历史事实检索、公司分析和有资料支持的行业事实比较。现有数据缺少客户风险偏好、持仓和投资约束，因此不据此声称覆盖个性化资产配置或投资适当性。","scopeHeaders":["金融场景","数据能支持到哪里","Reward 具体判断什么"],"scopeRows":[["客户／深度金融问答","DocFinQA 的财报取数与计算；FinSearchComp T2／T3 的历史事实查找和跨来源调查。仅用已隔离的 Train 来源构造 RL 题。","核对公司、财年、会计口径、币种与单位；独立重算结果；证据必须支持答案，检索资料须满足题目截止日期。"],["个股／公司分析","上述数值与检索子任务可训练；FinDeepResearch 仅评估完整公司报告，其评测公司、参考报告与派生题继续禁止用于训练。报告级 RL 题须另备来源隔离的 Train 公司与评分规则。","先核关键数字和结论依据；再按预先固定的 rubric 检查要求的分析是否完整、前后是否一致、风险与不确定性是否有依据。rubric 是逐项评分要求，不以看多／看空方向或文风打分。"],["产业分析中的事实比较","限定为公司报告支持的行业背景、业务分部和可核算的同口径比较；FinDeepResearch 模板要求描述行业背景，但不等于已有独立的全产业分析训练集。","统一对象、时期和统计口径，区分行业事实与作者推断；仅凭单家公司资料不能作出全行业结论。"],["计算与执行能力作为支撑","DSCodeBench 和 DSBench analysis 支撑表格处理、统计与代码测试；DSBench financial modeling、DABstep 和 IFEval 各守原有使用边界，不因名称或题型而扩展为资产配置数据。","程序核真实计算、测试与工具记录；通用代码／指令成绩不替代金融事实正确性，也不把 DABstep 最终测试题用于 Reward 调参。"]],"rewardTitle":"我们的建议：先核关键正确性，再评质量与成本","rewardIntro":"关键数字算错或结论缺证据时给低分。关键要求满足后，再给完整分析加分，给无效调用和过长输出扣分。程序负责验算、跑测试和核工具记录，Opus 5.5（high）检查资料是否支持结论、分析是否完整。这种评分分工还需校准。","formula":"关键要求不满足：R = −1；全部满足：R = 1 + αQ − βC − γL。","termIntro":"关键要求包括答案与关键计算正确、证据真实且支持结论、任务关键约束满足；报告先要求关键事实和结论有依据，再比较其余分析质量。下列项均归一到 [0, 1]；α ≥ 0，β、γ ≥ 0 且 β + γ < 1，因此合格执行的分数始终高于已确认的关键失败。具体权重与阈值须在独立校准材料上确定，当前未定。","termHeaders":["评分维度","我们怎样设计","为什么这样设计","参考依据与本项目的取舍"],"termRows":[["关键正确性与证据：必要条件","关键答案、计算或支持证据有确认错误，或者必答子问、必需结果缺失时，R = −1，其他加分不能抵消；关键要求清单在采样前固定，全部通过后才计 Q、C、L。","金融分析依赖正确事实；错财年、错单位或缺少支持证据会使关键结论失效，因此应让关键失败的得分始终低于合格执行。","DAPO §2.4 用可验证结果作奖励；DocFinQA 提供财报与答案，部分题含参考程序；FinSearchComp §2.2–2.3 要求时期、口径与来源可核对。把这些组合成不可抵消的金融条件及当前公式，是本项目提出的规则，尚无直接训练实证。"],["Q：合格答案的分析质量","关键项全部通过后，按预先固定的 rubric 比较解释是否充分、补充分析是否覆盖、推断与证据是否一致；必答项遗漏或关键结论无依据直接失败，不只是扣 Q。客观短答案可令 Q = 0。rubric 是逐项评分要求。","相同的正确结论也可能有解释充分程度的差别；Q 鼓励有依据的比较、解释与限制分析，不按篇幅或引用数量给分。","FinDeepResearch §2.3–2.4 分别评价事实识别、计算、概括与解释，并将评分项加总归一；它支持分项评价，不是本项目“先核关键条件、再评 Q”的原版 RL 规则。"],["C：无效工具消耗","用真实日志识别重复且没有新增证据的调用、无关查询等浪费；必要取证不扣分，调用数、耗时和费用另报。","希望减少浪费，同时保留完成任务所需的检索；单纯奖励少调用工具，会鼓励模型省略取证。","本项目基于执行成本提出的设计；目前引用没有直接验证这项惩罚能提高金融解题能力。无效调用判据及惩罚权重须先校准。"],["L：超长生成","超过合理长度后逐渐扣分，只计模型生成的推理、工具参数和回答；工具返回仍占用上下文窗口，并计实际成本。","约束不必要的生成成本，同时避免把长财报或工具返回误算成模型啰嗦；合理取证不应因此受罚。","DAPO §3.4、Eq.13 提供软长度惩罚的依据；分开计算模型生成与工具观察，是本项目的工具任务适配，阈值尚未冻结。"]],"samplingTitle":"用当前模型独立做题，让 Reward 指导本次权重更新","sampling":"我们固定已经核验的 Skill、资料快照、工具和预算，让本次待更新的 actor 无教师提示执行同题多次，再比较各次 Reward。这样得到的才是 on-policy 数据，即当前模型自己产生的执行，能够用于本次策略更新；SFT 的做题示范与 Opus 辅助纠错记录另行保存；如果跨组共享，它们也不是每个接收模型自己的 on-policy 数据，不能改名为独立 RL 执行。","filter":"原 DAPO 数学实验按正确性去掉全对／全错组；公开 recipe 按指定 metric 的组内差异筛选。这里拟对客观题按 verified_success（关键要求全部满足记 1，否则记 0）筛组；筛组不使用含费用／长度项的最终 Reward；报告题只在评分已校准后，按关键要求通过情况及业务质量 Q 的有意义差异筛组，不按费用或长度差异挑组。全错且无可用业务差异时无相对学习信号，应调课程难度或先用已验收示范做 SFT，不无限补采，也不凭过程表现虚构成功。","environmentTitle":"资料时点、真实工具和评价边界保持固定","environment":"环境模拟采用题目截止时点可得的文档／网页快照和可重置工作区；工具实际执行并保留原始返回，私有参考与 judge 评语不进入 actor 输入。同题使用相同资料、预算和工具条件，失败与实际成本全部保留。程序核验能覆盖的项目优先自动判；Opus 负责剩余语义，本节 RL 中，人工对确定评分的每条完整 Train 执行及其评分证据，以 5% 概率独立异步抽查，发现漏判可外部叫停，不逐条等待人工放行。","qualification":"启用前先在隔离的 Reward 校准集上测试错财年、错单位、编造引用、漏答、无故拒答、重复调用与超长输出等反例；冻结评分版本、权重、采样数、补采上限和任务预算，再检查跨卡归一化与真实训练可行性。基础设施中断与模型自身失败分别记账，不默认把所有未完成轨迹的 loss 清零，否则模型可能通过拖到截断逃避失败。新旧权重最终固定同一 Skill，在无教师提示、来源隔离的留出新题上比较各类成绩、关键错误率和成本；Reward 提高本身不是能力迁移证据，不用最终 test 调 Reward。","literature":"这些引用分别支持可验证结果奖励、金融核验项目、分析质量评价和长度处理；具体金融必要条件、Q／C／L 的组合、筛组取舍以及尚未确定的权重，是本项目提出的研究方案。当前没有本项目的 RL 对照实验来证明该组合优于其他方案。当前官方实现未把 Overlong Filtering 设为必选，未完成轨迹的训练处理需单独冻结。","uncertain":"判分材料缺失、工具基础设施故障或 judge 未决时，标记“不可评分”，在原预算内修复并重采整组，仍未决则不用，避免把检查故障变成模型的对错信号；已确认是模型导致的必答子问或必需结果缺失、无故拒答、虚构工具记录或预算耗尽，仍按任务失败处理。","controlReason":"FinSearchComp 的历史题要求核对时期和口径，FinDeepResearch 模板指定报告资料时期，这些来源支持资料时点要求。我们进一步固定 Skill、资料和工具条件，是为了让新旧权重的差异能够归于训练；隔离教师提示、私有参考与 judge 评语，是为了检验模型能否独立解题。资料快照、真实工具环境及 5% 异步人审是本项目的实验控制设计，现有引用没有证明 5% 是最优或足够的比例。"},"harnessIntro":"Qwen 通过 Claude Code 读财报和运行计算。Claude Code 记录模型调用了什么工具、工具返回了什么，方便查错。"},"en":{"titleLead":"Improving","titleRest":" a Financial Question-Answering Model","titleSecond":"Agent Learning Flywheel","affiliation":"ACM Club Practicum Project · UIUC","subtitle":"We study how to make models find the right sources, calculate accurately, and submit answers as requested.","status":"Research Design","navigation":"Project navigation","methodLabel":"Execution steps","modelLabel":"Base model options","referencesLabel":"References","keyTakeawaysHeading":"Key Takeaways","keyTakeaways":[{"title":"Distinguish a faulty Skill from a failure to follow it.","text":"If a Skill tells the model to use year-to-date revenue as quarterly revenue, the model can follow it and still answer incorrectly. If the Skill requires checking the reporting period and the model still picks the wrong column, the error is in execution. The teacher can mistakenly turn a method that applies to one filing into general instructions when writing a Skill."},{"title":"Use execution traces to find what a Skill should teach.","text":"Check the model’s tool calls, tool results, and final answer against the original task and source material to locate the error, then see whether the Skill explains that step. Add the verified procedure when guidance is missing or needs correction. If no existing Skill applies, use the procedure to create one. Verify the new version and rerun the original diagnostic tasks to see which errors persist."},{"title":"Use confirmed errors to design new training questions.","text":"If the model repeats an execution error on questions based on at least two different Train materials while using a verified Skill or a corrected Skill that has passed verification, turn the error into a concrete training target. Pass that target and other material from Train in the teacher’s question-generation prompt to create a new question that tests the same step. A financial-report question can test checking the reporting period before extracting a figure, a coding question can test returning filtered elements’ indices in the original array, and a formatting question can test submitting only JSON. Check that a correct solution passes and that the target error is marked wrong.","dataRationale":"The plan targets 128 accepted questions that supply all necessary material and 128 that require the model to retrieve it with tools first. Allocate each group separately by task type, weighting each type by the number of different Train materials on which the corresponding error occurred, plus one. The two types draw on Axion 1.0’s progression from reasoning with supplied information to retrieving missing information and reasoning with it."},{"title":"Teach the right next step from real executions.","text":"Have the model solve the new questions, verify the answers and execution, and turn accepted attempts into LoRA training examples. Each example retains the task, conversation history, and actual tool results that the model saw at that step. Compute training loss only on the current verified tool call or response. If the model used a teacher hint, remove it during export and verify that the original task, Skill, and actual tool results still support each retained step."},{"title":"Check fixes on the original Train tasks and use Valid to decide whether to keep them.","text":"Rerun the original diagnostic tasks in Train to see whether known errors occur less often. Use Valid to check whether the update works on new tasks and preserves existing capabilities. Each round compares the starting and candidate versions using the same tasks, tools, scoring, and budget, and the final Test uses the same matched setup to compare the initial model with its initial Skill against the final retained Mixed version."}],"abstractHeading":"Abstract","abstract":{"problemAndPriorWork":"Financial agents use reusable operating instructions called Skills to retrieve information, calculate figures and submit verifiable answers. In a financial-report pilot, the model calculated the correct amount, and its answer received no credit because it included extra text before the required structured output. SkillOps and SkillOpt update external Skills by maintaining skill libraries and selecting edits to skill text on held-out tasks, respectively","gapAndApproach":", and we ask when recurring errors under verified rules should trigger model fine-tuning. We propose Agent Learning Flywheel to diagnose failures and choose among Skill revision, model fine-tuning, and Skill revision followed by fine-tuning. The workflow checks repeated attempts on the same task against source material and Skill rules to diagnose failures, synthesizes targeted questions and selects complete demonstrations for supervised fine-tuning with low-rank adaptation (LoRA) when the same execution error recurs across independent sources under verified rules, and uses independent held-out tasks to decide whether to keep each update."},"dataHeading":"Datasets","dataHeaders":["Dataset and source","Original size and split plan","Task requirements","Capabilities trained or evaluated"],"coverageLabel":"Task requirements and limits","datasets":[{"name":"DocFinQA","url":"https://huggingface.co/datasets/kensho/DocFinQA","definition":"Read the supplied financial report, find numbers and calculate an answer.","coverage":"Check passages, accounting definitions, units and calculation arguments. Project-defined normalized exact answers require numerical equality after removing thousands separators and display dollar/percent symbols, with no numerical tolerance; text ignores case and surrounding whitespace.","role":"1. Extract figures from financial reports\n2. Calculate financial figures","size":"1. Official 7,437 tasks\n2. Project total 3,684 tasks\n3. Split Train 2,504 / Valid 258 / Test 922"},{"name":"FinSearchComp · T2 / T3","url":"https://huggingface.co/datasets/ByteSeedXpert/FinSearchComp","definition":"T2 retrieves historical facts; T3 combines time periods and sources before calculating an answer.","coverage":"Needs working search, page reading and relevant financial-data APIs. Treat time-varying T1 separately. Published questions do not themselves provide complete trajectories.","role":"1. Retrieve financial evidence\n2. Cross-check facts across sources and time periods","size":"1. Official 635 tasks\n2. Project total 342 tasks\n3. Split Train 277 / Valid 27 / Test 38"},{"name":"FinDeepResearch","url":"https://huggingface.co/datasets/OpenFinArena/FinDeepResearch","definition":"Find sources, calculate measures and write a company research report in the requested structure.","coverage":"Official reference reports and rubrics, the itemized scoring rules, are evaluator-only. The actor receives the report structure and retrieves evidence itself. A limited control calibration passed; complete official scoring and quality on real tasks still need validation.","role":"1. Retrieve financial evidence\n2. Write company research reports with citations","size":"1. Official 64 tasks\n2. Project total 48 tasks\n3. Split Train 0 / Valid 0 / Test 48"},{"name":"DSCodeBench · Relevant Subset","url":"https://github.com/ShuyinOuyang/DSCodeBench","definition":"Choose data processing, statistics and modeling code tasks using Pandas, NumPy, SciPy and Scikit-learn.","coverage":"Retain NumPy, Pandas, SciPy and Scikit-learn tasks. Score with official tests plus CPU comparator fixes: remove unused neural-library imports and check four previously discarded comparison results. The new official_tests_with_cpu_shape_and_mask_v2 metric checks array shape and mask before the original value comparison. In an actual Train control, the correct answer passed 200/200 cases and an added leading dimension passed 0/200. Old metric passes require revalidation; the full subset has not been rescored.","role":"1. Write data analysis code\n2. Filter and aggregate tabular data","size":"1. Official 1,000 tasks\n2. Project total 358 tasks\n3. Split Train 285 / Valid 33 / Test 40"},{"name":"DABstep · Hard","url":"https://huggingface.co/datasets/adyen/DABstep","definition":"Read payments, fee rules and business files, then filter, join, aggregate and calculate.","coverage":"Primarily data processing rather than predictive-model training. Official main-test answers are hidden. The 2025 scores come from the benchmark paper’s experiments.","role":"1. Filter and aggregate tabular data\n2. Calculate fees from payment rules","size":"1. Official 450 tasks\n2. Project total 375 tasks\n3. Split Train 0 / Valid 0 / Test 375"},{"name":"DSBench · Financial Analysis and Modeling","url":"https://github.com/LiqiangJing/DSBench","definition":"Analyze workbooks, or clean tables, create features, fit classifiers or regressors and output predictions.","coverage":"Use each official task metric and RPG, the improvement relative to the official baseline. Prefer CPU execution.","role":"1. Analyze workbook data\n2. Build classification and regression models","size":"1. Official 540 tasks\n2. Project total 373 tasks\n3. Split Train 343 / Valid 0 / Test 30"},{"name":"IFEval","url":"https://huggingface.co/datasets/google/IFEval","definition":"Check whether responses satisfy specified format, length, keywords and other instructions.","coverage":"Check general instruction-following declines, not financial correctness.","role":"1. Follow explicit response instructions","size":"1. Official 541 tasks\n2. Project total 494 tasks\n3. Split Train 0 / Valid 223 / Test 271"}],"candidatesHeading":"Candidates","settingsHeading":"Settings","candidateHeaders":["Method name","Method description"],"candidates":[["A then B (A → B)","Fine-tune on demonstrations from A, then continue fine-tuning on demonstrations from B."],["Skill Only","Update the Skill each round while keeping the original model weights."]],"settingsGroups":[{"id":"0","title":"Models and runtime","items":[["Base model","The two options are the official Qwen3.8-Flash-Next FP8 checkpoint and the Qwen3.8-27B BF16 checkpoint. FP8 and BF16 are floating-point formats used to store model weights. Use the same base revision across the three training recipes in a comparison. Verify serving and training settings for the selected checkpoint."],["Models for solving and writing questions","In round one, Qwen3.8-27B (BF16) answers with the task-completion Skill and an unmodified base checkpoint in Claude Code 2.1.322. Later rounds use the model and Skill retained at their start. Opus 5.5 (high) writes financial and workbook questions and reviews execution evidence. Coding questions use source-bound task construction and executable checks. The fixed local Qwen base grades validation tasks that need a model judge."],["Claude Code","Keep its version, tools, permissions, model aliases and session configuration fixed as H₀. Save source-file versions per task. Experiment scripts start, reset and record tasks; Claude Code still handles tool calls."],["Model serving","Verify Claude Code tool calls, tool outputs and serving settings for the selected base checkpoint. Enable thinking with Qwen effort=xhigh; temperature=1, top_p=0.95, top_k=20, min_p=0. Ordinary tasks: 32 turns, 64 tool calls, 900 seconds, 8K output per request and 32K per episode. Reports: 64 turns, 3600 seconds and 64K total output. At most two same-model children, depth one; all usage counts against the episode."]]},{"id":"1","title":"Evaluation Methods","headers":["Name","What it evaluates","Method"],"tables":[{"title":"Programmatic Evaluation","rows":[["Source isolation","Tasks and source material in training, validation and test","Compare source groups across splits to detect shared materials or tasks derived from the same source."],["Financial numeric scoring","DocFinQA numeric answers","Normalize numeric formatting and compare the model’s answer with the reference answer or an explicitly accepted variant."],["Synthetic reference verification","Synthetic financial questions with independently checkable answers","Recompute the value and unit from the original material and compare them with the generated reference answer."],["Synthetic coding task verification","The starting code, reference solution and independent implementation for a synthetic task","Before Qwen answers, the program checks that both solutions pass every test and that the starting code fails at least one target test and passes all tests for the remaining behavior."],["Instruction following","Format, length and keyword requirements for IFEval responses","Run IFEval’s official strict scorer and count a task as passed only when every instruction is satisfied."],["Code correctness","Model-submitted functions for DSCodeBench","Run the submitted function on official test cases and compare the applicable output shapes, masks and values with the expected results."],["Synthetic coding task scoring","Functions that Qwen submits for synthetic coding tasks","The program checks the format, function name and arguments, then runs the task's generated tests and requires every test for the target and remaining behavior to pass."],["Tool and execution records","Tool calls, results and logs for synthetic demonstrations","Match each tool call to its result by call ID and check that the logs record every model request through the final response."]]},{"title":"LLM as a Judge","rows":[["Error diagnosis (pending full qualification)","Reference answers, scoring rules, Skills and execution records in the diagnosis stages (C1–C5)","When program checks cannot determine the cause, Opus 5.5 (high) uses Claude Code to compare source material and execution records and identify problems with the reference answer, scoring, Skill or model execution."],["New Skill review (pending full qualification)","New or revised Skills and the affected questions","Two independent Opus reviews compare the rules with source material and task execution records to verify that the rules are correct and cover the observed problems."],["Training demonstration review (pending full qualification)","Complete executions generated with or without teacher hints","Opus checks each candidate’s facts, evidence and execution steps, then selects the clearest well-supported execution when multiple candidates pass."],["Retrieval and workbook analysis scoring","Answers to FinSearchComp and DSBench analysis tasks","A fixed judge uses each dataset’s official scoring prompt and reference answers to check whether the response is correct."],["Research report scoring (pending calibration)","FinDeepResearch company research reports","After independent calibration, a fixed judge applies the official rubric to check the report’s facts, calculations and evidence item by item."]]},{"title":"Human Spot Checks","rows":[["Independent asynchronous audit","Training-task diagnoses, candidate Skills and synthetic executions that have definite automated decisions","The program samples each eligible review unit with 5% probability, and a human uses the source material and logs to form an independent judgment before comparing it with the automated decision."],["Missed error","An error found on review and any affected records or versions","A person can pause the workflow and isolate affected Skills, data and models until they have been corrected and checked again."]]}]},{"id":"2","title":"Training configuration","items":[["LoRA SFT","The selected base weights W₀ remain frozen. Each actor is W₀ plus its LoRA increment Δ_g,t, starting at Δ_g,0=0 and continuing its last adopted adapter. A round may verify a revised Skill, then freeze that version for data generation and LoRA SFT. Reviewing a Skill does not update weights; training does not keep revising the Skill."],["Supervised token budget","Mixed and A→B use the same windows the same number of times, so the totals for tokens contributing to the loss match. B-only matches that supervised-token budget within one complete window and reports the actual difference. Record input tokens, repetitions, steps and GPU-hours separately."],["Data order","D_A means new demonstrations with the information supplied, and D_B means new demonstrations that require finding information. Build the sole consumed order offline: shuffle new A/B for Mixed, put A before B for A→B, and use identical support slots. Disable both trainer shuffles and length grouping; record sample IDs per step. For Mixed and A→B, after eight new windows insert one from the starting set of verified examples and one replay window from a previously admitted execution. Use two from the starting set if no replay qualifies under the current Skill."],["Optimizer and learning rate","AdamW, learning rate=1e-4, betas=0.9/0.95, weight decay=0, clip norm=1; cosine with 3% warmup. Reset once each round, preserving state across A/B. Precompute the complete schedule within 4,194,304 supervised tokens and 512 steps. Incomplete training at 24 hours cannot enter retention evaluation."],["Earlier Flash-Next pilot settings","The previous Flash-Next BF16 qualification protocol uses rank=8, alpha=32, dropout=0, attention projections in_proj/out_proj/linear_qkv/linear_proj, TP4/PP1/EP1/ETP4, micro-batch=1, accumulation=8, activation checkpointing and no packing. The 16K protocol specifies a 16,384-token limit for complete training windows. Check 4K connectivity, then actual 16K updates, frozen base, full-state recovery, export and new-adapter reload. The per-request 8K generation-output cap stays fixed. Qualify training and reload separately for each candidate checkpoint. Existing records apply to the model and configuration they tested."],["Optional RL · DAPO","DAPO would update the current actor from relative Rewards across real same-task executions as a future independent RL option. The running Mixed study and planned B-only and A→B comparisons use LoRA SFT. LoRA can also be used with DAPO. The “Future DAPO” disclosure below defines financial scope, correctness-first Rewards, group metrics and anti-hacking controls; these are not implemented or run."],["Limits for new questions and attempts","Each round allows up to 512 candidate questions and aims for 128 qualified tasks in each group. Qwen uses a different random seed for each of the first two attempts. It runs with the weights retained at the start of the round or the original weights in round one. Opus hints and reviews count toward the call budget."],["How we choose which version to keep","Valid combines DocFinQA (258), FinSearchComp (27) and DSCodeBench (33) by giving each dataset one third of the main score. IFEval (223) checks instruction-following regressions. A Skill-only change must improve the round’s original questions. Its Valid score may tie if regression and affected-capability checks pass. An adapter update requires a main-score gain of at least one percentage point, with a maximum drop of five points on each primary dataset and two on IFEval. A combined update must also improve the same Train questions over the round start and pass the Valid and affected-capability safeguards."],["Controls for comparing what to update","The planned groups run independently from the same model and Skill. They use the Mixed training recipe and the same resource caps. The training-only group uses the initial Skill throughout."],["Quotas for synthesized task types","Each task type’s weight = the number of distinct training sources with a confirmed execution error on a task of that type + 1. Count each source once per type. Questions with the information supplied and questions that require finding it use the same allocation, with 128 accepted slots in each group. Each type’s initial share = 128 × its weight ÷ the sum of all type weights. Round down, then assign the remaining slots to the largest fractional remainders, breaking ties by task type name."],["27B v9 run record","Protocol pipeline-v9-27b-adaptive-mixed-three-splits (8453aad0e093), split manifest data-v2 (63c24f6aa842), Qwen3.8-27B BF16 weight index (770420940766). The run starts from the base checkpoint with task-completion and training seed 42. The split check found zero shared source groups across Train, Valid and Test. Valid representativeness and exposure to these sources during earlier model development remain unverified.","v9-run-record"],["27B v9 LoRA plan","The first-round plan uses Mixed on Megatron-SWIFT with a frozen BF16 base. LoRA adds trainable updates to the attention projections linear_qkv and linear_proj with rank 8, alpha 32 and dropout 0. One training GPU uses TP1 / PP1 / EP1 / ETP1. Each micro-batch contains one window, with eight accumulated before an optimizer step. The full window limit is 16,384 tokens, and the AdamW learning rate is 0.0001 with 3% warmup."]]},{"id":"4","title":"Compute resources","items":[["Hardware","Four NVIDIA RTX PRO 6000 Blackwell cards with 96GB each, nominally 384GB total. The training framework must distribute the model correctly across cards. Actual four-GPU training remains to be checked."],["CPU offload","Flash-Next’s n-gram embedding table stores representations for short token sequences. Megatron-SWIFT can move this table to host memory during training using PLE_CPU_OFFLOAD. The published training example uses Flash-Next BF16. Verify memory use and CPU offload support for Flash-Next FP8 in the actual training and serving configurations."],["Compute budget","The plan allows up to four RTX PRO 6000 Blackwell 96GB GPUs at a time for demonstration generation, training and evaluation in sequence. The limits are 240 GPU-hours or 70,000 task attempts per independent run, and 1,440 GPU-hours for the study. Model calls reserve and record cost against the authorized budget. New calls stop at the cap."],["Resource scheduling","Generate teacher-model data, train LoRA and evaluate tasks sequentially. Release the previous model service before switching. Do not keep teacher model, actors and training process resident together. Measure training and inference memory peaks, speed and CPU transfer time separately."],["Task execution resources","The new protocol enforces task-process cgroup CPU/RAM limits separately from model serving and PLE. Real Train reference/tool workloads were measured and ceilings frozen: text 1 CPU core/1GiB; code and workbooks 2 cores/4GiB; task-local modeling 4 cores/16GiB. IFEval, reports and DABstep explicitly reuse the matching Train workload class; their held-out tasks were not measured. RAM is at least four times the representative peak with these floors. These are engineering ceilings, not complete-actor measurements or optimal values. Preserve over-limit evidence and pause for repair rather than assigning a model-capability failure."]]}],"evaluationHeading":"Evaluation Metrics","evaluationNote":"Retry the same Train questions to check known errors, then select versions on the fixed Valid questions. Paired evaluations share the questions, scoring, tools, inference seeds and execution budgets. The formal Test pairs the initial model and Skill with the final retained Mixed version on the same Test questions. The comparison reports per-dataset differences for training seed 42.","metricHeaders":["Metric","Formula and term explanation","What the formula means","Evaluation scope"],"metrics":[["Accuracy","Accuracy = (1/N) Σᵢ cᵢ. N is the task count; cᵢ=1 when the dataset’s prescribed scorer accepts the final answer, and 0 otherwise. DABstep test uses scores from the system’s official external submission.","The share of questions answered correctly.","DocFinQA, FinSearchComp T2/T3, DABstep Hard, DSBench analysis"],["Code pass rate","Pass rate = (1/N) Σᵢ 𝟙[all tests for task i pass]. N is the code-task count; 𝟙 is 1 when its condition holds. Use the project’s repaired CPU comparator and report tool/retry budgets, separately from native single-generation Pass@1.","A coding task counts as a pass when it passes every test.","DSCodeBench CPU-relevant subset"],["Task metric / RPG","RPG = max(0, (m − b)/(r − b)). m is the task’s official metric, b its official baseline and r its reference best, with r≠b. Use each classification/regression task’s own metric, then aggregate RPG.","Zero means the score does not beat the baseline, one matches the reference best, and above one exceeds it.","DSBench financial modeling subset"],["HisRubric score","Hᵣ = Σⱼ round(wᵣⱼ aᵣⱼ / 100, 2) / Fᵣ; H = (1/N) Σᵣ Hᵣ. a is the official adjusted_mark (0–100), w the item weight, round(·,2) the official per-item two-decimal rounding, F the report’s official full mark and N the report count. Fix judge, source cutoff and N/A rules.","Compute the fraction of available points for each report, then average across reports.","FinDeepResearch; report fixed-corpus and official-online evaluation separately"],["Strict prompt-level accuracy","Strict accuracy = (1/N) Σᵢ ∏ⱼ aᵢⱼ. N is the prompt count; aᵢⱼ=1 if instruction j of prompt i passes the official strict checker, otherwise 0.","A question passes when its answer meets every checked instruction.","IFEval"],["Improvement on the round’s check questions","Δ_Train = S_Train(candidate) − S_Train(round start). S_Train = Σ_i w_i·mean_r(s_i,r) / Σ_i w_i over fixed tasks i, two matched repetitions r, and frozen normalized scores s∈[0,1]. Give each major type equal total weight, then each source group equal weight within that type; freeze w before candidate outputs.","A positive change means the new version scores higher on the questions retried in this round.","Use the Skill-only candidate for Skill-only updates and the final combination for joint updates. Match manifests, source conditions and grading. Model timeouts keep the prescribed failure score; repair infrastructure failures rather than inventing zero scores. Calculate separately for each actor. A shared Skill requires every chosen actor combination to have Δ_Train≥0 and at least one >0."]],"referenceNote":"These sources describe existing models, tools and methods.","references":[{"title":"SkillOps: Managing LLM Agent Skill Libraries as Self-Maintaining Software Ecosystems","url":"https://arxiv.org/abs/2605.13716","description":"Song, Pu and Zhao (2026) use execution traces to diagnose defects and maintain skills, validators and dependencies in the library.","id":"skillops"},{"title":"SkillOpt: Executive Strategy for Self-Evolving Agent Skills","url":"https://arxiv.org/abs/2605.23904","description":"Yang et al. (2026) use execution records from a fixed task model to revise one skill document and select edits on held-out validation tasks.","id":"skillopt"},{"title":"Qwen3.8-Flash-Next FP8 · Official Model Card","url":"https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8","description":"Official Flash-Next FP8 checkpoint and model architecture.","id":"qwen-model"},{"title":"Qwen3.8-27B (BF16) · Official Model Card","url":"https://huggingface.co/Qwen/Qwen3.8-27B","description":"Official Qwen3.8-27B BF16 checkpoint and serving settings.","id":"qwen-27b"},{"title":"NVIDIA · RTX PRO 6000 Blackwell","url":"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/","description":"Check the 96GB card specification; record actual card type and host connections in trial runs.","id":"nvidia-gpu"},{"title":"Megatron-SWIFT · Qwen3.8-Flash-Next Best Practice","url":"https://swift.readthedocs.io/en/latest/BestPractices/Qwen3_8-Flash-Next-Best-Practice.html","description":"Use existing BF16 LoRA and PLE-on-CPU support. Eight-GPU measurements do not establish four-GPU feasibility.","id":"swift-lora"},{"title":"Axolotl · Qwen 3.8 Flash Next","url":"https://docs.axolotl.ai/docs/models/qwen3.8-flash-next.html","description":"Check Flash-Next’s parameter scope and PLE table.","id":"axolotl-memory"},{"title":"Claude Code · Programmatic Execution","url":"https://code.claude.com/docs/en/headless","description":"Use existing command-line task execution and logging without building another tool-call loop.","id":"claude-code"},{"title":"Claude Code · Skills","url":"https://code.claude.com/docs/en/skills","description":"Use existing skill files and loading to supply operating instructions.","id":"claude-skills"},{"title":"vLLM · Claude Code Integration","url":"https://docs.vllm.ai/en/stable/serving/integrations/claude_code/","description":"Connect local Qwen through the compatible interface; actual models, tool calls and records still need checks.","id":"vllm-serving"},{"title":"NVIDIA Nemotron 3 Super · Technical Report","url":"https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Super-Technical-Report.pdf","description":"Page 21, Financial Reasoning: expand questions across companies and fiscal years, bind them to financial filings, and filter candidate answers into training data.","id":"nemotron-data"},{"title":"Microsoft Foundry · Synthetic Data Generation","url":"https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation","description":"Reference document QA and OpenAPI tool-task generation, without assuming this service trains the project’s Qwen.","id":"foundry-data"},{"title":"Salesforce Koa · Technical Paper (2026)","url":"https://arxiv.org/html/2609.15066","description":"Section 3 describes task specifications, personas, NeMo Gym and GRPO, including helper-emulated tools; it is not this project’s real-tool filtered SFT pipeline.","id":"koa-data"},{"title":"Axion 1.0: Open Agent Foundation Models, Simplified (2026)","url":"https://arxiv.org/html/2611.03233v3#S3.SS2","description":"Sections 2.1–2.2 define the two task families; Section 3.2 describes staged training. A/B are this project’s labels.","id":"axion"},{"title":"Agent-R: Training Language Model Agents to Reflect via Iterative Self-Training (2025)","url":"https://arxiv.org/abs/2501.11425","description":"Borrow verified recovery from error histories; this project does not implement its MCTS branch search and splicing.","id":"agent-r"},{"title":"Re-ReST: Reflection-Reinforced Self-Training for Language Agents (EMNLP 2024)","url":"https://aclanthology.org/2024.emnlp-main.861/","description":"Borrow environment-feedback verification, without training the original separate reflector or claiming full reproduction.","id":"re-rest"},{"title":"ReSTᴱᴹ: Beyond Human Data (2023 / 2024)","url":"https://arxiv.org/abs/2312.06585","description":"Borrow generate/filter/train cycles. The original retrains the base each iteration; this project continues each retained LoRA.","id":"rest-em"},{"title":"DSCodeBench · Controlled coding comparison","url":"https://arxiv.org/html/2505.15621v3","description":"Check task construction and the benchmark’s DS-1000 comparisons.","id":"dscodebench"},{"title":"DABstep · Evaluation protocol","url":"https://arxiv.org/html/2506.23719v1","description":"Check public developer tasks, hidden answers and official scoring.","id":"dabstep-paper"},{"title":"DABstep · Official leaderboard","url":"https://huggingface.co/spaces/adyen/DABstep","description":"Check dataset version, validation status and submission requirements.","id":"dabstep-leaderboard"},{"title":"DSBench · Source and task manifests","url":"https://github.com/LiqiangJing/DSBench","description":"Check financial analysis and prediction tasks; numerical regression does not mandate a linear model.","id":"dsbench"},{"title":"FinSearchComp · ICLR 2026","url":"https://proceedings.iclr.cc/paper_files/paper/2026/file/4d42358702dff82e1436550a05ade260-Paper-Conference.pdf","description":"Check tasks, data-time requirements and scoring; inspect released trajectory files.","id":"finsearchcomp-paper"},{"title":"FinSearchComp · Implementation","url":"https://github.com/randomtutu/FinSearchComp","description":"Distinguish the full task bank from AkShare-compatible tasks and available sources.","id":"finsearchcomp-code"},{"title":"DocFinQA · Original paper","url":"https://aclanthology.org/2024.acl-short.42/","description":"Check numerical questions over supplied long financial reports.","id":"docfinqa"},{"title":"FinDeepResearch · Original benchmark scale","url":"https://arxiv.org/abs/2510.13936","description":"Distinguish 64 company tasks from 15,808 report checks.","id":"findeepresearch"},{"title":"DAPO · Original paper","url":"https://arxiv.org/html/2503.14476v2","description":"Sections 3.2–3.4 describe Dynamic Sampling, token-level loss and overlong rewards. Generated-length accounting and unfinished-episode rules for financial tools are proposed adaptations.","id":"dapo-paper"},{"title":"verl · DAPO recipe and implementation FAQ","url":"https://verl.readthedocs.io/en/latest/algo/dapo.html","description":"Check group filtering, token-mean loss and soft length shaping. The FAQ notes that Overlong Filtering is not enabled in every experiment.","id":"dapo-implementation"},{"id":"nvflow-select","title":"NVIDIA nvflow · candidate selection","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/prompts/genselect_answers.yaml","description":"Pinned public version: selection prompt with context, task and numbered candidates."},{"id":"nvflow-filter","title":"NVIDIA nvflow · completeness filtering","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/prompts/filter_answers.yaml","description":"Pinned public version: completeness classification with answer-only input."},{"id":"nvflow-clean","title":"NVIDIA nvflow · cleaning code","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/utils/shared/dataset_transformer.py","description":"Pinned public version: character-length quantiles and optional UUID deduplication."},{"id":"nvflow-prep","title":"NVIDIA nvflow · SFT data preparation","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/stages/sft/config/data_prep.yaml","description":"Exact-text deduplication configuration for SFT ReadData; preparation operates per chunk."},{"id":"star","title":"STaR: Self-Taught Reasoner Bootstrapping Reasoning With Reasoning","url":"https://arxiv.org/abs/2203.14465","description":"Zelikman et al., 2022; §§3.1–3.2, Figure 2 and Algorithm 1."},{"id":"nvflow-select-code","title":"NVIDIA nvflow · selection implementation","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/lib/sdg/document_grounded/genselect.py","description":"Candidate length exclusion and original answer/reasoning retrieval by index."},{"id":"nvflow-prep-code","title":"NVIDIA nvflow · chunked SFT preparation","url":"https://github.com/NVIDIA/nvflow/blob/2fa3c5b9213fd6a82318475b96593e98dcb4b0d5/nvflow/recipes/finance/stages/sft/prepare_for_sft.py","description":"Per-chunk SFT data-preparation boundary."},{"id":"nemo-read-data","title":"NVIDIA NeMo-Skills · ReadData deduplication","url":"https://github.com/NVIDIA/NeMo-Skills/blob/7d6c49a51efb441b61db3e78f6ffa2f04c9a68ef/nemo_skills/training/data_preparation_utils/preprocessing.py","description":"Exact (problem, generation) deduplication in the dependency pinned by initial nvflow."},{"id":"lora-paper","title":"LoRA: Low-Rank Adaptation of Large Language Models","url":"https://arxiv.org/abs/2106.09685","description":"Freeze pretrained weights and train low-rank updates; parameterization is distinct from the SFT / RL objective."},{"id":"verl-rl-lora","title":"verl · LoRA reinforcement learning","url":"https://github.com/verl-project/verl/blob/07490cb5ce1fa1818e0d98540abc9bccd02534ac/docs/advance/ppo_lora.rst","description":"Official RL LoRA documentation establishes compatibility, not qualification of this project’s model and four-GPU setup."},{"id":"findeep-task-structure","title":"FinDeepResearch · NVIDIA company-analysis task","url":"https://huggingface.co/datasets/OpenFinArena/FinDeepResearch/blob/main/Analytical%20Structure/test001.md","description":"The original task specifies filing periods, currency, calculable ratios and industry / company analysis; cited for evaluation scope only."},{"id":"dapo-group-filter","title":"verl-recipe · DAPO group filtering","url":"https://github.com/verl-project/verl-recipe/blob/acc239fc978bf001e1957b7148b36e69df63cc19/dapo/dapo_ray_trainer.py#L235","description":"Public code groups a configured metric by prompt uid and retains variation; a composite Reward needs an explicit filtering metric."},{"id":"webshop-benchmark","title":"WebShop: Towards Scalable Real-World Web Interaction with Grounded Language Agents","url":"https://papers.neurips.cc/paper_files/paper/2022/hash/82ad13ec01f9fe44c01cb91814fd7b8c-Abstract-Conference.html","description":"Simulated shopping benchmark in which agents search for and select products using the user's requirements."}],"footerNote":"Agent Learning Flywheel · A design for improving financial LLM agents round by round.","attribution":"Layout and presentation adapted from","backToTop":"Back to top","candidateTaskIntro":"A questions provide all the material needed to solve them, while B questions require the model to retrieve missing material with tools before solving them.","execution":{
  "intro": "Qwen answers questions, and Opus reviews errors the program cannot resolve. A Skill is written guidance for Qwen. LoRA fine-tunes Qwen on verified examples by updating a small set of added weights.",
  "status": "The figures show the proposed loop. The recorded 27B Mixed v9 run reached round-one screening of training demonstrations.",
  "alt": "One round starts with two Qwen attempts per question. Both correct: check the reference and scorer, then finish. One correct: check execution. Both wrong: check the reference and scorer before checking execution. Repair faulty rules, use LoRA for recurring errors under verified rules, or do both in that order. Keep changes that pass the evaluation.",
  "caption": "Figure A. One round of diagnosis and updates. Blue checks the answers and the conditions for an update. Green changes or evaluates the Skill and the model. Purple leads to LoRA training.",
  "jumpHint": "Select a box to read the matching explanation.",
  "detailAlt": "Validate new questions about the target error. After two unhinted attempts, keep a verified pass when the other attempt shows the target error, or give a hint when both show it. Set other outcomes aside. Check selected attempts on either path, then use verified replies to build training samples with real tool feedback as input. After fine-tuning, return to Figure A to compare the candidate.",
  "detailCaption": "Figure B. Produce LoRA training samples for a recurring error.",
  "trainingSampleStep": "Build the LoRA training samples",
  "trainingExample": "For a question limited to filings disclosed by March 1, the input keeps a search result that returned an April filing and the target is the next verified reply that searches again with the original cutoff.",
  "trainingEvidence": "See a recorded tool-error correction.",
  "synthesisSource": "For general support questions, Flywheel draws on NVIDIA’s approach to selecting among candidates, checking completeness and cleaning training data.",
  "literature": [
    {
      "at": "execution-star",
      "text": "The practice of collecting some demonstrations with a hint and removing the hint from training inputs is inspired by STaR."
    },
    {
      "at": "execution-lora-webshop",
      "text": "The example of carrying a user’s requirement through tool feedback draws on work with the WebShop benchmark."
    }

  "steps": [
    [
      "review-triage",
      "Qwen answers each of the round’s 32 check questions twice, and the program routes each question by its two recorded scores.",
      "Four Train datasets and the Qwen weights and Skill retained at round start.",
      "Both correct: finish after C1 and C2 pass. One correct: start at C3. Both wrong: run C1 and C2 before C3. If the reference or scorer changes, score the attempts again."
    ],
    [
      "review-c1",
      "C1 Check that the question and reference answer agree with the source and an independent calculation.",
      "Question, reference answer and original materials.",
      "A verified reference answer or a correction to make before rescoring."
    ],
    [
      "review-c2",
      "C2 Test the scorer with answers that should pass and fail.",
      "Verified reference, scoring rules and test answers.",
      "A verified scorer or a correction to make before rescoring."
    ],
    [
      "review-c3",
      "C3 Check whether Qwen performed the required reads, searches, calculations or tests correctly.",
      "Task requirements and recorded steps.",
      "Evidence of correct, incorrect or skipped work."
    ],
    [
      "review-c4",
      "C4 Check how Qwen called each tool and used its real return when the task required tools.",
      "Tool requirements, actual calls, results and Qwen replies.",
      "Evidence of a tool-use mistake, tool failure or inaccessible source."
    ],
    [
      "review-c5",
      "C5 Opus checks whether the Skill supplied a correct rule for the task and whether Qwen followed it.",
      "Task requirements, the Skill Qwen received, Qwen’s execution and the C3 and C4 findings that apply.",
      "A missing, unclear or wrong rule, a failure to follow a verified rule, or insufficient evidence."
    ],
    [
      "review-f01",
      "F01 Fix a confirmed rule defect. Train with LoRA when the same error recurs under verified instructions.",
      "Evidence from the same Qwen model on at least two independent Train sources. Questions from one financial filing count as one source.",
      "A rule to fix or a specific error to train on. Without enough evidence, the target stays unresolved."
    ],
    [
      "review-skill-write",
      "Opus revises an existing rule using the task and execution evidence, or writes a new Skill for a missing procedure when no Skill covers it. Two independent Opus reviews verify the changed rules.",
      "C5 evidence and the existing Skill, if any. A successful attempt can establish the procedure in a mixed pair. When both attempts fail, C1 and C2 must pass and the source and execution evidence must establish a defect in an existing rule or a missing reusable procedure.",
      "A verified new or revised Skill to test. If verification fails, keep using the current Skill."
    ],
    [
      "review-skill-rerun",
      "Qwen reruns the same check questions with the verified Skill and the round-start weights.",
      "The same 32 questions, including previously correct ones, and the earlier attempts.",
      "Freeze the revised Skill for LoRA if the new diagnosis finds no remaining rule defect and the execution error still recurs across at least two independent source groups. Pause when material evidence is incomplete. Otherwise evaluate the Skill update alone."
    ],
    [
      "review-f02",
      "F02 Construct a question for a confirmed execution error using a Train source group different from the one used in the check question that exposed the error. Use CLIProxyAPI to ask Opus for financial arithmetic, table or source lookup specifications. For code, Opus specifies the source and type. The program uses the sealed specification and tests or builds a testable indexing exercise. Recompute or run tests so the reference passes and the target counterexample fails.",
      "A specific error from F01 or the Skill rerun, and independent source material.",
      "A verified practice question with sources and tools for Qwen. The reference answer, tests and wrong example stay with the scorer."
    ],
    [
      "review-f03",
      "F03 Qwen answers the new question twice without per-question hints.",
      "The verified task and Skill. Use the initial Qwen weights in round one and the weights retained from the previous round afterward.",
      "Two independent trajectories, each recording Qwen’s replies and actual tool results."
    ],
    [
      "review-f04",
      "F04 Check which attempts repeated the target error. Use execution evidence to confirm the cause if the wrong answers only match in their result.",
      "Two unhinted attempts, the verified reference and the failing example.",
      "One passes and one repeats the error: keep the pass. Both repeat it: ask for a hint. Both pass or another outcome occurs: set the question aside."
    ],
