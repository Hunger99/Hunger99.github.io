ations do not erase rule evidence. Only adopted-combination changes count as retained updates; preserve other stop/pause conditions."]],"notes":["Verify findings once: bind C1–C5 automatic findings to exact Skill/task/execution versions, scope, sources and review configuration; recheck changed objects/new concerns and do not redraw the same audit unit. Real actor errors are probe outcomes supporting training, not failed Skill rules. Real tool use, source separation and complete training windows remain mandatory. Automatic pass plus pending audit may proceed; unknown cannot be fabricated as pass, zero-score failure or no problem.","Held-out use: freeze major categories, source-group isolation and absolute counts against a target task distribution, rather than each round’s adaptive generation mix. Better fixed-Train performance plus nondecreasing representative held-out scores can support Skill adoption; this is not statistical proof of no regression. Retain category results and paired uncertainty reporting. Missing or sparse categories are a coverage limitation, not direct evidence that a flat-scoring Skill is ineffective.","Quota allocation: count remaining execution errors under the verified Skill that will be used for this round’s synthesis. Use financial arithmetic, table operations, source alignment and testable code. Add one to each class’s number of distinct Train source groups, allocate 128 positions by largest remainder, and use the same quotas for A and B. Take integer floors, distribute the remaining positions by descending remainder, and break ties by class name. Do not count errors already repaired by the new Skill as remaining gaps. Freeze before generation."],"jumpHint":"Click a diagram box to read its matching row; C1 and C2 are separate links.","backToDiagram":"Back to the diagram","reviewPolicy":"Programs and Opus advance the loop automatically: Program handles reliable checks; CLIProxyAPI Opus 5.5/high with Claude Code judges whether Skill rules are faulty and whether execution errors persist. Humans audit independently outside the flow. Valid automatic findings do not wait because an audit was sampled or is pending. Automatically recheck Opus uncertainty; leave an unconfirmed object unused and continue other confirmed work. A human can pause the loop externally after finding a missed problem.","humanReview":{"title":"Humans audit asynchronously and stop the loop externally after finding a missed problem","items":["No sign-off wait: valid program/Opus findings may support diagnosis, synthesis, training and version comparison. Random selection and unfinished human reviews are not blocking conditions.","Sampling: draw definite Train-side findings with 5% probability per complete review unit—two diagnostic attempts together, one Skill candidate, or one synthetic execution. Freeze seed/IDs, retain selection across revisions and require no per-stratum minimum. Separately queue Opus uncertainty for asynchronous review. For 256 definite accepted synthetic records, the random component averages about 13 reviews; other objects are additional.","Evidence: provide the Skill diff, original/calculation evidence, up to two representative Train records, full-original links and Program/Opus findings. A human records an initial judgment before comparing Opus reasoning, looking for missed rule defects or execution errors.","Intervention: a human can request an external pause without renewed Opus agreement. Pause new work and isolate affected Skill, data and model versions; repair/revalidate, then explicitly resume externally. A problem may be discovered after data admission or training; retain history and actual consumed resources.","Unknown is not pass: automatically recheck within existing attempt/budget limits. Leave an unconfirmed object unused and continue other confirmed work. If a round lacks sufficient automatic evidence, record incomplete rather than no problem/convergence; do not park the round waiting for the human queue. Feed any later human-supplied evidence back to the relevant automatic checkpoint."]}},"dataSplitNote":"The table reports actual data-v2 counts; the held-out coverage plan below is not a completed new split. The actor executes tasks; the teacher solves tasks to produce training demonstrations. Split counts follow Train / diagnostic validation / selection validation / test: respectively diagnosis and training-task generation, pilot checks and error-category counts, version selection, and final evaluation. A source group contains a report, workbook or task and its derivatives; groups stay disjoint across splits. Each row states how official splits are retained or replaced.","dataCoverage":{"title":"Held-out coverage: current gaps and the replacement plan","intro":"Current selection mostly uses source-group hash splits, without per-task stratification for the four synthesis capabilities. This audits existing data-v2 metadata, not model performance or a qualified replacement set. Freeze official-subset/major-capability coverage, proportions and independent sources before Skill revision and training.","headers":["Evaluation scope","Current actor selection","Observed coverage gap","Replacement plan"],"rows":[["DocFinQA · Report QA","258 tasks / 40 source groups","No per-task mapping to the four capability classes; totals do not establish coverage of every question type.","Audit preset capability labels, then freeze class counts and source separation."],["FinSearchComp · T2/T3","17 T2 and 10 T3 tasks / 27 groups","Complex–Global has only three tasks; existing allocation guarantees no type minimum.","Check official subsets and capabilities, not only the total."],["DSCodeBench · Four libraries","numpy 8, pandas 6, scipy 13, sklearn 6 / 33 groups","Library presence does not establish enough independent examples of every operation.","Retain library tags and audit capability-level source counts."],["DSBench analysis · Tables","16 tasks / two workbook groups","Multiple questions in one workbook do not add independent sources.","Add independent workbooks or restrict the evaluation claim."],["DSBench modeling","One regression task / one competition","Both Train tasks are classification, so current selection cannot directly validate a classification Skill revision.","Add independent competitions or narrow the scope; reshuffling a few tasks is not sufficient data."],["FinDeepResearch · Markets","Seven tasks / seven markets","Australia’s only selection task is teacher-reserved; actor coverage omits it. The report judge still needs qualification.","Preserve the reserve, add independent sources and qualify grading."],["DABstep","No selection pool","The 375 Hard tasks are final test, not a pool for choosing Skills.","Find separate acceptance sources or report this scope only at final test."],["IFEval · Instructions","223 tasks / 223 group IDs","Actor-specific instruction-family counts still need auditing.","Complete role-specific family coverage for regression checks."]],"note":"Report task and source-group counts; group IDs do not certify semantic-template independence. Freeze absolute class counts using pilot variability and the change to be measured; stratification cannot create data. Match a fixed target distribution, not each adaptive generation batch. Preserve final test and teacher reserves. Repair insufficient coverage or limit the claim rather than treating flat scores as proof that a Skill is ineffective.","auditLabel":"View current coverage counts"}}},d={"dataset-0":["docfinqa"],"dataset-1":["finsearchcomp-paper","finsearchcomp-code"],"dataset-2":["findeepresearch"],"dataset-3":["dscodebench"],"dataset-4":["dabstep-paper","dabstep-leaderboard"],"dataset-5":["dsbench"],"setting-0-0":["qwen-model"],"setting-0-2":["claude-code","claude-skills"],"setting-0-3":["vllm-serving"],"setting-2-0":["swift-lora"],"setting-2-4":["swift-lora"],"setting-4-0":["nvidia-gpu"],"setting-4-1":["swift-lora"],"setting-4-2":["axolotl-memory","swift-lora"],"setting-2-5":["dapo-paper","dapo-implementation"],"execution-synthesis":["nemotron-data"],"candidate-task-types":["axion"],"candidate-data-rationale":["axion"]},f=[...new Set(Object.values(d).flat())],p=[`Harness element`,`Core content`,`Implementation in this project`],m=[{element:`Context management`,cores:[`Prompt engineering`,`Agent state tracking`,`Context compression`,`Agent Skills`]},{element:`Context management: retrieval and cross-session memory`,cores:[`User memory`,`RAG`,`Structured indexing`,`Agentic RAG`]},{element:`Tool interfaces and constraints`,cores:[`Tool categories`,`Access control`,`MCP standard`,`Active tool discovery`]},{element:`Verification and correction`,cores:[`Coding Agent Harness`,`Test-driven execution`,`Codified rules`]}];function h(e){return m.map(({element:t,cores:n})=>({element:t,rows:n.map(t=>({core:t,implementation:e[t]}))}))}var g={"zh":{"note":"H₀ 固定为原版 Claude Code；actor 与 teacher model 均拟使用 Qwen3.8-Flash-Next BF16（约 180B），通过 vLLM Anthropic-compatible service 接入。下表描述目标模型的配置；模型接入与隔离效果分别通过 pilot 检查。","groups":[{"element":"Context management","rows":[{"core":"Prompt engineering","implementation":"固定 system prompt、task template、output format 和 tools；每题按 template 填入对应问题与允许资料。"},{"core":"Agent state tracking","implementation":"复用固定 Claude Code 版本中可用的 native task state tracking，记录 task 状态及其在 trajectory 中的表示。"},{"core":"Context compression","implementation":"复用 native context compaction，保存 compaction 前后 actor 实际可见的输入。"},{"core":"Agent Skills","implementation":"沿用 native skill loading；只修改 skill 文字与示例，hooks、permissions 和 tools 固定。"}]},{"element":"Context management: retrieval and cross-session memory","rows":[{"core":"User memory","implementation":"每题使用独立 session 与工作目录，重置或禁用 cross-task memory，并检查跨题隔离。"},{"core":"RAG","implementation":"先读取固定金融文件；现成 search、网页读取与金融 API tools 通过 pilot 检查后再启用。"},{"core":"Structured indexing","implementation":"未配置 BM25 或 vector index；仅使用带 source ID 与版本号的资料文件。"},{"core":"Agentic RAG","implementation":"actor 在 native Claude Code loop 中选择并重复资料读取与计算；联网 search 和 API tools 通过 pilot 检查后再使用。"}]},{"element":"Tool interfaces and constraints","rows":[{"core":"Tool categories","implementation":"固定 H₀ 的 tool catalog 与 tool schemas；pilot 检查覆盖 vLLM Anthropic-compatible service 的 tool call、tool response 与 streaming。"},{"core":"Access control","implementation":"沿用固定 permissions 与现有执行限制；actor 不得读取 reference answer、verifier 内部数据或其他题目的 trajectory。"},{"core":"MCP standard","implementation":"任务需要时接入现成 MCP servers，须先完成 pilot 检查；不新增 MCP runtime。"},{"core":"Active tool discovery","implementation":"固定 tool catalog，不新增 custom discovery 或安装新 tools。若固定 Claude Code 版本启用 native tool search，则将其范围限制在该 catalog 内，并固定配置。"}]},{"element":"Verification and correction","rows":[{"core":"Coding Agent Harness","implementation":"actor 的 task calls 由原版 Claude Code native loop 执行；保存真实 model input、tool call、tool response 与 trajectory，不另写 custom harness。"},{"core":"Test-driven execution","implementation":"actor 可在 Claude Code sandbox 中运行 visible tests；hidden tests 由外部 verifier 执行。未配置强制 test-first 或 custom correction workflow。"},{"core":"Codified rules","implementation":"actor 外部的 verifier 使用固定 checking rules V₀，按 schema、numerical tolerance、原始证据和 rubric 检查结果，供 data filtering 与 paired evaluation 使用；不新增 custom completion-correction runtime。"}]}]},"en":{"note":"H₀ is fixed to the original Claude Code. The actor and teacher model are both intended to use Qwen3.8-Flash-Next BF16 (approximately 180B) through a vLLM Anthropic-compatible service. The table describes the target-model configuration; model integration and isolation are checked separately in pilots.","groups":[{"element":"Context management","rows":[{"core":"Prompt engineering","implementation":"Fix the system prompt, task template, output format and tools. Fill the template with each task's question and permitted materials."},{"core":"Agent state tracking","implementation":"Reuse native task state tracking available in the fixed Claude Code version, recording task states and their representation in the trajectory."},{"core":"Context compression","implementation":"Reuse native context compaction and save the actor's actual inputs before and after compaction."},{"core":"Agent Skills","implementation":"Use native skill loading and edit only skill content and examples. Hooks, permissions and tools stay fixed."}]},{"element":"Context management: retrieval and cross-session memory","rows":[{"core":"User memory","implementation":"Use an independent session and working directory per task, reset or disable cross-task memory, and check task isolation."},{"core":"RAG","implementation":"Start by reading fixed financial files. Enable existing search, page reading and financial API tools only after pilot checks."},{"core":"Structured indexing","implementation":"No BM25 or vector index is configured. Use only source-ID-tagged, versioned files."},{"core":"Agentic RAG","implementation":"The actor selects and repeats source reading and calculation in the native Claude Code loop. Use online search and API tools only after pilot checks."}]},{"element":"Tool interfaces and constraints","rows":[{"core":"Tool categories","implementation":"Fix H₀'s tool catalog and tool schemas. Pilot checks cover tool calls, tool responses and streaming through the vLLM Anthropic-compatible service."},{"core":"Access control","implementation":"Reuse fixed permissions and existing execution constraints. The actor must not access reference answers, verifier internals or other tasks' trajectories."},{"core":"MCP standard","implementation":"Connect existing MCP servers when needed, subject to pilot checks. Do not add an MCP runtime."},{"core":"Active tool discovery","implementation":"Fix the tool catalog; do not add custom discovery or install new tools. If native tool search is enabled in the fixed Claude Code version, constrain it to this catalog and keep its configuration fixed."}]},{"element":"Verification and correction","rows":[{"core":"Coding Agent Harness","implementation":"Execute the actor's task calls in the original Claude Code native loop. Save actual model inputs, tool calls, tool responses and trajectories without writing a custom harness."},{"core":"Test-driven execution","implementation":"The actor may run visible tests in the Claude Code sandbox. An external verifier runs hidden tests. No mandatory test-first or custom correction workflow is configured."},{"core":"Codified rules","implementation":"The external verifier applies fixed checking rules V₀: schema checks, numerical tolerances, source evidence and the rubric. Results support data filtering and paired evaluation; no custom completion-correction runtime is added."}]}]}},_=e((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),v=e(((e,t)=>{t.exports=_()}))();function y({headers:e,groups:t}){return(0,v.jsx)(`div`,{className:`table-wrap harness-table-wrap`,role:`region`,"aria-label":`Harness implementation table`,tabIndex:0,children:(0,v.jsxs)(`table`,{className:`harness-table`,children:[(0,v.jsx)(`thead`,{children:(0,v.jsx)(`tr`,{children:e.map(e=>(0,v.jsx)(`th`,{scope:`col`,children:e},e))})}),t.map(t=>(0,v.jsx)(`tbody`,{children:t.rows.map((n,r)=>(0,v.jsxs)(`tr`,{children:[r===0&&(0,v.jsx)(`th`,{scope:`rowgroup`,rowSpan:t.rows.length,"data-label":e[0],children:t.element}),(0,v.jsx)(`th`,{scope:`row`,"data-label":e[1],children:n.core}),(0,v.jsx)(`td`,{"data-label":e[2],children:n.implementation})]},n.core))},t.element))]})})}var b=`data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20id='ACM_Diamond'%20viewBox='0%200%20705.96%20363.27'%3e%3cdefs%3e%3cstyle%3e.cls-2{fill:%230053b3}%3c/style%3e%3c/defs%3e%3ccircle%20id='Background'%20cx='181.63'%20cy='180.99'%20r='135.
