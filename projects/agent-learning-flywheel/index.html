510.13936`,description:`Distinguish 64 company tasks from 15,808 report checks.`}],footerNote:`Agent Learning Flywheel · A design for improving financial LLM agents round by round.`,attribution:`Layout and presentation adapted from`,backToTop:`Back to top`,unitMotivationLabel:`Motivation`,unitWhatLabel:`What`,unitHowLabel:`How`,candidatesHeading:`Candidates`,settingsGroups:[{title:`Models and runtime`,items:[[`Base model`,`Qwen/Qwen3.8-Flash-Next in BF16. The approximately 180B release count includes n-gram embedding and MTP; the model card separately lists 125B main parameters and 6B active parameters. Record the parameters actually loaded. BF16 is the weight-storage precision.`],[`Actor and teacher model`,`M_g,t is group g’s actor in round t; all groups start from M₀. The teacher model is Gₜ, initially G₀=M₀, shared by all groups. Sₜ is their shared skill; S_gen is a task template that never changes during the experiment.`],[`Claude Code`,`Keep its version, tools, permissions, model aliases and session configuration fixed as H₀. Save source-file versions per task. Experiment scripts start, reset and record tasks; Claude Code still handles tool calls.`],[`Model serving`,`Use existing vLLM support for the Anthropic Messages API. Check tool-call format, streaming, skill loading, actual model requests and logs. Export trained LoRA adapter, load them in the service and run inference before the main experiment.`]]},{title:`Data and evaluation`,items:[[`Data split`,`Use the train set for error analysis and generating training samples. Split the validation set by purpose: validation set (error analysis) returns only error types and counts, not original questions or answers to generation; validation set (update selection) decides whether to keep new skill, actor or teacher-model checkpoints. Use the test set only after all rounds.`],[`Shared training data`,`One fixed teacher model generates one batch per training round. All groups read the same D_A and D_B files, seed examples and replay data. Do not add or change samples after training starts.`],[`Verification rules`,`V₀ contains checking programs, numerical tolerances, the rubric and requirements for keeping updates. Keep it unchanged during the main experiment. New tasks get their own reference answers and intermediate values under these rules. If the rules are wrong, pause, correct them and rerun every affected comparison.`]]},{title:`Training configuration`,items:[[`LoRA SFT`,`Keep base weights W₀ in BF16 and unchanged. Each group adds its LoRA adapter’s effective increment Δ_g,t, initially Δ_g,0=0. Each training round starts from its last kept LoRA adapter. Edit-skill rounds do not train weights. None of the three groups uses QLoRA.`],[`Supervised token budget`,`Primarily match the number of assistant tokens included in the training loss. A token is a unit produced by the model’s tokenizer. Also record all input tokens, sample repetitions, training steps and GPU time. B-only has no new D_A, so that comparison changes data composition; the groups may see D_B different numbers of times.`],[`Data order`,`Mixed and A → B use the same new samples, supervised token counts and repetitions per sample, changing only the order of new D_A and D_B. Shared seed and replay data have the same insertion positions and proportions.`],[`Optimizer and learning rate`,`Initialize optimizers under the same rule at the start of each training round. Keep optimizer state and learning-rate progress between A and B. Use the same learning-rate schedule, rules for splitting long records and rules for packing short samples.`],[`Training pilot`,`Use an existing framework to check distribution across four GPUs, target layers and loading exported models. Initial candidates are rank=8, alpha=32, micro-batch size=1, activation checkpointing and gradient accumulation. Try 4K and 8K training windows, the number of tokens readable in one training sample. Use the same working configuration in all groups. Do not assume all linear layers are trained. Check training-backward and inference memory peaks separately, including inference KV-cache memory and the intended task-context length.`]]},{title:`Experiment protocol`,items:[[`Round start`,`Save the versions of all actors, skill, teacher model, task template, checking rules and budgets. Choose only edit skill or generate data and train. Pause when tools or sources are unavailable; do not add a third type of change.`],[`Update policy`,`All groups make the same choice in the same round. They use a new skill only if no group’s score falls beyond tolerance and the preset combined score improves.`],[`Checkpoint management`,`All groups start with the same model. Later each keeps its own LoRA adapter. Do not restart each round from the initial model or copy the highest-scoring group’s weights into other groups.`],[`Paired evaluation`,`Share Claude Code, checking rules, round choices, skill, teacher model and generated data. Compare each new model with its own previous version. Retain initial M₀ and skill S₀ for testing at the end.`],[`Preregistration`,`After small trial runs, save data counts, generation and training budgets, maximum rounds, rules for choosing a change, and requirements for keeping it before the main experiment. Model starting points later differ because of earlier training. Compare the long-term results of fixed methods; a later single-round gap alone does not isolate the effect of sample order.`]]},{title:`Compute resources`,items:[[`Hardware`,`Four NVIDIA RTX PRO 6000 Blackwell cards with 96GB each, nominally 384GB total. The training framework must distribute the model correctly across cards. Actual four-GPU training remains to be checked.`],[`CPU offload`,`Prefer existing Megatron-SWIFT PLE_CPU_OFFLOAD=1 for the n-gram PLE table. The table is about 95.4GiB (102.4GB); host RAM must also cover temporary loading data, process copies and task files. Check serving support separately.`],[`VRAM budget`,`For the loading scope documented by Axolotl, BF16 weights occupy about 329.6GiB, with about 234.2GiB (251.5GB) left on GPU after moving PLE to CPU. LoRA state, intermediate calculations, communication and temporary data need more memory. SWIFT’s eight-GPU 4K example peaks at 63.6GiB per card and does not establish four-GPU feasibility. Report GB and GiB separately.`],[`Resource scheduling`,`Generate teacher-model data, train LoRA and evaluate tasks sequentially. Release the previous model service before switching. Do not keep teacher model, actors and training process resident together. Measure training and inference memory peaks, speed and CPU transfer time separately.`],[`Task execution resources`,`Prefer CPU-feasible financial table tasks with fixed CPU count, RAM and time. Check competition with the PLE table for host resources. Confirm separate resources before using tasks that train regressors on GPU. Training a task’s regressor and running LoRA SFT on the 180B model are different operations.`]]}]}},d=[`Harness element`,`Core content`,`Implementation in this project`],f=[{element:`Context management`,cores:[`Prompt engineering`,`Agent state tracking`,`Context compression`,`Agent Skills`]},{element:`Context management: retrieval and cross-session memory`,cores:[`User memory`,`RAG`,`Structured indexing`,`Agentic RAG`]},{element:`Tool interfaces and constraints`,cores:[`Tool categories`,`Access control`,`MCP standard`,`Active tool discovery`]},{element:`Verification and correction`,cores:[`Coding Agent Harness`,`Test-driven execution`,`Codified rules`]}];function p(e){return f.map(({element:t,cores:n})=>({element:t,rows:n.map(t=>({core:t,implementation:e[t]}))}))}var m={zh:{note:`H₀ 固定为原版 Claude Code；actor 与 teacher model 均拟使用 Qwen3.8-Flash-Next BF16（约 180B），通过 vLLM Anthropic-compatible service 接入。下表描述目标模型的配置；模型接入与隔离效果分别通过 pilot 检查。`,groups:p({"Prompt engineering":`固定 system prompt、task template、output format 和 tools；每题按 template 填入对应问题与允许资料。`,"Agent state tracking":`复用固定 Claude Code 版本中可用的 native task state tracking，记录 task 状态及其在 trajectory 中的表示。`,"Context compression":`复用 native context compaction，保存 compaction 前后 actor 实际可见的输入。`,"Agent Skills":`沿用 native skill loading；只修改 skill 文字与示例，hooks、permissions 和 tools 固定。`,"User memory":`每题使用独立 session 与工作目录，重置或禁用 cross-task memory，并检查跨题隔离。`,RAG:`先读取固定金融文件；现成 search、网页读取与金融 API tools 通过 pilot 检查后再启用。`,"Structured indexing":`未配置 BM25 或 vector index；仅使用带 source ID 与版本号的资料文件。`,"Agentic RAG":`actor 在 native Claude Code loop 中选择并重复资料读取与计算；联网 search 和 API tools 通过 pilot 检查后再使用。`,"Tool categories":`固定 H₀ 的 tool catalog 与 tool schemas；pilot 检查覆盖 vLLM Anthropic-compatible service 的 tool call、tool response 与 streaming。`,"Access control":`沿用固定 permissions 与现有执行限制；actor 不得读取 reference answer、verifier 内部数据或其他题目的 trajectory。`,"MCP standard":`任务需要时接入现成 MCP servers，须先完成 pilot 检查；不新增 MCP runtime。`,"Active tool discovery":`固定 tool catalog，不新增 custom discovery 或安装新 tools。若固定 Claude Code 版本启用 native tool search，则将其范围限制在该 catalog 内，并固定配置。`,"Coding Agent Harness":`actor 的 task calls 由原版 Claude Code native loop 执行；保存真实 model input、tool call、tool response 与 trajectory，不另写 custom harness。`,"Test-driven execution":`actor 可在 Claude Code sandbox 中运行 visible tests；hidden tests 由外部 verifier 执行。未配置强制 test-first 或 custom correction workflow。`,"Codified rules":`actor 外部的 verifier 使用固定 checking rules V₀，按 schema、numerical tolerance、原始证据和 rubric 检查结果，供 data filtering 与 paired evaluation 使用；不新增 custom completion-correction runtime。`})},en:{note:`H₀ is fixed to the original Claude Code. The actor and teacher model are both intended to use Qwen3.8-Flash-Next BF16 (approximately 180B) through a vLLM Anthropic-compatible service. The table describes the target-model configuration; model integration and isolation are checked separately in pilots.`,groups:p({"Prompt engineering":`Fix the system prompt, task template, output format and tools. Fill the template with each task's question and permitted materials.`,"Agent state tracking":`Reuse native task state tracking available in the fixed Claude Code version, recording task states and their representation in the trajectory.`,"Context compression":`Reuse native context compaction and save the actor's actual inputs before and after compaction.`,"Agent Skills":`Use native skill loading and edit only skill content and examples. Hooks, permissions and tools stay fixed.`,"User memory":`Use an independent session and working directory per task, reset or disable cross-task memory, and check task isolation.`,RAG:`Start by reading fixed financial files. Enable existing search, page reading and financial API tools only after pilot checks.`,"Structured indexing":`No BM25 or vector index is configured. Use only source-ID-tagged, versioned files.`,"Agentic RAG":`The actor selects and repeats source reading and calculation in the native Claude Code loop. Use online search and API tools only after pilot checks.`,"Tool categories":`Fix H₀'s tool catalog and tool schemas. Pilot checks cover tool calls, tool responses and streaming through the vLLM Anthropic-compatible service.`,"Access control":`Reuse fixed permissions and existing execution constraints. The actor must not access reference answers, verifier internals or other tasks' trajectories.`,"MCP standard":`Connect existing MCP servers when needed, subject to pilot checks. Do not add an MCP runtime.`,"Active tool discovery":`Fix the tool catalog; do not add custom discovery or install new tools. If native tool search is enabled in the fixed Claude Code version, constrain it to this catalog and keep its configuration fixed.`,"Coding Agent Harness":`Execute the actor's task calls in the original Claude Code native loop. Save actual model inputs, tool calls, tool responses and trajectories without writing a custom harness.`,"Test-driven execution":`The actor may run visible tests in the Claude Code sandbox. An external verifier runs hidden tests. No mandatory test-first or custom correction workflow is configured.`,"Codified rules":`The external verifier applies fixed checking rules V₀: schema checks, numerical tolerances, source evidence and the rubric. Results support data filtering and paired evaluation; no custom completion-correction runtime is added.`})}},h=e((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),g=e(((e,t)=>{t.exports=h()}))();function _({headers:e,groups:t}){return(0,g.jsx)(`div`,{className:`table-wrap harness-table-wrap`,role:`region`,"aria-label":`Harness implementation table`,tabIndex:0,children:(0,g.jsxs)(`table`,{className:`harness-table`,children:[(0,g.jsx)(`thead`,{children:(0,g.jsx)(`tr`,{children:e.map(e=>(0,g.jsx)(`th`,{scope:`col`,children:e},e))})}),t.map(t=>(0,g.jsx)(`tbody`,{children:t.rows.map((n,r)=>(0,g.jsxs)(`tr`,{children:[r===0&&(0,g.jsx)(`th`,{scope:`rowgroup`,rowSpan:t.rows.length,"data-label":e[0],children:t.element}),(0,g.jsx)(`th`,{scope:`row`,"data-label":e[1],children:n.core}),(0,g.jsx)(`td`,{"data-label":e[2],children:n.implementation})]},n.core))},t.element))]})})}function v({headers:e,rows:t}){return(0,g.jsx)(`div`,{className:`table-wrap`,tabIndex:0,children:(0,g.jsxs)(`table`,{children:[(0,g.jsx)(`thead`,{children:(0,g.jsx)(`tr`,{children:e.map(e=>(0,g.jsx)(`th`,{scope:`col`,children:e},e))})}),(0,g.jsx)(`tbody`,{children:t.map((t,n)=>(0,g.jsx)(`tr`,{children:t.map((t,n)=>(0,g.jsx)(`td`,{"data-label":e[n],children:t},n))},n))})]})})}function y({blocks:e}){return(0,g.jsx)(`div`,{className:`prose`,children:e.map((e,t)=>e.type===`table`?(0,g.jsx)(v,{headers:e.headers,rows:e.rows},t):e.type===`heading`?(0,g.jsx)(`h4`,{children:e.text},t):e.type===`list`?(0,g.jsx)(`ul`,{children:e.items.map(e=>(0,g.jsx)(`li`,{children:e},e))},t):e.type===`formula`?(0,g.js
