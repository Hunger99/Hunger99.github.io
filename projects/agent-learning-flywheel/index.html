练／评测的能力"],"coverageLabel":"题目要求与使用限制","datasets":[{"name":"DocFinQA","url":"https://huggingface.co/datasets/kensho/DocFinQA","definition":"读取给定财报，找到数字并计算答案。","coverage":"检查财报段落、accounting definitions、单位与计算参数；normalized exact answer 去除千位逗号与显示用美元/百分号后要求数值相等，不设数值容差；文字忽略大小写与首尾空格。","role":"训练：让模型依据财报原文取数、识别会计口径和单位并完成可核验计算；评测：检查这些能力在未参与训练的报告上是否仍然成立。","size":"官方 7,437 题；data-v2 保留 4,738 题\ndata-v2：train 2,504 / diagnostic validation 1,036 / selection validation 276 / test 922。官方 dev 去除 6 道重复后保留 774 题，全部用于 diagnostic；train 按报告划分。为 test 保留报告而剔除 train 中 2,659 题，另去除 train 内重复 34 题。\nselection 中 actor／Skill 实际使用 258 题，另 18 题预留给固定 teacher，本主实验不使用该预留部分。"},{"name":"FinSearchComp · T2 / T3","url":"https://huggingface.co/datasets/ByteSeedXpert/FinSearchComp","definition":"T2查找历史事实；T3从多个时间和来源查资料后计算答案。","coverage":"需要现成搜索、网页读取和必要的金融数据 API。T1要求查询随时间变化的数据，单独处理。公开题目不等于已有完整 trajectory。","role":"训练侧诊断：定位查找金融资料和多来源核对中的失败；评测：检查模型能否自行找到历史证据、核对时间与来源，并据此计算答案。","size":"公开 635 题：T1 244 / T2 219 / T3 172；data-v2 保留 T2+T3 全部 391 题\ndata-v2：277 / 38 / 38 / 38。按来源问题分组，T1 不纳入；test 题及其改写不能进入训练。题目文件已取得，逐题网络来源可用性仍待验收。\nselection 中 actor／Skill 实际使用 27 题，另 11 题预留给固定 teacher，本主实验不使用该预留部分。"},{"name":"FinDeepResearch","url":"https://huggingface.co/datasets/OpenFinArena/FinDeepResearch","definition":"查找资料、计算指标并按要求写公司研究报告。","coverage":"官方 reference reports 和 rubric（逐项评分规则）已取得，仅供 evaluator 使用；actor 读取报告结构后自行查资料。完整评分流程已用控制案例接通，judge 已通过一组范围有限的控制校准，完整官方评分与真实任务上的质量仍待验证。","role":"只评测：检查模型能否完成有资料截止日期、数值依据和引用要求的完整公司研究报告；这些评测公司的报告不进入训练。","size":"公开 64 家公司任务，覆盖8个市场；data-v2 全部保留，不用于训练\ndata-v2：0 / 8 / 8 / 48；每个市场按公司分配 1 道 diagnostic、1 道 selection、6 道 test。评测公司的报告及其派生题不进入训练。\nselection 中 actor／Skill 实际使用 7 题，另 1 题预留给固定 teacher，本主实验不使用该预留部分。"},{"name":"DSCodeBench · Relevant Subset","url":"https://github.com/ShuyinOuyang/DSCodeBench","definition":"从 Pandas、NumPy、SciPy、Scikit-learn 题目中选择数据处理、统计和建模代码题。","coverage":"保留 NumPy、Pandas、SciPy、Scikit-learn 题。评分使用官方测试加 CPU comparator 修复：移除未用的神经库依赖，并修复四处未检查比较结果的表达式。新版指标 official_tests_with_cpu_shape_and_mask_v2 先检查数组形状和 mask，再按原规则比较值；实际 Train 控制中正确答案通过200/200，前导维度错误通过0/200。旧指标的通过结论须重验，完整子集尚未重新评分。","role":"训练：学习可执行的数据清洗、数组操作、统计与建模代码；评测：检查模型能否通过未参与训练题目的测试，含边界情况。","size":"官方全量 1,000 题；data-v2 的 CPU 相关子集 405 题\ndata-v2：285 / 40 / 40 / 40。按去除函数、变量名差异的代码结构分组；语义模板家族待核对。剔除图像、音频及神经库依赖。reference code 与测试脚本不进入 actor 材料。\nselection 中 actor／Skill 实际使用 33 题，另 7 题预留给固定 teacher，本主实验不使用该预留部分。"},{"name":"DABstep · Hard","url":"https://huggingface.co/datasets/adyen/DABstep","definition":"读取支付记录、费率规则和业务文件，完成筛选、表连接、汇总和计算。","coverage":"主要检查数据处理，不是训练预测模型。官方主评测答案不公开；2025年论文成绩不代表当前180B 模型的成绩。","role":"只做最终外部评测：检查模型能否读取多份支付业务资料，执行筛选、表连接、汇总和费用计算；public dev 仅检查接入。","size":"官方 450 题，其中 Hard 378；data-v2 保留 375 道 Hard test\ndata-v2：0 / 10 / 0 / 375。10 道 public dev 用于接入检查；Hard 中与 dev 重复的 3 题不进入 test。375 题仅供最终外部评分。dev 已用官方 question scorer 和导出格式通过控制；正式提交尚未执行。官方入口要求 450 个 ID，非项目 75 行留空，官方公开逐题 task_scores，项目取得本次提交结果后按这 375 个 ID 求平均分。"},{"name":"DSBench · Financial Analysis and Modeling","url":"https://github.com/LiqiangJing/DSBench","definition":"读取工作簿完成分析，或清理表格、建立特征、训练 classifier / regressor 并输出预测。","coverage":"建模子集含 Santander 的三道任务、Porto Seguro 和 bank churn，共四道分类与一道回归；分别使用各题官方 metric 和 RPG。RPG 衡量相对官方 baseline 的提升比例。任务优先使用 CPU。","role":"分析题用于训练和评测读取工作簿、组合表格操作及独立计算的能力；金融建模题补充评测无标签泄漏的特征处理、分类或回归和预测文件生成，按具体任务分别报告。","size":"官方分析 466 + 建模 74；data-v2 使用分析 466 + 金融建模 5\n分析题 data-v2：341 / 70 / 26 / 29，按 38 个工作簿来源分组；建模题：2 / 1 / 1 / 1，按 competition 分组。每道建模题内部再把有标签训练行按 80/20 划作拟合与调参，官方重切 test labels 仅供 evaluator；submission 模板 ID 已对齐。\nanalysis selection 中 actor／Skill 使用 16 题／2个工作簿，另 10 题预留 teacher；modeling selection 的1题供 actor 使用。"},{"name":"IFEval","url":"https://huggingface.co/datasets/google/IFEval","definition":"检查回答是否满足指定格式、长度、关键词等要求。","coverage":"只用于检查通用 instruction following 是否下降，不用于判断金融答案是否正确。","role":"只评测：检查修改 Skill 或训练后，模型是否仍能同时遵守格式、长度和关键词等明确指令，防止金融任务改进伴随通用 instruction following 退化。","size":"全部 541 题；data-v2 自定义 validation/test\ndata-v2：0 / 0 / 270 / 271。validation 用于检查更新，test 只在最后使用；两者不进入训练或 task generation。官方 strict prompt accuracy 要求一道题的全部可验证指令均满足才得 1，否则得 0。\nselection 中 actor／Skill 实际使用 223 题，另 47 题预留给固定 teacher，本主实验不使用该预留部分。"}],"candidatesHeading":"对比方案","settingsHeading":"设置","systemCandidatesHeading":"三种 training recipe 与 Skill-only 对照","candidateHeaders":["候选系统","更新内容／训练数据","下一轮从哪个设置继续"],"candidates":[["B-only","新增样本只用 D_B。共同 seed examples 是固定已验收示例，replay data 是此前已验收记录；两者另按支持数据规则加入。","从本组上一次保留的 LoRA adapter 继续，training recipe 始终为 B-only。"],["Mixed","按固定比例混合新增 D_A 与 D_B。","从本组上一次保留的 LoRA adapter 继续。使用与 A → B 相同的新增样本和每个样本的训练次数。"],["A → B","在同一份 LoRA adapter 上先训练 D_A，再训练 D_B。","从本组上一次保留的 LoRA adapter 继续。由 A 转到 B 时保留 optimizer state 和 learning-rate schedule。"],["Skill-only（独立更新策略对照）","只修改本组 Skill，模型固定为 M₀，不合成 SFT 数据、不更新模型参数。","从本组上一次保留的 Skill 继续；单独维护诊断和状态，不作为三种 training recipe 的第四组。"]],"settingsGroups":[{"title":"Models and runtime","items":[["Base model","Qwen/Qwen3.8-Flash-Next，使用 BF16。发布的约180B参数包含 n-gram embedding 和 MTP；官方另列主体125B、每次激活6B。记录实际加载范围。BF16 是 weight storage precision。"],["Actor and teacher model","三组从M₀开始，分别保留自己的LoRA；trajectory teacher固定为M₀。新16K协议把question generator固定为CLIProxyAPI Opus 5.5/high，运行中不回退到本机M₀。每次请求先预留费用，触及原角色或US$100累计上限即以incomplete停止，完整最大矩阵不保证有足够预算。当前格式已完成一批真实出题：两个不同Train来源的数值参考通过独立重算；实际返回模型为claude-opus-5-5，请求high，服务未回报有效effort。旧M₀准备记录保留；真实teacher、准入和完整训练资格仍须独立验收。"],["Claude Code","全程使用同一版本、工具、权限、model alias 和 session 设置，记为 H₀。资料文件按题目保存版本。实验脚本只启动、重置和记录题目；模型仍通过 Claude Code 原有功能调用工具。"],["Model serving","正式BF16路径与FP8预检分开。thinking开启、Qwen effort=xhigh；temperature=1、top_p=0.95、top_k=20、min_p=0。普通题32 turns、64 tool calls、900秒、单次8K及整题32K输出；报告64 turns、3600秒、64K总输出。子agent同模型、最多2个且深度1，合计消耗计入预算。"]]},{"title":"Data and evaluation","items":[["Data split","当前 data-v2 数量保留作历史事实；新选择集须先按数据集、官方 subset 与主要能力检查覆盖，再固定来源组隔离、类别配比与各类绝对题量。不能在某次 Skill 分数不涨后临时加入有利验收题。绝对数量依据诊断试跑的波动和要识别的变化确定；重复问同一财报不能补足独立来源数。类别缺失或过稀时，先补独立资料、按能力依据合并类别或缩小可验收范围；覆盖未核实不记成已证明无效。原 train／diagnostic／selection／test 职责、teacher 预留与最终 test 隔离保留。"],["Shared training data","每训练轮A/B各128道完整合格题，最多512候选、每题3次teacher执行；来源group只归A/B之一。主实验teacher固定，三组同一数据池。预算或合格题不足就不训练；不在看到selection后补数据。"],["Verification rules","主循环使用 Program 和 CLIProxyAPI Opus 5.5/high＋Claude Code。程序先处理可靠规则；Opus 在 C1–C5 主判 Skill 是否有缺陷、模型是否仍执行错误。新版 Skill 保留两次分开的 Opus 会话、最多两轮修订；复用仍有效的版本／范围／证据结论，不逐步重审。确定 Train 侧完整单元以 5% 概率进入独立异步人审；抽中或待审不进入自动准入条件。不确定项自动补查，未确认就暂不用并继续其他明确项；不凭“人工还没看”挂起整轮。人审发现漏判可独立从外部暂停，复核与恢复另行记录。模型探测答错是训练依据，不自动否决 Skill。新 judge 的 C1–C5 资格须单独验证；报告评测仍沿用固定 M₀ judge，其控制不能移作新模型已合格的证明。报告评测保留原控制要求：20 份控制报告、至少 40 个可判定非 N/A 条目，正负各至少 20，至少 90% 一致且不放过无依据数字或伪造证据；官方 N/A 空答案得分单独报告。开放报告仍不纳入本轮 SFT。代码评分保留 shape/mask 负控制并绑定指标、来源和实际答案；准入拒绝旧指标或少于 200 用例的通过记录。规则改变需新版本并重评受影响比较。"],["Separate data-policy experiment","独立数据策略固定 M₀、初始 skill S₀ 与 Mixed training recipe，比较 repair_only、targeted_replay 和 source_augmentation。三臂共用新增监督 token 目标，各臂允许至多一整题偏差；seed/replay 支持记录的题目、response windows 和重复次数相同。seed 是初始示范，replay 是已验收的历史示范，均须在 S₀ 下重新执行。recovery 单独实验，不加入主实验配额。"]]},{"title":"Training configuration","items":[["LoRA SFT","base weights W₀ 保持 BF16 且不训练。每组模型为 W₀ 加本组 LoRA adapter 的有效增量 Δ_g,t，初始 Δ_g,0=0，从本组上次采用的 adapter 继续。允许同轮先核验新版 Skill，再固定该版本生成数据并做 LoRA SFT；审查 Skill 时不更新权重，训练时不继续改 Skill。三组不使用 QLoRA。"],["Supervised token budget","Mixed与A→B严格共享同一完整样本multiset和supervised tokens，即参与loss的assistant输出。B-only允许最多一个完整window的预算差并报告；它比较data mixture。输入tokens、重复次数、steps和GPU-hours另记，不能混成同一成本。"],["Data order","离线生成唯一消费顺序：Mixed打乱新增A/B，A→B先A后B，支持window位置相同；trainer关闭两层shuffle和按长度分组，保存每step sample IDs。Mixed与A→B每8个新增window插1个seed、1个replay；没有当前skill下合格replay（此前验收的真实记录）时改为2个seed。"],["Optimizer and learning rate","AdamW，learning rate=1e-4、betas=0.9/0.95、weight decay=0、clip norm=1；cosine schedule、warmup 3%。每轮重建optimizer，A/B交界保留其状态与进度。训练前完整schedule必须不超过4,194,304 supervised tokens和512steps；24小时未完成不得参与保留比较。"],["Training pilot","新协议保留rank=8、alpha=32、dropout=0及attention projections in_proj/out_proj/linear_qkv/linear_proj，使用TP4/PP1/EP1/ETP4、micro-batch=1、gradient accumulation=8、activation checkpointing且不packing。完整训练窗口改为16,384 token；先核4K连通性，再核真实16K更新、基座冻结、完整状态恢复、导出和新adapter回载。不改变单次8K输出上限。旧8K输入和失败原件保留；16K设置和CPU编码通过不证明所有真实任务可容纳，也不替代四卡资格。"],["备选 RL · DAPO","DAPO（Decoupled Clip and Dynamic Sampling Policy Optimization）根据同题多条回答的相对奖励更新策略。它作为独立的 on-policy RL 备选，训练数据由当前 actor（本轮被更新的执行模型）采样；主实验 B-only、Mixed、A→B 仍采用 LoRA SFT。独立固定长度口径、未完成回合处理和有效训练覆盖；旧4B的超参数不直接移用。"]]},{"title":"Experiment protocol","items":[["Round start","保存本轮起点的三组模型、Skill、固定 M₀ teacher、出题和审查配置、题单与预算。分别记录当前采用组合与已通过规则核验的 Skill；已验证规则不因中间分数未涨而丢失。按证据选择仅改 Skill、仅训练，或同轮先改 Skill 后训练；工具或资料故障先修复并恢复同轮。"],["Update policy","保留每 actor 32 道不同 Train 题、每题同条件两次、四数据集各 8 个来源组；重复执行不增加独立来源数。合格规则缺陷或执行缺口仍须至少两个不同来源组证实；全错只修已有规则的明确错误。规则有误先改 Skill；规则核验通过但当前模型仍有执行缺口，则同轮走合成和训练；现有 Skill 已核验而执行不稳则直接训练。Skill 采用不再要求留出主分平均涨 1 个百分点：须规则核验通过、固定 Train 检查题有改善、代表性留出主分及受影响大类不下降，并通过原退化保护。目标 actor 的检查题未做对可触发训练，不在中间自动否决 Skill。LoRA 候选仍按预定模型收益与退化门槛选择。新流程和分层留出须另立版本，旧协议不改名复用。 联合更新时，Train 改善看最终组合，不要求旧模型在训练前已改善；LoRA 与同一新版 Skill 下的旧 adapter 比较，仍须主分至少 +1 个百分点及原退化保护；最终采用组合还须相对本轮起点通过保护，不把 S1 下的 adapter 错装到 S0 下。"],["Checkpoint management","三组最初的模型相同；之后各自保留自己的 LoRA adapter。每轮不重新从 initial checkpoint 开始，也不把成绩最好一组的权重复制给其他组。"],["Paired evaluation","现有主分仍等权平均 DocFinQA、FinSearchComp 和 DSCodeBench CPU；data-v2 主 selection 318 题、IFEval 另 223 题，属于旧拆分事实。新版本另冻结主要题型覆盖与逐类来源数，不用小样本补充集冒充充分验收。联合更新时，同条件记录本轮原组合、仅换新版 Skill 的中间组合、训练后的最终组合；中间得分只帮助解释，不阻断已核验 Skill 进入训练。在线资料变化最多匹配重跑一次，仍失配就暂停。新增比较计入原预算。"],["Preregistration","最多6轮，连续2轮无保留更新停止；基础设施故障恢复同轮，预算耗尽记未完成。每配置3次独立pipeline重复，各自维护skill/controller/生成状态。最终客观题每系统3次推理、报告1次；主要对比A→B−Mixed，按来源组配对报告95%区间及逐训练重复结果；更新策略实验的 adaptive−Skill-only、adaptive−training-only，以及出题策略实验的按错误补题−M₀/S₀、按错误补题−固定题型，共4项确认性对比统一Holm校正；Holm逐步收紧各项检验的阈值，控制同时作这4个比较的误报率，不能用反复selection的门槛证明泛化。"]]},{"title":"Compute resources","items":[["Hardware","4张 NVIDIA RTX PRO 6000 Blackwell，每张96GB，标称总 VRAM 384GB。training framework 必须正确完成 model sharding；四卡 training 仍需实际检查。"],["CPU offload","训练优先使用现成 Megatron-SWIFT 的 PLE_CPU_OFFLOAD=1，把 n-gram PLE 表保存在 host RAM。该表约95.4GiB（102.4GB）；host RAM 还要容纳加载时的临时数据、各进程副本和题目文件。inference 服务是否支持同样操作要另外检查。"],["Compute budget","最多同时4张当前RTX PRO 6000 Blackwell 96GB，teacher生成、LoRA训练和评测顺序切换。每独立pipeline重复上限240 GPU-hours/70,000 episodes，全研究1,440 GPU-hours；这些是资源上限，不是实测耗时。API订阅折算总上限US$100包含此前已用，复用原账本预留最坏调用成本；不启动额外现金API。"],["Resource scheduling","teacher model 生成数据、LoRA SFT 和 evaluation 依次运行，切换前释放上一项的 model server。四卡上不同时常驻 teacher model、actor 和训练进程。分别记录 training 与 inference 的 peak VRAM、throughput 和 CPU transfer time。"],["Task execution resources","新协议启用task进程的cgroup CPU/RAM硬限制，与模型服务和PLE分开。实际Train参考／工具工作负载已测量并冻结：文本1 CPU core／1GiB，代码与工作簿2 cores／4GiB，任务内建模4 cores／16GiB。IFEval、报告与DABstep按明确任务类别复用对应Train测量，不声称直接测过其保留题。上限至少为代表工作负载峰值的4倍，并使用上述最低值；这些是工程上限，不是完整actor测量或最优值。超限保留真实记录并暂停修复，不归因为模型能力不足。"]]}],"evaluationHeading":"评估指标","evaluationNote":"使用相同评测题目、inference budget 和 scorer，对比按失败原因选择更新、只修改 skill、只微调模型三种方式；训练轮另比较 B-only、Mixed、A → B 三种 training recipe。以下指标按数据集分别统计。","metricHeaders":["Metric","Formula and term explanation","公式含义（一句话）","使用该 metric 的 dataset"],"metrics":[["Accuracy","Accuracy = (1/N) Σᵢ cᵢ；N 为题数，数据集约定的 scorer 判最终答案正确时 cᵢ=1，否则为0。DABstep test 使用本次官方外部评分。","衡量模型在规定预算内最终答对了多少比例的题。","DocFinQA、FinSearchComp T2/T3、DABstep Hard、DSBench analysis"],["Code pass rate","Pass rate = (1/N) Σᵢ 𝟙[第 i 题全部测试通过]；N 为代码题数，𝟙[条件] 在条件成立时为1。使用项目修复后的 CPU comparator，并标明工具与重试预算，区别于原生 single-generation Pass@1。","衡量模型经过允许的工具使用和重试后，最终代码完全通过测试的题目比例。","DSCodeBench CPU 相关子集"],["Task metric / RPG","RPG = max(0, (m − b)/(r − b))；m 为该题官方 metric，b 为官方 baseline，r 为官方 reference best，r≠b；分类、回归各用本题规定的 metric，跨题再汇总 RPG。","0 表示未超过 baseline，1 表示达到 reference best，超过1表示优于该 reference；更高更好。","DSBench 金融建模子集"],["HisRubric score","Hᵣ = Σⱼ round(wᵣⱼ aᵣⱼ / 100, 2) / Fᵣ，H = (1/N) Σᵣ Hᵣ；a 为官方 adjusted_mark（0—100），w 为官方条目权重，round(·,2) 逐项保留两位小数，F 为报告官方满分，N 为报告数。固定 judge、source cutoff 和 N/A 规则。","衡量研究报告取得了多少比例的官方加权满分，再对报告等权平均。","FinDeepResearch；fixed-corpus 与 official online 分开报告"],["Strict prompt-level accuracy","Strict accuracy = (1/N) Σᵢ ∏ⱼ aᵢⱼ；N 为 prompt 数，第 i 题第 j 项指令通过 official strict checker 时 aᵢⱼ=1，否则为0。","只有一题的所有可检查指令都满足时，该题才计为通过。","IFEval"],["固定 Train 检查的改善","Δ_Train = S_Train(候选组合) − S_Train(本轮起点)。S_Train 是固定同题检查池的加权平均：Σ_i w_i·mean_r(s_i,r) / Σ_i w_i；i 为固定检查题，r 为配对的两次执行，s∈[0,1]沿用冻结评分。先将每个大类权重归一到相同总量，再在该类内让每个来源组权重相同；w 在新输出可见前固定。","正值表示这次修改使固定 Train 检查池表现更好；不单独证明对新资料的泛化。","Skill-only 比较仅换 Skill 的组合；联合更新比较最终组合。题单、材料条件和评分须前后匹配，模型超时计原规定失败，设施异常先修复不伪记零分。 每个 actor 分别计算；共享 Skill 的最终组合须各组 Δ_Train≥0，且至少一组>0。"]],"referenceNote":"以下来源用于说明已有模型、工具和方法。","references":[{"title":"Qwen3.8-Flash-Next · Official Model Card","url":"https://huggingface.co/Qwen/Qwen3.8-Flash-Next","description":"查模型结构、参数数量和下载版本；BF16是weight precision。","id":"qwen-model"},{"title":"NVIDIA · RTX PRO 6000 Blackwell","url":"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/","description":"查每卡96GB 的硬件规格；pilot 时记录实际卡型和主机连接方式。","id":"nvidia-gpu"},{"title":"Megatron-SWIFT · Qwen3.8-Flash-Next Best Practice","url":"https://swift.readthedocs.io/en/latest/BestPractices/Qwen3_8-Flash-Next-Best-Practice.html","description":"使用已有 BF16 LoRA 和 PLE 放到 CPU 的功能；文档中的八卡成绩不能代替四卡检查。","id":"swift-lora"},{"title":"Axolotl · Qwen 3.8 Flash Next","url":"https://docs.axolotl.ai/docs/models/qwen3.8-flash-next.html","description":"查实际加载的参数及 PLE 表大小，用于估算 BF16权重占用的内存。","id":"axolotl-memory"},{"title":"Claude Code · 非交互运行与结构化输出","url":"https://code.claude.com/docs/en/headless","description":"使用现成命令行执行题目和记录结果，不编写新的 tool call 循环。","id":"claude-code"},{"title":"Claude Code · Skills","url":"https://code.claude.com/docs/en/skills","description":"使用现成 skill 文件和加载方式保存操作说明。","id":"claude-skills"},{"title":"vLLM · Claude Code Integration","url":"https://docs.vllm.ai/en/stable/serving/integrations/claude_code/","description":"使用兼容接口连接本地 Qwen；具体模型、tool call 和 trajectory 仍需实际检查。","id":"vllm-serving"},{"title":"NVIDIA Nemotron 3 Super · Technical Report","url":"https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Super-Technical-Report.pdf","description":"第21页“Financial Reasoning”：按公司与年份扩展题目，绑定对应财报，并筛选候选回答构建训练数据。","id":"nemotron-data"},{"title":"Microsoft Foundry · Synthetic Data Generation","url":"https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation","description":"参考从文档和 OpenAPI 说明生成问答及工具题目的方法；不据此假定该服务支持训练本项目的 Qwen。","id":"foundry-data"},{"title":"Salesforce Koa · Technical Paper (2026)","url":"https://arxiv.org/html/2609.15066","description":"§3说明任务规范、persona/scenario、NeMo Gym及GRPO；可由helper模拟工具，不等于本项目真实工具执行后SFT。","id":"koa-data"},{"title":"Axion 1.0: Open Agent Foundation Models, Simplified (2026)","url":"https://arxiv.org/html/2611.03233v2","description":"§2.1–2.2 给出两类任务的定义，§3.2 给出分阶段训练设计。A/B 是本项目对两类任务的简称。","id":"axion"},{"title":"Agent-R: Training Language Model Agents to Reflect via Iterative Self-Training (2025)","url":"https://arxiv.org/abs/2501.11425","description":"参考从错误历史学习正确恢复；本项目未实现原文MCTS分支搜索与拼接。","id":"agent-r"},{"title":"Re-ReST: Reflection-Reinforced Self-Training for Language Agents (EMNLP 2024)","url":"https://aclanthology.org/2024.emnlp-main.861/","description":"参考环境反馈检查；本项目不训练原文独立reflector，不称完整复现。","id":"re-rest"},{"title":"ReSTᴱᴹ: Beyond Human Data (2023 / 2024)","url":"https://arxiv.org/abs/2312.06585","description":"借鉴生成、筛选、训练循环；原文每轮从base重训，本项目从各组保留的LoRA继续。","id":"rest-em"},{"title":"DSCodeBench · Controlled coding comparison","url":"https://arxiv.org/html/2505.15621v3","description":"查题目构造和 DS-1000对照成绩；不代表本项目180B 成绩。","id":"dscodebench"},{"title":"DABstep · Evaluation protocol","url":"https://arxiv.org/html/2506.23719v1","description":"查 public dev set、隐藏答案和官方评分方法。","id":"dabstep-paper"},{"title":"DABstep · Official leaderboard","url":"https://huggingface.co/spaces/adyen/DABstep","description":"查题库版本、成绩是否经过验证及提交评分要求。","id":"dabstep-leaderboard"},{"title":"DSBench · Source and task manifests","url":"https://github.com/LiqiangJing/DSBench","description":"查金融分析和预测题；regression 题不强制使用线性模型。","id":"dsbench"},{"title":"FinSearchComp · ICLR 2026","url":"https://proceedings.iclr.cc/paper_files/paper/2026/file/4d42358702dff82e1436550a05ade260-Paper-Conference.pdf","description":"查题目、数据时间要求和评分方法；工具 trajectory 是否可用需检查发布文件。","id":"finsearchcomp-paper"},{"title":"FinSearchComp · Implementation","url":"https://github.com/randomtutu/FinSearchComp","description":"区分完整题库和 AkShare 可用子集，确定本项目可访问的资料来源。","id":"finsearchcomp-code"},{"title":"DocFinQA · Original paper","url":"https://aclanthology.org/2024.acl-short.42/","description":"查给定长财报中的数值问答题目。","id":"docfinqa"},{"title":"FinDeepResearch · Original benchmark scale","url":"https://arxiv.org/abs/2510.13936","description":"查64个公司研究题目和15,808个报告检查项的区别。","id":"findeepresearch"},{"title":"DAPO · Original paper","url":"https://arxiv.org/html/2503.14476v1","description":"§3.2–3.4说明 Dynamic Sampling、token-level loss 与超长奖励处理；金融工具任务的生成长度计量和未完成回合规则是本项目备选适配。","id":"dapo-paper"},{"title":"verl · DAPO recipe and implementation FAQ","url":"https://verl.readthedocs.io/en/latest/algo/dapo.html","description":"核对筛组、token-mean 与软长度奖励配置；FAQ说明 Overlong Filtering 并非所有实验都启用。","id":"dapo-implementation"}],"footerNote":"Agent Learning Flywheel · 金融 LLM agent 的逐轮改进方案。","attribution":"布局与呈现方式参考","backToTop":"返回顶部","candidateTaskIntro":"任务按解题前所需信息是否已给齐分为两类。分类借鉴 ByteDance 的 Axion 1.0 §2.1–2.2，本项目用 A/B 作简称。","candidateTaskDefinitions":[{"label":"A 类任务（self-contained reasoning）","description":"题面已给齐必要信息，模型基于这些信息推理或计算；可用 Python 帮助计算，无需另找缺失事实。"},{"label":"B 类任务（tool-dependent reasoning）","description":"题面缺少必要信息，模型须先用工具补齐，再推理或计算。本项目也把先读本地文件取得缺失资料的任务计入 B 类。"}],"candidateTaskExample":"例如，同样是计算两年收入的变化百分比：题面给出所需收入数值时属于 A；需要先读取或检索财报取得这些数值时属于 B。","candidateDataNote":"D_A、D_B 分别是本轮 A、B 类任务完整执行并验收通过后形成的新增训练记录集合。两类任务都允许调用工具。","candidateDataRationale":"分开保留 D_A、D_B，便于比较仅用新增 D_B、混合 D_A/D_B 与先 D_A 后 D_B 三种训练安排；其中先 A 后 B 借鉴了 Axion 先训练基于已知信息的推理、再训练借助工具获取信息并求解的两阶段 SFT 设计。","candidateNote":"下表前三项比较训练数据组成或顺序；Skill-only 是另行运行的更新策略对照。更新策略实验中，adaptive 允许先改 Skill 再训练，也可只改 Skill 或在现有 Skill 已核验时直接训练；Skill-only 只改 Skill，training-only 固定 S₀、只训练。三者从同一 M₀／S₀ 独立运行，使用相同的审查分工和资源上限；比较的是完整更新策略，不能把联合变化的收益单独归因于一个组件。","execution":{"synthesisSource":"NVIDIA 的 Nemotron 3 Super 金融合成数据方案将已有题目扩展到不同公司和年份，关联相应财报，并从多个候选回答中筛选训练样本。","synthesisReuse":"本项目借鉴了这一设计，在 F02–F04 中让合成题目绑定 Train 资料，并在完整做题与验收后收录训练示范。","intro":"CME 的三路分流和 C1–C5 仍是检查基础；Flywheel 增加题目合成与 LoRA SFT。M₀ 是固定初始模型，trajectory 是一次真实做题的完整记录。全对且 C1、C2 都通过的题从上方结束，不进入 F01。C3–C5 已确认的错误交给 F01 汇总，决定先改 Skill，还是直接训练；修好 Skill 后仍做错，可在同轮继续训练。固定题单与来源复现条件见设置。","status":"本图和表描述最新目标方案：Program／Opus 驱动主循环，人工异步抽查并可外部叫停。本次只改网页与代码 handoff，未改实验代码、冻结配置或实际数据；现有实现仍有等待人工的状态，不能把异步抽查或同轮 Skill→训练写成已经运行。原 16K、每题两次、固定 M₀ 示范及预算边界保留。","image":"./assets/flywheel-architecture-zh.svg?v=80ed905b1738","alt":"Flywheel 流程图：复用 CME 的检查与绿色流程，扩展合成题、训练示范验收和 LoRA SFT。","caption":"图 A：蓝色为 C1–C5 检查，绿色为写改 Skill、重做检查题和比较成绩，紫色为 Flywheel 增加的步骤。先看 Skill 有没有问题：有问题先改；没问题但模型仍做错，就合成数据并微调。 人工异步抽查不在必经路径上；发现自动审查漏判后，才从外部叫停。","fullSize":"查看完整大小的流程图","commonTitle":"共用 C1–C5：检查与失败处理","commonHeaders":["图中位置","这一步做什么","审查","不同结果怎样继续"],"commonRows":[["同题重复做 → 按结果分三类","同一道诊断题重复做，再把结果分成全对、有对有错和全错，用来决定先检查哪里。","不另设内容审查。程序按同一模型、工具、资料和预算运行，保存实际答案、操作和分数；参考与评分是否正确由 C1、C2 检查。","全对→C1、C2；两项都正确就结束本题，沿用原设置，下一轮抽别的题检查。\n部分对错→直接进入 C3，比较成功与失败的具体操作。\n全错→C1、C2；两项都正确再进入 C3。"],["C1 参考答案","先确认用来对答案的参考本身正确，避免拿错答案检查模型。","Program：核原文数字、单位与舍入，并独立重算。LLM as a judge：在规则难以判断时，核原文中的实体、指标、期间和公式是否适用，并指出依据。执行模型自查只提供待核线索。","参考正确→C2；有误→修正参考、统一重评并重新分流。\nOpus 不确定→在原预算内自动补证、复查；仍未确认→这项先不用，继续其他题，合成执行交 F04 处理。随机抽中仅进入异步人审队列，不等待签字。"],["C2 判分","确认评分方法能把对错判准，避免把答对判成错，或把答错判成对。","Program：用已知正确和错误的控制答案检查评分程序的误判。LLM as a judge：对规则难以判定的语义评分，按原文、已核参考和固定标准逐项检查；用另外的控制答案核验 judge，不能靠其自评证明正确。","判分正确→全对组结束本题，全错组进入 C3；有误→修评分规则或 judge 标准、用独立控制复查、统一重评后分流。\nOpus 不确定→自动补查，未确认的评分暂不作依据；其他明确项继续。人工抽样不阻断流程；验收留出题不用于修改 judge。"],["C3 有没有漏掉必需的调用","根据问题判断哪些工具操作必不可少，再查有没有漏做。","Program：按可执行的任务要求检查必需文件、工具返回和操作是否齐全。LLM as a judge：当要求不能直接写成规则时，对照问题、原文和完整执行记录，判断是否漏掉必要调用；不能以调用次数代替完成必要工作。","有遗漏→补执行，并查看 Skill 是否缺少触发条件或必要步骤；把已发现的规则问题留到后面写入或修订 Skill。\n必需调用已查清→C4。\n无需工具→跳过 C4，进入 C5；必要性不明则补证据。"],["C4 每次调用有没有做对","逐次查看工具调用，确认查的对象、参数、原始返回，以及对返回的理解和使用都正确。","Program：核参数格式、实际执行状态、原始返回、重算结果与单位，并在隔离工作区复现可测试疑点。LLM as a judge：在程序无法决定时，核参数是否符合问题、返回是否被正确读取和使用，并引用实际记录。","参数、读取或使用错误→先纠正，再判断是否需要把正确做法写进 Skill。\n工具本身故障→修工具并重做该步，不能只改 Skill。\n调用查清后→C5；已发现的规则问题继续保留。"],["C5 整体步骤是否合理","把整段做题过程连起来看，判断步骤是否完整、先后是否合理，以及 Skill 的规则是否适用。","Program：核可明确规定的步骤、依赖与记录。LLM as a judge：Opus 对照问题、原文和实际执行，判断 Skill 是否写错、模型是否仍执行错误。Flywheel 当前或新版 Skill 在 C5 核验；新版本保留两次分开的 Opus 会话，之后复用有效结论。人工异步抽查，不是这一步的等待条件。","CME：规则确有缺陷→写出新版 Skill；规则正确但执行错误→纠正执行并重做。\nFlywheel 诊断→F01 读取自动检查结论；核新版 Skill 时，通过→直接重做检查题，有误→修订后回 C5；仍不确定→这项暂不用，继续其他明确项。新版核验不再返回 F01 重写一遍。"]],"greenTitle":"共用绿色步骤：写改、检查、比较和保留","greenHeaders":["图中位置","这一步做什么","审查","不同结果怎样继续"],"greenRows":[["写出新版 Skill","把有依据的做法写成新 Skill，或修正已有 Skill 的适用条件与步骤。","本步写候选。Flywheel 新版只交 C5 核规则一次；具体规则、来源与适用范围的检查不在这里重复。","部分对错可写新或修订；全错只修已有规则的明确缺陷。Flywheel：C5 自动确认新版规则→重做检查题；有误→修订；仍未确认→这版暂不用，处理其他明确问题，不等人工抽查。CME 按原流程继续。"],["用新版重做检查题","让当前模型使用新版 Skill 重做固定检查题，保存实际答案、完整执行记录和分数，看它是否还会做错。","不另设审查。程序用已确认的参考答案和评分方法计算这次新输出的分数；不重复审 Skill，也不为“看结果”另开 Opus 或人审。","Flywheel：仍有已确认执行错误→F02 合成并训练；没有→比较 Skill-only 组合。只在出现新的参考、判分或执行疑点时回 C1–C5。CME 按其原有结果规则继续。"],["用未参与本次修改的题比较","让原设置和新版解答同一批额外题目，比较这次修改有没有改善成绩或损害其他能力。","不另设 judge 或人审。程序在相同题目、工具、资料、预算和评分下计算比较结果；条件改变则修复后同条件重跑。","比较有效→决定版本。\n条件失配或证据未决→修复后重新比较，暂不决定保留。"],["决定版本 → 记录设置 → 继续或停止抽样","根据比较结果选择本轮采用的版本，保存设置，作为后续检查或下一轮的起点。","不另设内容审查。程序按预先固定的采用与停止条件读取分数，并保存选定模型和 Skill。","达到保留条件→采用新版；未达到→恢复本轮原设置。只纠正执行、没有候选时不作候选比较。\n记录后仍需继续→按固定计划抽题；已到停止条件→结束。"]],"tableTitle":"Flywheel 新增环节与专用条件","tableIntro":"四列依次解释图中位置、实际操作、谁检查什么、每个结果去哪里。C1–C5 不再重复定义；下表解释新增步骤与 Flywheel 的专用条件。“当前采用组合”和“已核验 Skill”分开保存；一次循环可先修 Skill，再在固定新版 Skill 下训练。","headers":["图中位置","这一步做什么","审查","不同结果怎样继续"],"rows":[["F01 该改 Skill，还是训练模型？","这里只处理已确认的错误：Skill 有问题先改；Skill 已检查没问题，模型仍全错或时对时错，就针对这些错误合成训练题、微调模型。全对且 C1、C2 通过的题已在上方结束。","本步不重复审查。程序提供实际得分和来源复现计数，Opus 的 C1–C5 结论判断 Skill 是否正确、错误是否仍来自模型执行。人工异步抽查，不等人工签字才选分支。","只改 Skill：Skill 修好后，模型已能做对检查题→比较新旧 Skill，决定是否保留新版。\n先改 Skill 再训练：Skill 修好并经 C5 确认，模型仍全错或时对时错→F02 合成数据并微调。\n直接训练：现有 Skill 已确认没问题，模型仍全错或时对时错→直接 F02，不必再改一次 Skill。\n资料或自动结论未确认→补查该项，其他明确项继续；不能把未确认记成没错。"],["F02 针对模型的错误编训练题","围绕已确认的执行错误，从 Train 资料编出新题和候选参考答案，为模型补充有针对性的练习。","不重审 Skill，复用 C5 对当前版本的有效自动结论，不等人工抽查。程序核 Train 来源白名单、来源隔离、A/B 归属与 Skill 版本；新题和参考在 C1、C2 核实。题目由 CLIProxyAPI Opus 5.5/high 生成，保留原预算和出题资格要求。","题目可答、参考已核实且来源隔离通过→F03。\n来源、参考或隔离有误→拒收，或修正后重做 F02 检查。\n后端或证据未核实→暂停；改变后端须另立实验版本并重做同条件检查，不在实验中自动回退。"],["F03 用初始模型 M₀ 做题","让固定初始模型 M₀ 使用真实工具做题，记录它实际怎样查资料、计算并回答，供后面筛选训练示范。","本步不审查做题质量。程序固定 M₀、Skill 和真实工具，隐藏参考及 gold 反馈并保存完整记录；答案与过程是否正确统一交后面的 C1–C5。","一次完整执行结束→图中“共用 C1→C2→C3→C4→C5”检查，再到F04决定准入。\n本次执行被拒收且还有次数→从F03重新做；每题最多三次从头尝试，取首个独立验收通过的完整执行。次数用尽→固定计划下一题。\n同一次执行中的纠错也消耗该次预算；新执行必须重新验收，不能沿用旧记录的通过结论。"],["合成题 C1–C5 → F04 只收检查通过的完整做题记录","逐项检查合成题和完整做题记录，决定这次执行能否用于训练；最后答对并不表示前面每一步都正确。","内容只在 C1–C5 自动审一次；F04 读取结论，不再另开 judge。程序核原件、gold 隔离、错误输出的监督标记及完整 16,384-token 窗口。自动通过即可准入；随机抽中或人工尚未看完，只改变异步审计状态。","必需自动检查通过→F05，不等人工抽样结果。\n题目、参考或评分有误→修复后重查；Opus 不确定→按原预算自动补查，该次执行未确认就不收，继续其他候选。\n明确执行错误、缺窗口或过长→拒收该次执行；证据未确认→暂不用该次执行。剩余次数内回 F03，否则处理计划下一题。错误输出不作正确监督，已独立验收的后续纠正仍按原 mask 规则保留。\n人工发现漏判→外部暂停并追查受影响记录。"],["F05 训练题的数量和题型够了吗？","数一数已验收的完整题目，确认 A 类、B 类和各题型都有足够的训练题。A/B 的含义见“对比方案”。","仅程序计数：按完整合格题核 A、B 各 128 题及固定题型配额；响应数或窗口数不能替代题数。不另设 judge 或人审。","题量和题型配额齐全→F06。\n未齐且固定计划还有候选→处理下一题；需下一批则回F02。\n计划耗尽仍不足→沿用原设置，结束本轮，不训练或降低标准。\n预算耗尽→记录未完成并停止。"],["F06 分别训练三组模型","按各自固定的数据安排，分别训练三组模型的 LoRA 附加参数；模型原有参数和 Skill 保持不变。","不另设内容审查。程序执行固定训练配方，记录真实参数更新，并检查断点恢复、导出和重新加载；本阶段保持 Skill 不变。","训练、恢复和回载通过→比较原组合、中间 Skill-only 组合与最终组合。\n设施故障→修复后恢复同轮；预算不足或未完成→保存状态并停止，不伪称训练成功。已通过规则核验的 Skill 版本另存，不能把训练失败写成规则必然错误。"],["绿色：写出新版 Skill → 用新版重做检查题","新版写好后交 C5 确认规则；通过后直接运行固定检查题，看当前模型是否还会做错。","重做和看结果不再审查。程序按已确认的 C1、C2 标准记录本次结果；保留 DocFinQA、DSCodeBench 各前两题及实际改动所涉 Train 题。C5 的规则结论和模型这次得分分开保存。","C5 发现规则错误→修订后回 C5；仍不确定→自动补查，这版未确认就暂不用，不等人工队列。\nC5 通过→重做检查题；仍有已确认执行错误→F02，同轮接训练；没有→比较 Skill-only 组合。\n模型答错不否决已确认的规则；只有新疑点才回 C1–C5。人工在外部异步抽查。"],["绿色：比较修改前后的做题成绩 → 决定是否保留 → 继续或结束","比较修改前、只改 Skill、训练后这三种设置的做题成绩，决定本轮使用哪个 Skill 和模型；已确认正确的 Skill 另行保存。","不另设 judge 或人审。程序分别计算固定 Train 改善、代表性留出成绩和原退化保护。LoRA 与同一 Skill 下的旧模型比较；最终组合另与本轮起点比较。中间得分不阻断训练，详细门槛见设置和评估指标。","仅改 Skill：规则核验、固定 Train 改善、代表性留出不降和原保护均通过→可采用，未涨 1 个百分点不单独否决。\n联合更新：在同一新版 Skill 下核 LoRA 收益，并检查最终组合的 Train 改善和相对本轮起点的留出保护；模型不合格时只能采用其本身合格的 Skill-only 组合。\n缺类或样本过稀→标记覆盖待补、保存已验证 Skill，不把它记成规则错误或自动通过。未采用组合不抹掉规则证据；当前组合改变才算保留更新，其他停止／暂停条件保留。"]],"notes":["结论只核一次：C1–C5 的自动结论绑定具体 Skill／任务／执行版本、适用范围、来源和审查配置；对象改变或新疑点才重查，同一对象不重新抽签。真实执行中“模型没做对”可成为训练依据，不与 Skill 规则核验混为一个值。自动通过＋待人工抽查可以继续；自动检查的未确认结论不能假记为通过、失败或“没有问题”；实际答题分数照实保存。","留出集怎样使用：先冻结主要类别、来源组隔离和各类绝对题量，近似目标任务分布；不追随每轮自适应补题配比。Skill 在固定 Train 检查题更好且代表性留出不降，可作为采用条件；这不是统计上证明没有退化。按类报告与配对不确定性仍保留，缺类或过稀先视为覆盖不足，不把未涨分直接判成 Skill 无效。","配额怎样分配：在最终用于本轮合成的已核验 Skill 下，统计仍存在的模型执行错误；四类为财务计算、表格操作、来源对应和可测试代码。每类所涉不同 Train 来源组数加一，用最大余数法分配 128 个位置，同一配额分别用于 A、B。先取比例整数，剩余分给小数余数最大的类，同余数按类别名排序。新版 Skill 已修复的问题不继续冒充剩余执行错误；配额在生成前固定。"],"jumpHint":"点击图中方框可查看对应行；C1、C2可分别点击。","backToDiagram":"返回流程图","reviewPolicy":"主循环由程序和 Opus 自动推进：Program 先做能可靠判定的检查，CLIProxyAPI Opus 5.5/high 搭配 Claude Code 判断 Skill 是否有问题，以及真实执行中是否仍有反复出现的错误。人工在图外异步抽查；已自动确认的对象不因抽中或尚未人审而等待。Opus 仍不确定的对象先自动补查，未确认就暂不用，继续处理其他明确对象。人工发现漏判时可从外部暂停。","humanReview":{"title":"人工异步抽查，发现漏判再从外部叫停","items":["主循环不等签字：程序和 Opus 已确认的结论可继续用于诊断、合成、训练和版本比较；随机抽中、人工未看完，不是阻断条件。","怎样抽：确定的 Train 侧结论按完整审查单元以 5% 概率抽样；同题两次执行、一个 Skill 候选或一次合成执行各算一个单元。seed 和单位标识预先固定，修订不重抽、不强制每类至少一条；Opus 不确定项另外异步送看。仅以 256 条确定且合格的合成记录为例，随机部分期望约 13 份，其他对象另计。","看什么：新旧 Skill 差异、原文／计算依据、最多两条代表 Train 记录、完整原件链接及 Program／Opus 结论。人工先记录自己的判断，再对照 Opus 理由，检查它有没有漏看规则错误或模型执行错误。","发现漏判再介入：人工可独立发出外部暂停信号，不需要 Opus 再次同意。先暂停新任务，隔离受影响的 Skill、样本和模型版本；修正并重验后由外部明确恢复。问题可能在样本已入库或模型已训练后才发现，历史记录和实际消耗都保留。","Opus 不确定不算通过：先在原次数／预算内自动补查；仍未确认的对象暂不使用，继续其他明确项。若本轮没有足够自动证据，就记未完成，不伪称“没有问题”或收敛，也不挂起整轮等人工队列。人工后续补充的证据回到相应自动检查点复核。"]}},"dataSplitNote":"下表是现有 data-v2 的实际统计；新的分层验收计划见下方“留出集覆盖”，尚未重新切分数据。actor 是实际做题的模型，teacher 是为训练产生执行示范的模型。拆分数依次为 Train／diagnostic validation／selection validation／test：分别供诊断与生成训练题、接入试跑与错误类型统计、选择版本、最终评测使用。同一报告、工作簿或任务及其派生题归入一个来源组，各 split 隔离来源组；各行说明是否沿用官方拆分。","dataCoverage":{"title":"留出集覆盖：当前缺口与新拆分计划","intro":"当前 selection 主要按来源组哈希切分，没有对合成使用的四类能力逐题分层。下表是已有 data-v2 元数据审计，不是模型效果，也不表示新留出集已经合格。新版本先固定官方 subset 与主要能力的覆盖、配比及独立来源数量，再开始改 Skill 和训练。","headers":["验收范围","现有 actor-selection","已发现的覆盖问题","新版本怎样处理"],"rows":[["DocFinQA · 财报问答","258 题／40 个来源组","没有直接映射到四类能力的逐题标签，不能仅凭总数推断所有口径和题型都覆盖。","先按预定能力标签审计，再冻结各类数量和来源隔离。"],["FinSearchComp · T2/T3","T2 17 题，T3 10 题；共 27 个来源组","Complex–Global 只有 3 题；现有分配没有题型保底。","按官方 subset 与预定能力检查覆盖，不能只满足总题数。"],["DSCodeBench · 四类库","numpy 8、pandas 6、scipy 13、sklearn 6 题；共 33 组","库类别出现不等于每种操作或能力有足够独立题。","保留库标签，另审计实际能力类别的来源数。"],["DSBench analysis · 表格分析","16 题／2 个工作簿组","同一工作簿的多题不能当成更多独立来源。","先补足独立工作簿；不足时仅作有限范围观察。"],["DSBench modeling · 建模","1 题／1 个 competition，且为 regression","Train 的 2 题都是 classification；当前选择题不能直接验证分类 Skill 改动。","需新增独立 competition 或缩小声明范围，不能仅重排几道题就称足量。"],["FinDeepResearch · 市场报告","7 题／7 个市场组","Australia 唯一 selection 留给 teacher，actor 没有该市场；报告 judge 仍需资格。","不得挪用 teacher 预留；补独立材料并完成评分资格。"],["DABstep","没有 selection 池","Hard 375 题是最终 test，不能拿来临时选 Skill。","另找独立验收来源，或只在最终测试报告该范围。"],["IFEval · 指令遵循","223 题／223 个 group_id","仍需核对 actor 角色下各指令族的数量，不能只看总数。","补齐按角色的族别审计，作为退化保护。"]],"note":"题数与来源组数都要报告；这里的 group_id 计数尚不等于已证明语义模板完全独立。各类绝对数量应依据诊断试跑波动和要识别的变化预先确定，分层不能凭空增加样本量。留出配比对齐固定目标分布，不追随每轮自适应补题；最终 test 和 teacher 预留保持不动。覆盖不足先补资料或限制适用范围，不把未涨分直接当作 Skill 无效。","auditLabel":"查看当前覆盖统计"}},"en":{"titleLead":"Improving","titleRest":" a 180B Financial LLM Agent","titleSecond":"with Claude Code, skill and LoRA SFT","affiliation":"ACM Club Practicum Project · UIUC","subtitle":"Revise the Skill, train directly, or revise then train · Three fixed training recipes","computeLine":"Planned hardware: 4 × RTX PRO 6000 96GB · BF16 LoRA · n-gram embedding on CPU","status":"Research Design","navigation":"Project navigation","methodLabel":"Execution steps","modelLabel":"Model Card","referencesLabel":"References","abstractHeading":"Abstract","abstract":"Financial LLM agents retrieve evidence, use tools and support their answers with sources. Agent Learning Flywheel is a proposed improvement process for Qwen3.8-Flash-Next, an approximately 180B model. It separates whether a Skill—the instructions read during a task—is correct from whether the model can execute it. Each round uses actual trajectories, or complete execution records, to choose Skill revision, training with a verified existing Skill, or Skill revision followed by synthesis and training in the same round. Reliable program checks run first; CLIProxyAPI Opus 5.5 (high), using Claude Code, judges remaining semantic criteria. Humans independently audit a 5% sample of definite findings and review uncertain items asynchronously. The loop does not wait for human sign-off; a human can stop it externally after finding a missed problem. A verified Skill is not discarded merely because the current model cannot yet follow it. Opus generates questions; fixed initial M₀ produces demonstrations with real tools. Accepted complete records support supervised fine-tuning (SFT) with low-rank adaptation (LoRA), updating added parameters while base weights stay fixed. Three actors retain the B-only, Mixed and A→B recipes. Fixed Train checks and a held-out set covering major task types will measure improvements and regressions, comparing the starting system, intermediate state and final model–Skill combination.","contributionsLead":"Our Contributions are:","contributions":[{"title":"Verify rules before deciding whether Skill revision needs model training","description":"Separate Skill verification from current-model execution. Allow revision followed by training in one round, and record verified rules separately from the adopted model–Skill combination, so an unchanged intermediate score does not prevent adaptation."},{"title":"Generate tasks from common errors and verify complete executions","description":"Plan to use Opus 5.5 (high) via CLIProxyAPI to generate questions and candidate reference answers from Train materials around common errors. After independent checks of those answers, fixed M₀ executes the tasks with real tools; accepted complete trajectories form shared training samples for comparing three fixed training recipes."}],"dataHeading":"Datasets","dataHeaders":["Dataset and source","Original size and split plan","Task requirements","Capabilities trained or evaluated"],"coverageLabel":"Task requirements and limits","datasets":[{"name":"DocFinQA","url":"https://huggingface.co/datasets/kensho/DocFinQA","definition":"Read the supplied financial report, find numbers and calculate an answer.","coverage":"Check passages, accounting definitions, units and calculation arguments. Project-defined normalized exact answers require numerical equality after removing thousands separators and display dollar/percent symbols, with no numerical tolerance; text ignores case and surrounding whitespace.","role":"Train source-grounded financial reading, accounting definitions, units and verifiable calculations; evaluate whether these abilities transfer to held-out reports.","size":"Official: 7,437 tasks; data-v2 retains 4,738\ndata-v2: train 2,504 / diagnostic validation 1,036 / selection validation 276 / test 922. Official dev contributes 774 diagnostic tasks after six duplicates are removed. Split train by report; remove 2,659 train tasks whose reports are reserved for test and another 34 within-train duplicates.\nOf selection, 258 tasks serve actor/Skill selection and 18 remain reserved for the fixed teacher, unused in this primary experiment."},{"name":"FinSearchComp · T2 / T3","url":"https://huggingface.co/datasets/ByteSeedXpert/FinSearchComp","definition":"T2 retrieves historical facts; T3 combines time periods and sources before calculating an answer.","coverage":"Needs working search, page reading and relevant financial-data APIs. Treat time-varying T1 separately. Published questions do not themselves provide complete trajectories.","role":"Diagnose retrieval failures on Train tasks; evaluate finding historical financial evidence, checking dates and sources, and computing answers from retrieved material.","size":"Public: 635 tasks, T1 244 / T2 219 / T3 172; data-v2 retains all 391 T2+T3 tasks\ndata-v2: 277 / 38 / 38 / 38. Group by source question and exclude T1. Test questions and rewrites cannot enter training. Task files are available; source availability has not been checked for every web task.\nOf selection, 27 tasks serve actor/Skill selection and 11 remain reserved for the fixed teacher, unused in this primary experiment."},{"name":"FinDeepResearch","url":"https://huggingface.co/datasets/OpenFinArena/FinDeepResearch","definition":"Find sources, calculate measures and write a company research report in the requested structure.","coverage":"Official reference reports and rubrics, the itemized scoring rules, are evaluator-only. The actor receives the report structure and retrieves evidence itself. A limited control calibration passed; complete official scoring and quality on real tasks still need validation.","role":"Evaluation only: test complete company research with source cutoffs, supported numerical claims and citations. Reports from evaluation companies never train the model.","size":"64 public company tasks across eight markets; data-v2 retains all, without training\ndata-v2: 0 / 8 / 8 / 48. Each market contributes one diagnostic, one selection and six test companies. Keep evaluation companies’ reports and derived questions out of training.\nOf selection, 7 tasks serve actor/Skill selection and 1 remains reserved for the fixed teacher, unused in this primary experiment."},{"name":"DSCodeBench · Relevant Subset","url":"https://github.com/ShuyinOuyang/DSCodeBench","definition":"Choose data processing, statistics and modeling code tasks using Pandas, NumPy, SciPy and Scikit-learn.","coverage":"Retain NumPy, Pandas, SciPy and Scikit-learn tasks. Score with official tests plus CPU comparator fixes: remove unused neural-library imports and check four previously discarded comparison results. The new official_tests_with_cpu_shape_and_mask_v2 metric checks array shape and mask before the original value comparison. In an actual Train control, the correct answer passed 200/200 cases and an added leading dimension passed 0/200. Old metric passes require revalidation; the full subset has not been rescored.","role":"Train executable data cleaning, array operations, statistics and modeling code; evaluate passing held-out task tests, including edge cases.","size":"Official: 1,000 tasks; data-v2 CPU subset: 405\ndata-v2: 285 / 40 / 40 / 40. Group by code structure with function and variable names normalized; semantic template families still need review. Exclude image, audio and neural-library dependencies. Keep reference code and test scripts outside actor inputs.\nOf selection, 33 tasks serve actor/Skill selection and 7 remain reserved for the fixed teacher, unused in this primary experiment."},{"name":"DABstep · Hard","url":"https://huggingface.co/datasets/adyen/DABstep","definition":"Read payments, fee rules and business files, then filter, join, aggregate and calculate.","coverage":"Primarily data processing rather than predictive-model training. Official main-test answers are hidden; 2025 paper results are not current 180B results.","role":"Final external evaluation only: test reading payment-business files, filtering, joining, aggregating and computing fees. Public dev checks integration only.","size":"Official: 450 tasks, including 378 Hard; data-v2 retains 375 Hard test tasks\ndata-v2: 0 / 10 / 0 / 375. Use ten public dev tasks for integration; remove the three dev overlaps from Hard test. The 375 tasks are reserved for final external scoring. Dev scoring and export format pass local controls using official code; no external submission has occurred. The endpoint requires 450 IDs; leave the other 75 answers blank and compute the project mean over these 375 IDs from the official per-task task_scores for that submission."},{"name":"DSBench · Financial Analysis and Modeling","url":"https://github.com/LiqiangJing/DSBench","definition":"Analyze workbooks, or clean tables, create features, fit classifiers or regressors and output predictions.","coverage":"The modeling subset contains three Santander tasks, Porto Seguro and bank churn: four classification tasks and one regression task. Use each official task metric and RPG, the improvement relative to the official baseline. Prefer CPU execution.","role":"Use analysis tasks to train and evaluate workbook reading, combined table operations and independently checked calculations. Financial modeling tasks supplement evaluation of leakage-free features, classification or regression, and prediction-file generation; report each task separately.","size":"Official: 466 analysis + 74 modeling; data-v2: 466 analysis + five financial-modeling tasks\nAnalysis data-v2: 341 / 70 / 26 / 29, grouped by 38 workbook sources. Modeling: 2 / 1 / 1 / 1, grouped by competition. Within each modeling task, split labeled training rows 80/20 for fitting/tuning and keep the official resplit test labels evaluator-only. Submission-template IDs now match test IDs.\nAnalysis selection uses 16 actor/Skill tasks from two workbooks; 10 are teacher-reserved. Its one modeling selection task serves the actor."},{"name":"IFEval","url":"https://huggingface.co/datasets/google/IFEval","definition":"Check whether responses satisfy specified format, length, keywords and other instructions.","coverage":"Check general instruction-following declines, not financial correctness.","role":"Evaluation only: check whether Skill updates or training preserve compliance with explicit format, length and keyword instructions, guarding general instruction following.","size":"All 541 prompts; data-v2 custom validation/test split\ndata-v2: 0 / 0 / 270 / 271. Validation checks updates; test runs only at the end. Neither enters training or task generation. Official strict prompt accuracy gives one only when every verifiable instruction in a prompt passes; otherwise it gives zero.\nOf selection, 223 tasks serve actor/Skill selection and 47 remain reserved for the fixed teacher, unused in this primary experiment."}],"candidatesHeading":"Candidates","settingsHeading":"Settings","systemCandidatesHeading":"Three training recipes and a Skill-only baseline","candidateHeaders":["Candidate system","Updates / training data","Starting point for the next round"],"candidates":[["B-only","Use only D_B among new samples. Shared seed examples are fixed verified demonstrations; replay data are previously verified executions. Add both under the support-data rules.","Continue from this group’s last kept LoRA adapter, always using B-only."],["Mixed","Mix new D_A and D_B at fixed proportions.","Continue from this group’s last kept LoRA adapter. Use the same new samples and repetitions per sample as A → B."],["A → B","Train the same LoRA adapter first on D_A and then on D_B.","Continue from this group’s last kept LoRA adapter. Keep optimizer state and learning-rate progress when moving from A to B."],["Skill-only (separate update-policy baseline)","Revise only its Skill. Keep M₀ fixed, without synthesizing SFT data or updating model parameters.","Continue from its last retained Skill, with independent diagnosis and state. This is not a fourth training-recipe group."]],"settingsGroups":[{"title":"Models and runtime","items":[["Base model","Qwen/Qwen3.8-Flash-Next in BF16. The approximately 180B release count includes n-gram embedding and MTP; the model card separately lists 125B main parameters and 6B active parameters. Record the parameters actually loaded. BF16 is the weight-storage precision."],["Actor and teacher model","Actors start at M₀ and keep separate LoRA histories; the trajectory teacher stays at M₀. The new 16K protocol fixes question generation to CLIProxyAPI Opus 5.5/high, without local-M₀ fallback. Reserve every request against the existing role allocation and cumulative US$100 cap, stopping incomplete at exhaustion; the maximum full matrix is not guaranteed funded. One actual current-format batch from two distinct Train sources passed independent numeric recomputation. The response reports claude-opus-5-5; high was requested, while effective effort was not reported. Preserve legacy M₀ preparation records; teacher, admission and complete-training qualification remain separate."],["Claude Code","Keep its version, tools, permissions, model aliases and session configuration fixed as H₀. Save source-file versions per task. Experiment scripts start, reset and record tasks; Claude Code still handles tool calls."],["Model serving","Separate formal BF16 execution from FP8 preflight. Enable thinking with Qwen effort=xhigh; temperature=1, top_p=0.95, top_k=20, min_p=0. Ordinary tasks: 32 turns, 64 tool calls, 900 seconds, 8K output per request and 32K per episode. Reports: 64 turns, 3600 seconds and 64K total output. At most two same-model children, depth one; all usage counts against the episode."]]},{"title":"Data and evaluation","items":[["Data split","Preserve actual data-v2 counts as historical facts. Before a new selection split, audit coverage by dataset, official subset and major capability, then freeze source-group separation, proportions and absolute counts. Do not add favourable acceptance tasks after a Skill fails to raise scores. Counts depend on pilot variability and the change being measured; repeated questions from one report cannot replace independent sources. Missing or sparse categories need new independent material, justified category consolidation, or a narrower scope. Unverified coverage is not evidence of ineffectiveness. Preserve Train/diagnostic/selection/test roles, the teacher reserve and final-test isolation."],["Shared training data","Each training round targets 128 complete eligible tasks per A/B class, at most 512 candidates and three teacher attempts per task. Assign source groups exclusively to A or B. Keep M₀ as teacher and share the accepted pool. Underfilled or unfunded pools do not train; never refill after selection results."],["Verification rules","Program and CLIProxyAPI Opus 5.5/high with Claude Code drive the loop. Programs handle reliable rules first; Opus judges Skill defects and persistent execution errors in C1–C5. New Skills retain two separate Opus sessions and at most two revision rounds; reuse valid version/scope/evidence findings rather than reviewing each step. Sample definite Train-side complete units with 5% probability for independent asynchronous human audits; selection/pending status is absent from automatic admission conditions. Recheck uncertainty automatically; leave unconfirmed objects unused and continue other confirmed work without parking a round for the human queue. Humans can independently pause externally after finding a missed problem; record revalidation/resume separately. Failed actor probes support training rather than automatically reject Skill rules. The new judge requires separate C1–C5 qualification. Report evaluation retains its fixed M₀ judge, whose controls cannot qualify the new model, and its existing requirements: 20 control reports, at least 40 decidable non-N/A items with at least 20 positive and 20 negative, at least 90% agreement and no acceptance of unsupported numbers or fabricated evidence. Report official N/A empty-answer credit separately. Open reports remain excluded from this round’s SFT. Code scoring retains shape/mask controls and binds the metric, sources and actual answer; admission rejects old-metric passes or fewer than 200 cases. Rule changes require a new version and rescoring of affected comparisons."],["Separate data-policy experiment","The separate data-policy experiment fixes M₀, initial skill S₀ and the Mixed training recipe, comparing repair_only, targeted_replay and source_augmentation. Arms share a new-supervision-token target with at most one complete-task deviation per arm; seed/replay support data match in tasks, response windows and repetitions. Seeds are initial demonstrations and replay comprises previously accepted demonstrations; both require re-execution under S₀. Recovery remains separate from primary quotas."]]},{"title":"Training configuration","items":[["LoRA SFT","Base weights W₀ remain BF16 and frozen. Each actor is W₀ plus its LoRA increment Δ_g,t, starting at Δ_g,0=0 and continuing its last adopted adapter. A round may verify a revised Skill, then freeze that version for data generation and LoRA SFT. Reviewing a Skill does not update weights; training does not keep revising the Skill. None of the three recipes uses QLoRA."],["Supervised token budget","Mixed and A→B share the exact complete-sample multiset and supervised tokens, the assistant tokens entering loss. Report B-only’s tolerance of at most one complete window; it is a mixture comparison. Record input tokens, repetitions, steps and GPU-hours separately."],["Data order","Build the sole consumed order offline: shuffle new A/B for Mixed, put A before B for A→B, and use identical support slots. Disable both trainer shuffles and length grouping; record sample IDs per step. For Mixed and A→B, insert one seed and replay, a previously verified execution, after every eight new windows, or two seeds when no current-skill replay is eligible."],["Optimizer and learning rate","AdamW, learning rate=1e-4, betas=0.9/0.95, weight decay=0, clip norm=1; cosine with 3% warmup. Reset once each round, preserving state across A/B. Precompute the complete schedule within 4,194,304 supervised tokens and 512 steps. Incomplete training at 24 hours cannot enter retention evaluation."],["Training pilot","The new protocol retains rank=8, alpha=32, dropout=0, attention projections in_proj/out_proj/linear_qkv/linear_proj, TP4/PP1/EP1/ETP4, micro-batch=1, accumulation=8, activation checkpointing and no packing. Complete training windows use 16,384 tokens. Check 4K connectivity, then actual 16K updates, frozen base, full-state recovery, export and new-adapter reload. The per-request 8K generation-output cap stays fixed. Preserve old 8K inputs and failed records. Settings and CPU encoding do not establish that every real task fits or replace four-GPU qualification."],["Optional RL · DAPO","DAPO (Decoupled Clip and Dynamic Sampling Policy Optimization) updates a policy from relative rewards among answers to the same question. It is a separate on-policy RL option, sampled by the current actor, the task-executing model being updated; primary B-only, Mixed and A→B comparisons remain LoRA SFT. Freeze length accounting, unfinished-episode handling and effective coverage separately. Do not directly transfer the former 4B hyperparameters."]]},{"title":"Experiment protocol","items":[["Round start","Save the three actor checkpoints, Skill, fixed M₀ teacher, generation/review configuration, manifests and budget. Track the adopted combination separately from verified Skill versions, which are not erased by a flat intermediate score. Choose Skill-only, training-only, or revision followed by training from the evidence; repair tool/source failures and resume the same round."],["Update policy","Keep 32 distinct Train tasks per actor, two matched executions per task and eight source groups from each of four datasets; repetitions add no independent groups. Eligible rule or execution gaps still need two distinct groups; all-wrong evidence only repairs a clear existing-rule defect. Revise faulty rules first; a verified revision with remaining execution gaps may enter synthesis/training in the same round. A verified existing Skill with unstable execution goes directly to training. Skill adoption no longer requires a one-point held-out macro gain: require verified rules, improvement on fixed Train checks, nondecreasing representative held-out primary and affected-category scores, and existing degradation guards. Failed actor probes can trigger training instead of an intermediate Skill veto. LoRA candidates retain their preset gain and degradation gates. Version the new flow and stratified evaluation separately; do not relabel old results. For joint updates, assess Train improvement in the final combination; the old model need not improve before training. Compare a LoRA candidate against the old adapter under the same revised Skill, retaining the one-point primary gain and existing guards. The adopted combination must also pass guards against round start; never install an adapter verified with S1 under S0 by assumption."],["Checkpoint management","All groups start with the same model. Later each keeps its own LoRA adapter. Do not restart each round from the initial model or copy the highest-scoring group’s weights into other groups."],["Paired evaluation","The primary score remains the equal-weight mean of DocFinQA, FinSearchComp and DSCodeBench CPU; data-v2 has 318 primary selection tasks plus 223 IFEval tasks as legacy split facts. A new version must freeze major-type coverage and source counts, without treating sparse secondary pools as sufficient acceptance evidence. For joint updates, record the starting combination, revised-Skill-only intermediate combination and final trained combination under matched conditions. Intermediate scores explain effects but do not block training with a verified Skill. Match changed online sources with at most one rerun; pause unresolved mismatches. Extra comparisons consume the existing budget."],["Preregistration","At most six rounds; stop after two no-update rounds. Resume infrastructure failures in the same round; exhausted budgets mean incomplete. Use three independent full-pipeline seeds with separate skill/controller/generation state. Final objective tasks have three inference repetitions, reports one. A→B−Mixed is primary; report paired source-group 95% intervals and each training-seed result. Apply Holm to four confirmatory contrasts: adaptive−Skill-only and adaptive−training-only in the update-policy experiment, plus error-directed−M₀/S₀ and error-directed−fixed-taxonomy in the generation experiment: it progressively tightens test thresholds to control false positives across those comparisons. Reused selection gates do not establish generalization."]]},{"title":"Compute resources","items":[["Hardware","Four NVIDIA RTX PRO 6000 Blackwell cards with 96GB each, nominally 384GB total. The training framework must distribute the model correctly across cards. Actual four-GPU training remains to be checked."],["CPU offload","Prefer existing Megatron-SWIFT PLE_CPU_OFFLOAD=1 for the n-gram PLE table. The table is about 95.4GiB (102.4GB); host RAM must also cover temporary loading data, process copies and task files. Check serving support separately."],["Compute budget","Use at most four current RTX PRO 6000 Blackwell 96GB GPUs and switch teacher generation, training and evaluation sequentially. Caps: 240 GPU-hours/70,000 episodes per independent pipeline seed and 1,440 GPU-hours for the study, not runtime forecasts. The US$100 subscription-equivalent cap includes prior use; reuse the existing ledger and worst-case reservations. No added cash API."],["Resource scheduling","Generate teacher-model data, train LoRA and evaluate tasks sequentially. Release the previous model service before switching. Do not keep teacher model, actors and training process resident together. Measure training and inference memory peaks, speed and CPU transfer time separately."],["Task execution resources","The new protocol enforces task-process cgroup CPU/RAM limits separately from model serving and PLE. Real Train reference/tool workloads were measured and ceilings frozen: text 1 CPU core/1GiB; code and workbooks 2 cores/4GiB; task-local modeling 4 cores/16GiB. IFEval, reports and DABstep explicitly reuse the matching Train workload class; their held-out tasks were not measured. RAM is at least four times the representative peak with these floors. These are engineering ceilings, not complete-actor measurements or optimal values. Preserve over-limit evidence and pause for repair rather than assigning a model-capability failure."]]}],"evaluationHeading":"Evaluation Metrics","evaluationNote":"Compare choosing updates from task failures with skill-only and fine-tuning-only updates using the same evaluation tasks, inference budget and scorer. Separately compare B-only, Mixed and A → B training recipes in training rounds. Aggregate each metric by dataset.","metricHeaders":["Metric","Formula and term explanation","What the formula means","Dataset using the metric"],"metrics":[["Accuracy","Accuracy = (1/N) Σᵢ cᵢ. N is the task count; cᵢ=1 when the dataset’s prescribed scorer accepts the final answer, and 0 otherwise. DABstep test uses scores from the system’s official external submission.","The fraction of tasks finally answered correctly within the prescribed budget.","DocFinQA, FinSearchComp T2/T3, DABstep Hard, DSBench analysis"],["Code pass rate","Pass rate = (1/N) Σᵢ 𝟙[all tests for task i pass]. N is the code-task count; 𝟙 is 1 when its condition holds. Use the project’s repaired CPU comparator and report tool/retry budgets, separately from native single-generation Pass@1.","The fraction whose final code passes every test after the permitted tool use and retries.","DSCodeBench CPU-relevant subset"],["Task metric / RPG","RPG = max(0, (m − b)/(r − b)). m is the task’s official metric, b its official baseline and r its reference best, with r≠b. Use each classification/regression task’s own metric, then aggregate RPG.","0 means no improvement over baseline, 1 reaches the reference best, and values above 1 exceed it; higher is better.","DSBench financial modeling subset"],["HisRubric score","Hᵣ = Σⱼ round(wᵣⱼ aᵣⱼ / 100, 2) / Fᵣ; H = (1/N) Σᵣ Hᵣ. a is the official adjusted_mark (0–100), w the item weight, round(·,2) the official per-item two-decimal rounding, F the report’s official full mark and N the report count. Fix judge, source cutoff and N/A rules.","The share of the official weighted full mark earned by each report, averaged equally across reports.","FinDeepResearch; report fixed-corpus and official-online evaluation separately"],["Strict prompt-level accuracy","Strict accuracy = (1/N) Σᵢ ∏ⱼ aᵢⱼ. N is the prompt count; aᵢⱼ=1 if instruction j of prompt i passes the official strict checker, otherwise 0.","A prompt passes only when every verifiable instruction passes.","IFEval"],["Fixed-Train check improvement","Δ_Train = S_Train(candidate) − S_Train(round start). S_Train = Σ_i w_i·mean_r(s_i,r) / Σ_i w_i over fixed tasks i, two matched repetitions r, and frozen normalized scores s∈[0,1]. Give each major type equal total weight, then each source group equal weight within that type; freeze w before candidate outputs.","A positive value means improvement on the fixed Train checks, not demonstrated generalization to new sources.","Use the Skill-only candidate for Skill-only updates and the final combination for joint updates. Match manifests, source conditions and grading. Model timeouts keep the prescribed failure score; repair infrastructure failures rather than inventing zero scores. Calculate separately for each actor. A shared Skill requires every chosen actor combination to have Δ_Train≥0 and at least one >0."]],"referenceNote":"These sources describe existing models, tools and methods.","references":[{"title":"Qwen3.8-Flash-Next · Official Model Card","url":"https://huggingface.co/Qwen/Qwen3.8-Flash-Next","description":"Check model architecture, parameter counts and download revision. BF16 is weight precision.","id":"qwen-model"},{"title":"NVIDIA · RTX PRO 6000 Blackwell","url":"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/","description":"Check the 96GB card specification; record actual card type and host connections in trial runs.","id":"nvidia-gpu"},{"title":"Megatron-SWIFT · Qwen3.8-Flash-Next Best Practice","url":"https://swift.readthedocs.io/en/latest/BestPractices/Qwen3_8-Flash-Next-Best-Practice.html","description":"Use existing BF16 LoRA and PLE-on-CPU support. Eight-GPU measurements do not establish four-GPU feasibility.","id":"swift-lora"},{"title":"Axolotl · Qwen 3.8 Flash Next","url":"https://docs.axolotl.ai/docs/models/qwen3.8-flash-next.html","description":"Check loaded parameter scope and PLE size for BF16 weight-memory estimates.","id":"axolotl-memory"},{"title":"Claude Code · Programmatic Execution","url":"https://code.claude.com/docs/en/headless","description":"Use existing command-line task execution and logging without building another tool-call loop.","id":"claude-code"},{"title":"Claude Code · Skills","url":"https://code.claude.com/docs/en/skills","description":"Use existing skill files and loading to supply operating instructions.","id":"claude-skills"},{"title":"vLLM · Claude Code Integration","url":"https://docs.vllm.ai/en/stable/serving/integrations/claude_code/","description":"Connect local Qwen through the compatible interface; actual models, tool calls and records still need checks.","id":"vllm-serving"},{"title":"NVIDIA Nemotron 3 Super · Technical Report","url":"https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Super-Technical-Report.pdf","description":"Page 21, Financial Reasoning: expand questions across companies and fiscal years, bind them to financial filings, and filter candidate answers into training data.","id":"nemotron-data"},{"title":"Microsoft Foundry · Synthetic Data Generation","url":"https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/data-generation","description":"Reference document QA and OpenAPI tool-task generation, without assuming this service trains the project’s Qwen.","id":"foundry-data"},{"title":"Salesforce Koa · Technical Paper (2026)","url":"https://arxiv.org/html/2609.15066","description":"Section 3 describes task specifications, personas, NeMo Gym and GRPO, including helper-emulated tools; it is not this project’s real-tool filtered SFT pipeline.","id":"koa-data"},{"title":"Axion 1.0: Open Agent Foundation Models, Simplified (2026)","url":"https://arxiv.org/html/2611.03233v2","description":"Sections 2.1–2.2 define the two task families; Section 3.2 describes staged training. A/B are this project’s labels.","id":"axion"},{"title":"Agent-R: Training Language Model Agents to Reflect via Iterative Self-Training (2025)","url":"https://arxiv.org/abs/2501.11425","description":"Borrow verified recovery from error histories; this project does not implement its MCTS branch search and splicing.","id":"agent-r"},{"title":"Re-ReST: Reflection-Reinforced Self-Training for Language Agents (EMNLP 2024)","url":"https://aclanthology.org/2024.emnlp-main.861/","description":"Borrow environment-feedback verification, without training the original separate reflector or claiming full reproduction.","id":"re-rest"},{"title":"ReSTᴱᴹ: Beyond Human Data (2023 / 2024)","url":"https://arxiv.org/abs/2312.06585","description":"Borrow generate/filter/train cycles. The original retrains the base each iteration; this project continues each retained LoRA.","id":"rest-em"},{"title":"DSCodeBench · Controlled coding comparison","url":"https://arxiv.org/html/2505.15621v3","description":"Check task construction and DS-1000 comparisons, not this project’s 180B scores.","id":"dscodebench"},{"title":"DABstep · Evaluation protocol","url":"https://arxiv.org/html/2506.23719v1","description":"Check public developer tasks, hidden answers and official scoring.","id":"dabstep-paper"},{"title":"DABstep · Official leaderboard","url":"https://huggingface.co/spaces/adyen/DABstep","description":"Check dataset version, validation status and submission requirements.","id":"dabstep-leaderboard"},{"title":"DSBench · Source and task manifests","url":"https://github.com/LiqiangJing/DSBench","description":"Check financial analysis and prediction tasks; numerical regression does not mandate a linear model.","id":"dsbench"},{"title":"FinSearchComp · ICLR 2026","url":"https://proceedings.iclr.cc/paper_files/paper/2026/file/4d42358702dff82e1436550a05ade260-Paper-Conference.pdf","description":"Check tasks, data-time requirements and scoring; inspect released trajectory files.","id":"finsearchcomp-paper"},{"title":"FinSearchComp · Implementation","url":"https://github.com/randomtutu/FinSearchComp","description":"Distinguish the full task bank from AkShare-compatible tasks and available sources.","id":"finsearchcomp-code"},{"title":"DocFinQA · Original paper","url":"https://aclanthology.org/2024.acl-short.42/","description":"Check numerical questions over supplied long financial reports.","id":"docfinqa"},{"title":"FinDeepResearch · Original benchmark scale","url":"https://arxiv.org/abs/2510.13936","description":"Distinguish 64 company tasks from 15,808 report checks.","id":"findeepresearch"},{"title":"DAPO · Original paper","url":"https://arxiv.org/html/2503.14476v1","description":"Sections 3.2–3.4 describe Dynamic Sampling, token-level loss and overlong rewards. Generated-length accounting and unfinished-episode rules for financial tools are proposed adaptations.","id":"dapo-paper"},{"title":"verl · DAPO recipe and implementation FAQ","url":"https://verl.readthedocs.io/en/latest/algo/dapo.html","description":"Check group filtering, token-mean loss and soft length shaping. The FAQ notes that Overlong Filtering is not enabled in every experiment.","id":"dapo-implementation"}],"footerNote":"Agent Learning Flywheel · A design for improving financial LLM agents round by round.","attribution":"Layout and presentation adapted from","backToTop":"Back to top","candidateTaskIntro":"We distinguish tasks by whether the required information is already provided. The distinction follows ByteDance’s Axion 1.0, Sections 2.1–2.2; A/B are this project’s labels.","candidateTaskDefinitions":[{"label":"A tasks (self-contained reasoning)","description":"The input provides the necessary information; the model reasons or computes from it. Python may assist computation, without retrieving missing facts."},{"label":"B tasks (tool-dependent reasoning)","description":"Necessary information is missing, so the model must first obtain it with tools and then reason or compute. This project also includes reading local files to obtain missing material."}],"candidateTaskExample":"For example, calculating the percentage change in revenue is A when both years’ figures are provided, and B when the model must first read or retrieve financial reports to obtain them.","candidateDataNote":"D_A and D_B are this round’s new accepted complete execution records from A and B tasks, respectively. Both task types may use tools.","candidateDataRationale":"Keeping D_A and D_B separate lets us compare B-only, Mixed and A → B on the new data; A → B draws on Axion’s two-stage SFT design, which trains self-contained reasoning before tool-dependent reasoning.","candidateNote":"The first three rows compare training-data composition or order; Skill-only is a separate update-policy control. Adaptive may revise the Skill and then train, revise only, or train with a verified existing Skill. Skill-only revises only the Skill; training-only fixes S₀ and trains only the model. Policies run independently from the same M₀/S₀ with matched review rules and resource caps. Their contrast measures the complete policy, not an isolated component effect.","execution":{"synthesisSource":"NVIDIA’s Nemotron 3 Super financial-data pipeline expands existing questions across companies and fiscal years, links each to the relevant filings, and filters candidate answers into training examples.","synthesisReuse":"We borrow this design for F02–F04: synthetic questions stay tied to Train sources, and complete task executions are admitted as training demonstrations only after review.","intro":"CME’s three-way split and C1–C5 remain the checking foundation; Flywheel adds task synthesis and LoRA SFT. M₀ is the fixed initial model, and a trajectory is one complete real attempt. All-correct questions that pass C1/C2 finish through the upper path without entering F01. F01 aggregates errors confirmed through C3–C5 and chooses Skill revision or direct training; errors remaining after a revision may lead to training in the same round. Settings retain the fixed manifests and source-recurrence requirements.","status":"The figure and tables describe the latest target: programs/Opus drive the loop, while humans audit asynchronously and may stop it externally. This update changes the page and code handoff, not experimental code, frozen configuration or prepared data. Existing code still has human-wait states; asynchronous auditing and same-round Skill→training are not completed runs. Preserve 16K, two executions, fixed M₀ demonstrations and budget boundaries.","image":"./assets/flywheel-architecture-en.svg?v=bea70634de92","alt":"Flywheel architecture extending the shared CME checks and green update loop with question synthesis, demonstration admission and LoRA SFT.","caption":"Figure A: blue shows C1–C5 checks, green Skill revision/reruns/score comparison, and purple Flywheel additions. Fix a faulty Skill first; if the Skill is sound but model errors remain, synthesize data and fine-tune. Human auditing runs outside the required path; a missed problem found by a human can trigger an external stop.","fullSize":"View the full-size flowchart","commonTitle":"Shared C1–C5 checks and failure handling","commonHeaders":["Location in the diagram","What this step does","Review","Where each outcome goes"],"commonRows":[["Repeat the question → Split the results","Repeat the same diagnostic question, split the results into all correct, mixed and all wrong, and use that split to choose where to check first.","No separate content review. The program runs with matched model, tools, sources and budget, then records actual answers, operations and scores. C1 and C2 check the reference and scoring.","All correct → C1/C2; finish this question if both pass. Mixed → C3. All wrong → C1/C2, then C3 if both pass. Mixed labels do not establish that the reference and scorer are correct."],["C1 · Reference answer","Verify the reference answer itself before using it to assess the model.","Program: check source values, units and rounding, and independently recompute. LLM as a judge: where rules cannot readily decide, verify the entity, metric, period and formula against cited source evidence. The executor’s self-check only supplies issues to verify.","Correct reference → C2; wrong → repair, uniformly rescore and split again. Opus uncertainty → automatically obtain evidence/recheck within the existing budget; still unconfirmed → leave this item unused, continue other questions and route a synthetic attempt to F04. Random selection only queues an asynchronous audit; no sign-off wait."],["C2 · Scoring","Verify that scoring distinguishes correct and incorrect answers without reversing their labels.","Program: test the scorer for false positives and false negatives with known-correct and known-incorrect control answers. LLM as a judge: audit semantic scoring that rules cannot decide against the source, verified reference and fixed criteria. Check the judge on separate controls; its self-assessment does not establish correctness.","Correct scoring → finish an all-correct question or send an all-wrong question to C3. Wrong scoring → repair rules/judge criteria, verify separate controls, uniformly rescore and split again. Automatically recheck uncertainty; do not rely on unconfirmed scoring, while other confirmed work continues. Human sampling does not block the flow; do not tune the judge on held-out acceptance questions."],["C3 · Required calls","Identify the tool operations needed to solve the question, then look for missing work.","Program: check required files, tool results and actions against executable task requirements. LLM as a judge: where requirements cannot readily become rules, compare the question, source and complete execution for missing necessary calls. Call counts cannot establish that necessary work was done.","Correct omissions and record any missing Skill trigger or step for later revision. Continue to C4 when required calls are known; if no tool is needed, skip C4 and go to C5. Obtain more evidence when necessity is unclear."],["C4 · Individual calls","Inspect each tool call: its intended target, arguments, raw result, and how the result was read and used.","Program: check argument structure, actual execution status, raw results, recomputed values and units; reproduce testable issues in an isolated workspace. LLM as a judge: where programs cannot decide, verify that arguments match the question and that results were read and used correctly, citing actual records.","Correct argument or result-use errors and assess whether the Skill needs a rule. Repair a faulty tool and rerun the step. Continue to C5 once the calls are understood, retaining established rule defects."],["C5 · Overall procedure","Examine the complete solution for missing or poorly ordered steps and determine whether the Skill rules apply.","Program: check explicit steps, dependencies and records. LLM as a judge: Opus compares the question, originals and execution to judge faulty Skill rules versus model execution errors. C5 verifies the current or revised Flywheel Skill; new versions retain two separate Opus sessions, then reuse valid findings. Asynchronous human auditing is not a wait condition here.","CME: confirmed faulty rules → revise the Skill; correct rules with execution errors → correct execution and rerun. Flywheel diagnosis → F01 reads automatic findings. Revised Skill: pass → directly rerun checks; faulty → revise and return to C5; still uncertain → leave it unused and continue other confirmed work. Do not route a verified revision through F01 to write it again."]],"greenTitle":"Shared green steps: revise, check, compare and retain","greenHeaders":["Location in the diagram","What this step does","Review","Where each outcome goes"],"greenRows":[["Write a revised Skill","Turn an evidenced procedure into a new Skill, or correct an existing Skill’s scope and steps.","This step writes the candidate. Send a new Flywheel Skill to C5 once; do not duplicate its rule, source and scope review here.","Mixed results may motivate a new/revised Skill; all-wrong evidence only repairs a clear existing-rule defect. Flywheel: C5 automatically confirms rules → rerun checks; faulty → revise; still unconfirmed → leave that revision unused and process other confirmed issues without waiting for a human audit. CME retains its original flow."],["Rerun check questions with the revised Skill","Run current actors on the fixed check questions using the revised Skill; save actual answers, complete executions and scores to see whether errors remain.","No separate review. Score each new output with the verified reference and scorer; do not review the Skill again or add an Opus/human review merely to read the results.","Flywheel: confirmed execution errors remain → F02 for synthesis/training; none → compare the Skill-only combination. Return to C1–C5 only for a new reference, scoring or execution concern. CME retains its original outcome rules."],["Compare on questions unused in this change","Run old and new systems on the same additional questions to check improvement and damage to other capabilities.","No extra judge or human review. Programs compare scores under matched questions, tools, sources, budgets and scoring; repair changed conditions and rerun consistently.","Valid comparison → choose the setting. Unmatched conditions or unresolved evidence → repair and compare again before retention."],["Choose the setting → Record it → Continue or stop sampling","Select and save the setting that will start subsequent checks or the next round.","No separate content review. Programs apply the frozen adoption/stop conditions to the scores and save the selected model and Skill.","Retention conditions pass → keep the candidate; otherwise restore the round-start setting. With corrected execution but no candidate, omit candidate comparison. After recording, continue the fixed sampling plan if needed; otherwise stop."]],"tableTitle":"Flywheel additions and specific conditions","tableIntro":"The four columns identify the diagram location, operation, checks and outcome routes. Shared C1–C5 definitions remain above; this table covers additions and Flywheel-specific conditions. Save the adopted combination separately from verified Skills. One cycle may revise the Skill and then train with that revision fixed.","headers":["Location in the diagram","What this step does","Review","Where each outcome goes"],"rows":[["F01 Revise the Skill or train the model?","Handle only confirmed errors here: fix a faulty Skill first; if the Skill is verified sound but model answers remain all wrong or inconsistent, synthesize tasks for those errors and fine-tune. All-correct questions that pass C1/C2 already finished through the upper path.","No repeat review here. Programs provide actual scores and source-group recurrence counts; Opus’s C1–C5 findings judge Skill validity and persistent model execution errors. Human audits run asynchronously; choosing a branch does not wait for sign-off.","Skill-only: fixing the Skill lets the model solve the check questions → compare the old and revised Skills and decide whether to keep the revision.\nRevise then train: C5 confirms the repaired Skill, but answers remain all wrong or inconsistent → F02 for synthesis and fine-tuning.\nTrain directly: the existing Skill is already confirmed sound, but answers remain all wrong or inconsistent → directly F02 without another Skill edit.\nUnconfirmed sources or automatic findings → recheck that item and continue other confirmed work; unknown does not mean no error."],["F02 Write training tasks for the model’s errors","Create questions and candidate reference answers from Train materials targeting the confirmed execution errors.","Reuse C5’s valid automatic finding for the current Skill version without another review or a human-audit wait. Programs enforce Train allowlists, source separation, A/B assignment and Skill version; C1/C2 verify new tasks and references. CLIProxyAPI Opus 5.5/high generates questions under existing budget and qualification requirements.","Answerable questions with verified references and isolation → F03. Invalid sources, references or isolation → reject, or correct and repeat F02 checks. Unverified backend or evidence → pause. A backend change requires a new experiment version and matched checks, without automatic fallback mid-experiment."],["F03 Initial M₀ solves the tasks","Have the fixed initial M₀ solve questions with real tools, recording how it retrieves, calculates and answers for later demonstration screening.","No task-quality review here. Programs fix M₀, the Skill and real tools, hide references/gold feedback and save complete records. The following C1–C5 checks assess the answer and process.","A complete attempt → the diagram’s shared C1→C2→C3→C4→C5 checks, then F04 for admission. A rejected attempt with attempts remaining → restart F03; allow at most three fresh attempts per question and take the first independently accepted complete attempt. After the limit → the next fixed-plan question. Recovery consumes the current attempt’s budget; a new execution requires new acceptance evidence."],["Synthetic C1–C5 → F04 Accept only complete attempts that pass","Check the synthetic question and complete execution to decide whether the attempt can train the model. A correct final answer does not establish that every earlier action was correct.","Review content automatically once in C1–C5; F04 reads the findings without another judge. Programs enforce originals, gold isolation, wrong-output supervision masks and complete 16,384-token windows. Valid automatic passes may be admitted; sampling or an unfinished human review only changes asynchronous audit status.","Required automatic checks pass → F05 without waiting for the human sample. Task/reference/scoring defect → repair/recheck. Recheck Opus uncertainty within existing budgets; do not admit an unconfirmed attempt and continue other candidates. Confirmed execution errors or missing/oversized windows → reject that attempt; unconfirmed evidence → leave it unused. Return to F03 within the attempt cap, otherwise follow the next planned task. Do not supervise wrong outputs; independently accepted later recovery retains existing masks. A human-discovered missed problem → external pause and trace affected records."],["F05 Enough training tasks of the required types?","Count accepted complete tasks and confirm enough A tasks, B tasks and tasks of each type. Candidates defines the A/B distinction.","Program counting only: require 128 accepted complete A tasks, 128 B tasks and the fixed type quotas; response/window counts cannot replace tasks. No extra judge or human review.","Complete task and taxonomy quotas → F06. With more fixed-plan candidates → process the next question, or return to F02 for another batch. Exhausted plan with unfilled quotas → keep the previous setting and close without training or lowering standards. Budget exhaustion → stop and record incomplete work."],["F06 Train the three models separately","Train the three actors’ added LoRA parameters using their fixed data schedules, keeping original model parameters and the Skill unchanged.","No separate content review. Programs execute the fixed training recipes, record actual parameter updates and check recovery, export and reload. Keep the Skill fixed throughout training.","Training, recovery and reload pass → compare the starting, intermediate Skill-only and final combinations. Infrastructure failure → repair and resume. Unfunded or incomplete work → save state and stop without a training-success claim. Retain the separate verified Skill record; a failed training job does not establish that its rules were wrong."],["Green: Write a revised Skill → Rerun check questions","Send the written revision to C5 for rule verification, then directly run the fixed check questions to observe whether current actors still make errors.","No extra review for rerunning or reading results. Programs score new outputs using the verified C1/C2 standards; retain the prescribed first two DocFinQA and first two DSCodeBench tasks and affected Train tasks. Save C5’s rule finding separately from these actor scores.","C5 finds faulty rules → revise and return to C5; still uncertain → automatically recheck and leave an unconfirmed revision unused, without waiting for the human queue. C5 passes → rerun checks; confirmed errors remain → F02 and same-round training; none → compare Skill-only. Actor errors do not invalidate confirmed rules; return to C1–C5 only for new concerns. Humans audit asynchronously outside this path."],["Green: Compare scores before and after → Decide what to keep → Continue or finish","Compare scores for the starting system, Skill-only revision and trained models, then decide which Skill and models to use. Save confirmed Skill revisions separately.","No extra judge or human review. Programs calculate fixed-Train improvement, representative held-out scores and existing regression guards. Compare LoRA with the prior actor under the same Skill, then compare the final combination with the round start. An intermediate score does not veto training; Settings and Evaluation Metrics give the gates.","Skill-only: verified rules, improved fixed-Train checks, nondecreasing representative held-out scores and existing guards → adoption does not require a one-point gain. Joint updates: measure LoRA gain under the same revised Skill, then check final-combination Train improvement and held-out guards against round start; an unqualified adapter can only fall back to a Skill-only combination that independently qualifies. Missing/sparse categories → record a coverage gap and preserve verified rules, without declaring either failure or acceptance. Unadopted combin
